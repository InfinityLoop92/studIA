 Era una visione più filosofica e magico-ermetica che scientifica, ma metteva in crisi l'idea di un cosmo creato per l'uomo e negava dogmi cristiani. Arrestato a Venezia nel 1592, dopo sette anni di processo fu bruciato vivo a Roma, in Campo de' Fiori, il 17 febbraio 1600, rifiutando di ritrattare."},{"id":"k189","ch":"cap-18","t":"Meccanicismo e metodo: Cartesio, Harvey, Bacone","x":"La nuova scienza sostituisce alla natura «animata» e piena di forze occulte del Rinascimento un mondo-macchina, spiegabile con materia, movimento e rapporti di causa ed effetto: è il meccanicismo, di cui Cartesio è il filosofo. Ne è un esempio William Harvey, che nel 1628 descrive la circolazione del sangue e il cuore come una pompa. Francis Bacon (Novum Organum, 1620) critica la logica di Aristotele e propone il metodo induttivo: osservare, raccogliere dati, fare esperimenti, risalire alle cause; la conoscenza è potere sulla natura e deve migliorare la vita umana. Galileo unisce esperimento e matematica: è il metodo sperimentale."},{"id":"k190","ch":"cap-18","t":"Accademie e strumenti scientifici","x":"La scienza diventa pubblica e collettiva: i risultati si comunicano, si verificano, si discutono. Le università, legate ad Aristotele, restano ai margini; contano le accademie: dei Lincei a Roma (1603, di cui fece parte Galileo), del Cimento a Firenze (1657), la Royal Society a Londra (1660) e l'Académie des sciences a Parigi (1666), con riviste periodiche. Nuovi strumenti (cannocchiale, microscopio, barometro, termometro, orologio a pendolo) aprono mondi prima invisibili: l'olandese Leeuwenhoek, costruttore di lenti autodidatta, osserva batteri e spermatozoi e lo comunica alla Royal Society. La parola «scienziato» nascerà solo nell'Ottocento."},{"id":"k191","ch":"cap-18","t":"Newton e i Principia (1687)","x":"Isaac Newton, nei Philosophiae naturalis principia mathematica (1687), conclude la rivoluzione scientifica: con le tre leggi del moto e la legge di gravitazione universale (due corpi si attraggono con una forza proporzionale alle masse e inversamente proporzionale al quadrato della distanza) spiega con la stessa matematica la caduta di una mela e l'orbita della Luna, unificando fisica terrestre e celeste e i risultati di Keplero e Galileo. Il suo modello di universo-orologio dominerà fino ad Einstein e diventerà il simbolo della ragione illuminista."},{"id":"k192","ch":"cap-18","t":"La caccia alle streghe","x":"Proprio mentre nasceva la scienza moderna, la caccia alle streghe raggiunse il culmine (circa 1560-1650). Dal Quattrocento le credenze popolari nella magia si erano fuse con una teoria colta: la strega fa un patto col diavolo, vola di notte al sabba, partecipa a riti sacrileghi. Il Malleus maleficarum (1486), manuale di due inquisitori domenicani, insegnava a riconoscerle e processarle. Le vittime erano soprattutto donne povere, anziane, vedove, guaritrici e levatrici, accusate di provocare malattie, morti e carestie; le confessioni erano spesso estorte con la tortura. I processi, condotti per lo più da tribunali laici e intensi in Germania, Svizzera e Francia, colpirono cattolici e protestanti (100.000-200.000 condanne a morte secondo le stime riportate), fino a Salem nel Massachusetts (1692). Voci critiche come il medico Weyer (1563), che vedeva nelle streghe delle malate, furono contrastate anche da Bodin; le inquisizioni romana e spagnola furono paradossalmente più caute dei giudici laici."},{"id":"k193","ch":"cap-18","t":"Assolutismo teorico: Filmer e Bossuet","x":"Il Seicento produce le teorie più compiute del potere assoluto. L'inglese Robert Filmer, nel Patriarcha (scritto durante la guerra civile, pubblicato nel 1680), fonda l'autorità del re su quella naturale del padre: i re discendono da Adamo come i padri dai patriarchi, e i sudditi devono obbedire come figli. Il vescovo francese Bossuet, precettore del figlio di Luigi XIV, nella Politica tratta dalla Sacra Scrittura (pubblicata nel 1709) teorizza la monarchia di diritto divino: il re è luogotenente di Dio, il suo potere è sacro, paterno e assoluto, anche se deve governare secondo ragione. Locke scriverà il primo dei Due trattati proprio contro Filmer."},{"id":"k194","ch":"cap-18","t":"Grozio e il diritto naturale","x":"Il giusnaturalismo sostiene che esiste un diritto naturale, ricavabile dalla ragione e valido per tutti gli uomini, superiore alle leggi dei singoli Stati (diritto positivo). L'olandese Ugo Grozio, nel De jure belli ac pacis (1625), scritto durante la guerra dei Trent'anni, ne fece la base del diritto internazionale: alcune regole, come rispettare i patti (pacta sunt servanda), valgono anche tra Stati e anche in guerra, e varrebbero «anche se Dio non esistesse». È il fondamento laico delle relazioni tra Stati sovrani sancite poi a Vestfalia."},{"id":"k195","ch":"cap-18","t":"Hobbes e il Leviatano (1651)","x":"Thomas Hobbes scrisse il Leviatano (1651) dopo la guerra civile e l'esecuzione di Carlo I. Parte da un'ipotesi: lo stato di natura, senza leggi né governo. Poiché gli uomini sono egoisti e uguali nella capacità di nuocersi, lì regna la «guerra di tutti contro tutti» e la vita è «solitaria, misera, brutale e breve». Per paura della morte gli individui stipulano un contratto: si uniscono (pactum societatis) e cedono tutti i loro diritti a un sovrano (pactum subiectionis), che deve avere potere assoluto per garantire pace e sicurezza. Lo Stato è il Leviatano, il mostro biblico. L'assolutismo di Hobbes non viene da Dio né dalla tradizione, ma dall'utile degli individui: è una base moderna e razionale del potere."},{"id":"k196","ch":"cap-18","t":"Locke e lo Stato liberale","x":"John Locke, nei Due trattati sul governo (1690), pubblicati dopo la Gloriosa rivoluzione, usa lo stesso schema del contratto per arrivare a conclusioni opposte. Nello stato di natura gli uomini hanno già diritti naturali (vita, libertà, proprietà), ma manca un giudice imparziale: per questo fondano il governo, cedendogli solo il diritto di farsi giustizia da sé. Il potere politico esiste per proteggere quei diritti; se li viola, il popolo ha diritto di resistere e cambiarlo. È la base del liberalismo: potere limitato, separazione tra legislativo ed esecutivo, tolleranza religiosa, tutela della proprietà. Le sue idee ispireranno la Dichiarazione d'indipendenza americana."},{"id":"k197","ch":"cap-18","t":"Il mercantilismo","x":"Il mercantilismo è l'insieme delle politiche economiche degli Stati del Seicento, non una teoria unitaria (il nome viene dal «sistema mercantile» criticato da Adam Smith nel 1776). L'idea guida è che l'economia serve alla potenza dello Stato: come disse Colbert, ministro di Luigi XIV, il commercio alimenta le finanze e le finanze sono il nerbo della guerra. La ricchezza si misura in oro e argento; chi non ha miniere deve ottenerli con una bilancia commerciale attiva, esportando più di quanto importa. Strumenti: dazi sui manufatti stranieri, privilegi e monopoli alle manifatture nazionali, importazione di materie prime, eliminazione delle dogane interne, strade e canali, incremento della popolazione. Le colonie sono essenziali: forniscono materie prime e mercati e devono commerciare solo con la madrepatria (esclusiva coloniale). Poiché la ricchezza mondiale era vista come fissa, il commercio era una guerra con altri mezzi."},{"id":"k198","ch":"cap-18","t":"Compagnie commerciali privilegiate","x":"L'espansione europea del Seicento fu condotta da compagnie commerciali a cui lo Stato concedeva il monopolio di un'area e poteri quasi sovrani: fare guerra e alleanze, costruire fortezze, battere moneta, amministrare territori. La più potente fu la Compagnia olandese delle Indie orientali (VOC, 1602), una delle prime società per azioni: il capitale era diviso in quote negoziabili e i soci ricevevano dividendi, così si raccoglievano grandi capitali e si divideva il rischio. Seguirono la Compagnia inglese delle Indie orientali (1600), la WIC olandese (1621) per l'Atlantico, la Compagnia francese delle Indie (1664). Già nel 1553 gli inglesi avevano fondato la Compagnia di Moscovia per cercare una rotta artica e commerciare con la Russia."},{"id":"k199","ch":"cap-18","t":"L'impero olandese in Asia","x":"Gli olandesi entrarono nel commercio delle spezie e in pochi decenni scalzarono i portoghesi, attaccando le loro basi e alleandosi con i sovrani locali stanchi del loro dominio. La VOC si insediò nelle isole delle spezie (Celebes 1607), fondò Batavia (oggi Giacarta) a Giava nel 1619 come capitale, prese Malacca (1641), Ceylon (1658, cannella) e completò il controllo delle Molucche (1667, chiodi di garofano e noce moscata), imponendo monopoli spesso brutali. Fondò la colonia del Capo (1652) come stazione di rifornimento, nucleo del futuro Sudafrica; i suoi navigatori toccarono l'Australia (1606) e scoprirono la Nuova Zelanda (1642); furono gli unici europei ammessi a commerciare col Giappone. Al Portogallo restarono Goa, Diu, Macao e parte di Timor."},{"id":"k200","ch":"cap-18","t":"Gli olandesi nell'Atlantico e New York","x":"La Compagnia delle Indie occidentali (WIC), nata nel 1621 alla fine della tregua con la Spagna, doveva colpire Spagna e Portogallo (allora uniti) nell'Atlantico. Nel 1628 catturò un'intera flotta spagnola dell'argento; prese in Africa Luanda e la fortezza di São Jorge da Mina (1637), centri della tratta degli schiavi; dal 1630 occupò il Brasile del Nord, produttore di zucchero, ma dopo l'indipendenza portoghese fu cacciata (1654). Sul fiume Hudson fondò la Nuova Olanda con Nieuw Amsterdam, sull'isola di Manhattan, che gli inglesi presero nel 1664 ribattezzandola New York in onore del duca di York. Restarono la Guyana (Suriname) e Curaçao; la WIC fu sciolta nel 1674."},{"id":"k201","ch":"cap-18","t":"Gli inglesi in Asia e in America","x":"La Compagnia inglese delle Indie orientali (1600) perse la gara delle spezie con gli olandesi, come mostrò il massacro di Amboina (1623), e si spostò sull'India, dove fondò basi a Surat, Madras e Bombay, commerciando tessuti di cotone, tè e caffè: sarà il punto di partenza dell'impero britannico in India. In America gli inglesi si concentrarono sul Nord: Walter Raleigh battezzò Virginia la costa esplorata nel 1584, e dal 1607 (Jamestown) nacquero colonie stabili con origini diverse: piantagioni di tabacco lavorate da servi a contratto e poi da schiavi africani in Virginia, comunità religiose puritane nel Massachusetts, il Maryland per i cattolici. A differenza degli spagnoli, i coloni inglesi venivano per la terra e si mescolarono poco con i nativi; molti emigranti poveri pagavano il viaggio con anni di servitù a contratto."},{"id":"k202","ch":"cap-18","t":"La Nuova Francia e le Antille","x":"La Francia colonizzò il Canada: Samuel de Champlain fondò Québec nel 1608, Richelieu creò la Compagnia dei Cento Associati (1627) per il commercio delle pellicce e impose coloni solo cattolici; nel 1642 nacque Montreal. Ma la Nuova Francia restò poco popolata (circa 16.000 coloni nel 1700) nonostante gli incentivi di Colbert, che nel 1663-1664 la mise sotto il controllo diretto del re. Nei Caraibi i francesi presero Guadalupa e Martinica (1635) e la parte occidentale di Hispaniola, Saint-Domingue (riconosciuta nel 1661), che con zucchero e schiavi diventerà la colonia più ricca del mondo (oggi Haiti). Nel 1682 La Salle discese il Mississippi e rivendicò la Louisiana in onore di Luigi XIV, per chiudere gli inglesi lungo la costa. In Asia la Compagnia delle Indie (1664) fondò Pondichéry (1683)."},{"id":"k203","ch":"cap-18","t":"Filippine e Manila","x":"Le Filippine, raggiunte da Magellano e chiamate così in onore di Filippo II, divennero colonia spagnola nel 1571-1583 con capitale Manila, dipendente dal vicereame della Nuova Spagna. Manila fu lo snodo del commercio tra America e Asia: ogni anno il «galeone di Manila» portava ad Acapulco sete e porcellane cinesi pagate con l'argento messicano, che così finiva in Cina."},{"id":"k204","ch":"cap-19","t":"Dall'«estate di San Martino» alla crisi","x":"Dopo Cateau-Cambrésis (1559) l'Italia ebbe quasi sessant'anni di pace: la popolazione superò i 13 milioni, i prezzi del grano salirono e conveniva investire nella terra, con bonifiche in Val di Chiana, Maremma, Polesine e Padovano; Venezia, dopo la pace con i Turchi del 1573, riprese i commerci. Fu l'«estate di San Martino», un ultimo tepore prima dell'inverno. Tra 1620 e 1660 arrivò la crisi, proprio nei settori che avevano fatto grande l'Italia: tessuti, commercio, banca."},{"id":"k205","ch":"cap-19","t":"Le cause della crisi italiana","x":"Il crollo fu drammatico: la produzione di panni di lana calò del 60% a Firenze, del 70% a Venezia, dell'80-90% a Milano; quella della seta del 65-80%. Cause esterne: le guerre di Valtellina e Monferrato, la guerra dei Trent'anni che distrusse il mercato tedesco, le pesti del 1630 (Nord e Toscana, quella dei Promessi sposi) e del 1656 (Mezzogiorno, a Napoli morì quasi metà della popolazione), le carestie della piccola glaciazione. Cause interne, ancora più importanti: i prodotti italiani, di alta qualità ma cari, persero la concorrenza con le new draperies del Nord, più economiche e prodotte nelle campagne; le corporazioni difendevano salari alti e metodi vecchi (nel 1663 i magliai milanesi bloccarono i telai inglesi). Si salvò solo il lusso: liuteria di Cremona, vetro di Murano, sete d'oro."},{"id":"k206","ch":"cap-19","t":"Ripresa e trasformazioni: riso, mais, organzini","x":"Nella seconda metà del Seicento la popolazione si riprese (circa 13,5 milioni), ma l'economia cambiò volto. Le città persero peso rispetto alle campagne (con l'eccezione di Roma, capitale della cattolicità, salita a 135.000 abitanti). In agricoltura il calo del prezzo del grano spinse a nuove colture: vite in Toscana, riso e mais nella pianura padana (il mais diventerà il cibo dei contadini, con il rischio della pellagra), gelsi e bachi da seta. La manifattura si spostò nelle campagne dove il lavoro costava meno: i fustagni da Cremona all'alto Milanese, e soprattutto gli organzini, filati di seta ritorti con filatoi idraulici (nati a Bologna), che fecero del Nord il primo esportatore d'Europa. Ma l'Italia ormai esportava materie prime e semilavorati e importava manufatti stranieri: era diventata un'economia «periferica», e il divario Nord-Sud si allargò."},{"id":"k207","ch":"cap-19","t":"L'aristocratizzazione della società","x":"Le famiglie ricche spostarono i capitali dal commercio e dalle manifatture alla terra e ai titoli del debito pubblico, più sicuri e prestigiosi. Si diffuse una mentalità aristocratica che disprezzava il lavoro: a Milano il Collegio dei giureconsulti, che nel 1570 ammetteva ancora i mercanti all'ingrosso, nel 1593 dichiarò il commercio «vile» e incompatibile con la nobiltà; a Genova nel 1603 si vietarono ai patrizi le arti meccaniche. Il fenomeno esisteva anche altrove (si parla di «tradimento della borghesia»), ma in Italia sottrasse capitali e uomini proprio alle attività produttive, irrigidendo la gerarchia sociale."},{"id":"k208","ch":"cap-19","t":"Il Barocco e la cultura del Seicento","x":"Il Barocco (dal portoghese barroco, perla irregolare: qualcosa di bizzarro) sostituì l'armonia classica con movimento, scenografia, contrasti e meraviglia: l'arte doveva stupire e commuovere, anche per riportare i fedeli alla Chiesa. In letteratura il teorico è Emanuele Tesauro (Il cannocchiale aristotelico, 1654), che esalta la metafora come strumento per scoprire legami inaspettati tra cose lontane, fino agli eccessi di Tommaso Stigliani (la luna «frittata del cielo»). Nonostante l'artificio, il secolo diede grandi artisti come Caravaggio e scienziati come Galileo; ma con la censura della Controriforma l'Italia perse il contatto con il pensiero europeo, che solo gli illuministi del Settecento ripristineranno."},{"id":"k209","ch":"cap-19","t":"Dissimulazione e ribellione: Accetto e Campanella","x":"Davanti al conformismo imposto da Chiesa e Spagna gli intellettuali avevano due strade. La prima è la «dissimulazione onesta» del napoletano Torquato Accetto (1641): nascondere i propri pensieri non per ingannare ma per proteggere la coscienza, con pazienza e prudenza, in un mondo di ipocriti e tiranni. La seconda è la ribellione del domenicano calabrese Tommaso Campanella: nel 1599 organizzò una congiura per liberare la Calabria dagli spagnoli e fondare una repubblica; scoperto, per evitare la morte si finse pazzo anche sotto tortura. Passò 27 anni nelle carceri di Napoli e 3 in quelle romane, dove scrisse La città del sole (pubblicata nel 1623): un'utopia senza proprietà privata, guidata da sapienti e organizzata secondo natura e ragione."},{"id":"k210","ch":"cap-19","t":"La mappa politica dell'Italia spagnola","x":"Tra 1559 e inizio Settecento la carta d'Italia cambiò poco. Spagna diretta: Milano (dal 1535), Regno di Napoli (dal 1503), Sicilia e Sardegna (aragonesi dal primo Quattrocento), Stato dei Presidi sulla costa toscana: quasi metà della penisola. Stati legati alla Spagna: Toscana medicea, Genova, Parma e Piacenza dei Farnese, Mantova e Monferrato dei Gonzaga, Modena e Reggio degli Este (che persero Ferrara, passata al papa nel 1598), Lucca (repubblica protetta dallo status di città imperiale), i Savoia (che ebbero Saluzzo nel 1601). Lo Stato della Chiesa si ingrandì anche con Urbino, alla fine dei Della Rovere (1631). L'unico Stato davvero indipendente era Venezia, che sola riuscì anche a far partecipare i propri magistrati ai processi dell'Inquisizione. La Chiesa era legata alle élite, che vi sistemavano figli cadetti e figlie non sposate."},{"id":"k211","ch":"cap-19","t":"I Savoia da Emanuele Filiberto a Carlo Emanuele II","x":"Emanuele Filiberto, vincitore di San Quintino, recuperò il suo Stato con Cateau-Cambrésis (1559) e lo ricostruì: amministrazione accentrata, milizia, e soprattutto il trasferimento della capitale da Chambéry a Torino (1563), segno che il futuro dei Savoia era in Italia. Carlo Emanuele I (1580-1630) approfittò delle guerre di religione francesi per occupare Saluzzo: col trattato di Lione (1601) lo tenne cedendo alla Francia la Bresse e altre terre oltralpe. Le guerre del Monferrato gli fruttarono poco (Alba), e il figlio Vittorio Amedeo I dovette cedere Pinerolo alla Francia (1631). Seguì una guerra civile tra la reggente Madama Cristina (sorella di Luigi XIII) e i cognati, chiusa nel 1642-1643 con l'aiuto francese."},{"id":"k212","ch":"cap-19","t":"Il Granducato di Toscana","x":"Cosimo I de' Medici (1537-1574), figlio di Giovanni dalle Bande Nere, fu il vero fondatore dello Stato toscano: lasciò in vita i vecchi organi repubblicani (Consiglio dei Duecento, Senato dei Quarantotto) svuotandoli, governò con funzionari dipendenti da lui e con un consiglio ristretto, la Pratica segreta (dal 1547), si riservò il potere di fare le leggi; annesse Siena (1557) e nel 1569 il papa gli diede il titolo di granduca. Siena però restò «Stato nuovo», con leggi proprie, distinto dallo «Stato vecchio» fiorentino. Ferdinando I (1587-1609) fece di Livorno un porto franco aperto a mercanti di ogni religione, uno dei maggiori del Mediterraneo. L'agricoltura restava ferma alla mezzadria, in cui il contadino dava metà del raccolto al padrone e aveva pochi motivi per migliorare."},{"id":"k213","ch":"cap-19","t":"Genova: repubblica di banchieri","x":"Genova, legata alla Spagna dal 1528, era il porto d'arrivo delle truppe e dell'argento diretti nelle Fiandre, e i suoi banchieri finanziavano la monarchia spagnola. Le tensioni tra nobili «vecchi» e «nuovi» sfociarono nella guerra civile del 1575, mediata da Spagna e papa: le leges novae (1576) ridussero il sorteggio e favorirono la cooptazione, rafforzando l'oligarchia; governavano il doge biennale e i Serenissimi collegi (Senato e Camera). Il centro della finanza pubblica era il Banco di San Giorgio, che gestiva il debito della Repubblica, incassava le tasse a garanzia (e amministrò perfino la Corsica) ed emetteva titoli fruttiferi, i «luoghi»; era guidato dalle stesse famiglie del governo. Le bancarotte spagnole spinsero i genovesi verso la terra, soprattutto nel Sud. Nel 1684 Luigi XIV bombardò la città per staccarla dalla Spagna e costrinse il doge a scusarsi a Versailles."},{"id":"k214","ch":"cap-19","t":"Lo Stato della Chiesa e la Roma barocca","x":"Lo Stato pontificio era governato da ecclesiastici, con un intreccio di funzioni religiose e politiche: le nunziature erano insieme diplomazia e controllo della Chiesa locale. Il Concistoro dei cardinali perse potere a favore delle congregazioni (Sisto V); Bologna e Ferrara erano legazioni affidate a cardinali legati. Dopo i Farnese finì il «grande nepotismo», ma restò il cardinal nipote che guidava la politica estera, finché si affermò il cardinale segretario di Stato. Roma divenne il teatro della Chiesa trionfante: Bernini (colonnato di San Pietro, fontane, baldacchino) e Borromini (San Carlo alle Quattro Fontane, Sant'Ivo) ne fecero una città-spettacolo per pellegrini da tutto il mondo. Grande colpo propagandistico fu la conversione di Cristina di Svezia, figlia di Gustavo Adolfo, che abdicò e si stabilì a Roma (1655)."},{"id":"k215","ch":"cap-19","t":"Le missioni cattoliche","x":"Con le scoperte la Chiesa avviò le missioni («invio» di religiosi a predicare). Nel 1523 dodici francescani spagnoli partirono per il Messico di Cortés, ma la croce arrivava insieme alla spada e le conversioni di massa restavano superficiali. Furono i gesuiti a cambiare metodo: imparare lingue e culture locali e adattare il messaggio cristiano (accomodatio). Francesco Saverio, compagno di Ignazio, predicò a Goa, Malacca e in Giappone e morì alle porte della Cina (1552); Roberto Nobili in India visse da bramino; Alessandro Valignano organizzò la missione giapponese; Matteo Ricci entrò alla corte di Pechino grazie alla scienza occidentale (mappe, orologi, astronomia) e al rispetto per Confucio. Nel 1622 la Congregazione De Propaganda Fide centralizzò le missioni sotto il papa."},{"id":"k216","ch":"cap-19","t":"Venezia: l'interdetto e Paolo Sarpi","x":"Dopo Agnadello e la perdita di Cipro, Venezia scelse la neutralità; all'interno il potere si concentrò nel Consiglio dei Dieci e nei tre Inquisitori di Stato (dal 1539). I «giovani» (un partito, non un'età) volevano un Senato forte e una politica energica contro Spagna e papa; i «vecchi» la prudenza. Lo scontro con Roma venne nel 1605: Venezia arrestò due preti per reati comuni e rifiutò di consegnarli ai tribunali ecclesiastici, mentre leggi veneziane limitavano chiese e donazioni al clero. Paolo V lanciò nel 1606 l'interdetto (sospensione dei sacramenti sull'intero Stato): Venezia ordinò al clero di ignorarlo ed espulse i gesuiti. La difese il servita Paolo Sarpi, che negava alla Chiesa il diritto di sottrarre i chierici alla legge dello Stato (scampò a un attentato nel 1607) e scrisse poi la Storia del concilio tridentino (1619). Francia e Spagna mediarono: l'interdetto fu ritirato, i preti consegnati via ambasciatore francese, gli ordini riammessi tranne i gesuiti. Fu una vittoria del principio di sovranità dello Stato, citata in tutta Europa."},{"id":"k217","ch":"cap-19","t":"Gradisca e Candia: la fine della potenza veneziana","x":"Venezia difese ancora il suo mare: nella guerra di Gradisca (1615-1617) contro gli Asburgo ottenne che questi smettessero di proteggere gli uscocchi, pirati slavi dell'Adriatico. Ma il commercio declinava (concorrenza di Ancona, Ragusa, navi atlantiche) e i patrizi investivano nella terraferma, costruendo le ville venete. La lunga guerra di Candia (1645-1669) per difendere Creta dagli Ottomani, con un assedio durato oltre vent'anni, svuotò le casse: per finanziarla si vendette l'ingresso nel patriziato a oltre cento famiglie, e alla fine Creta fu perduta (1669)."},{"id":"k218","ch":"cap-19","t":"Masaniello e la rivolta di Napoli (1647-1648)","x":"Per finanziare le guerre la Spagna caricò di tasse il Mezzogiorno, soprattutto sui generi di consumo. A Napoli, il 7 luglio 1647, i venditori di piazza Mercato si rifiutarono di pagare la nuova gabella sulla frutta: la rivolta trovò un capo nel giovane pescivendolo Masaniello (Tommaso Aniello d'Amalfi) e una mente politica nell'anziano avvocato Giulio Genoino, che voleva più rappresentanza al popolo nel governo cittadino. Inizialmente il bersaglio erano appaltatori e speculatori, non il re. Masaniello governò per dieci giorni, poi, forse esaurito, fu assassinato il 16 luglio. La rivolta però si allargò alle province contro i baroni, divenne antispagnola e in ottobre fu proclamata la Real repubblica napoletana sotto protezione francese (con il duca di Guisa). La Francia non aiutò davvero, i ceti si divisero, città e campagne non si unirono: il 6 aprile 1648 gli spagnoli rientrarono e i baroni repressero le province."},{"id":"k219","ch":"cap-19","t":"Palermo e Messina","x":"A Palermo, nell'agosto 1647, una rivolta contro le gabelle sul pane ottenne l'abolizione di alcune tasse e un posto per le corporazioni nel governo cittadino, ma senza una guida si spense presto. Più seria fu la rivolta di Messina: nel 1672 il popolo strappò metà dei seggi del Senato cittadino per le corporazioni; nel 1674 le forze autonomiste cacciarono gli spagnoli e chiesero aiuto a Luigi XIV, allora in guerra con la Spagna, che mandò flotta e truppe. Palermo, eterna rivale, non aderì; quando i francesi se ne andarono (1678) la Spagna riprese Messina e la punì duramente, togliendole privilegi e università. Le rivolte mostrano il malcontento, ma anche le divisioni che impedivano un vero cambiamento."},{"id":"k220","ch":"ripasso","t":"Cronologia: come collegare le date","x":"Per memorizzare le date conviene legarle a catene di cause. Italia: Lodi 1454 (equilibrio) → morte di Lorenzo 1492 → Carlo VIII 1494 → Napoli spagnola 1504 → Agnadello 1509 → Marignano 1515 → Pavia 1525 → sacco di Roma 1527 → Bologna 1530 → Cateau-Cambrésis 1559. Riforma: 95 tesi 1517 → Worms 1521 → contadini 1525 → Spira 1529 («protestanti») → Augusta 1530 (Confessio) → Smalcalda 1531 → Mühlberg 1547 → pace di Augusta 1555 → Trento 1545-1563. Trent'anni: defenestrazione 1618 → Montagna Bianca 1620 → fase danese 1625-1629 → editto di restituzione 1629 → Breitenfeld 1631 e Lützen 1632 → pace di Praga e intervento francese 1635 → Rocroi 1643 → Vestfalia 1648 → Pirenei 1659."},{"id":"k221","ch":"ripasso","t":"Gli imperi a confronto","x":"Ogni impero ha una logica diversa. Portogallo: impero commerciale di basi costiere e rotte (Goa, Malacca, Hormuz, Macao, più il Brasile delle piantagioni). Spagna: impero territoriale di conquista e popolamento, con vicereami, encomienda e miniere d'argento, dalla California al Cile e alle Filippine. Province Unite: impero di compagnie per azioni, centrato su Batavia, spezie e trasporti, con il Capo, Nieuw Amsterdam e Curaçao. Inghilterra: colonie di popolamento e piantagione nel Nord America (Virginia, Massachusetts) e Caraibi (Giamaica), basi commerciali in India. Francia: Canada poco popolato e pellicce, Antille dello zucchero, Louisiana, Pondichéry. In Europa, Carlo V unì Spagna, Italia, Paesi Bassi, Austria e Impero; nel 1556 l'eredità si divise tra Filippo II (ramo spagnolo) e Ferdinando I (ramo austriaco); dal 1580 al 1640 Filippo e successori ebbero anche il Portogallo."},{"id":"k222","ch":"ripasso","t":"Organi di governo: una mappa","x":"Assemblee dei ceti: Stati generali (Francia; non convocati dal 1615 al 1789), Cortes (regni spagnoli), Parlamento (Inghilterra: Lord e Comuni), Sejm (Polonia, solo nobili), Riksdag (Svezia, con i contadini), Stände (Germania), Stati generali delle Province Unite (all'Aia, all'unanimità). Consigli dei re: Privy Council, Conseil d'en haut, Consejo de Estado, sistema dei Consigli di Filippo II. Repubbliche italiane: Venezia (Maggior Consiglio, Senato, Consiglio dei Dieci, Inquisitori di Stato, doge a vita); Genova (doge biennale, Serenissimi collegi, Banco di San Giorgio); Firenze repubblicana (Consiglio grande) e poi medicea (Pratica segreta). Chiesa: concistoro, congregazioni, Sant'Uffizio, Propaganda Fide."},{"id":"k223","ch":"ripasso","t":"Le paci religiose a confronto","x":"Tre modi diversi di far convivere le confessioni. Pace di Augusta (1555, Impero): libertà di scelta solo ai principi (cuius regio, eius religio), cattolici o luterani; i sudditi si adeguano o emigrano. Editto di Nantes (1598, Francia): una sola religione di Stato, ma libertà di coscienza e di culto per gli individui ugonotti, con garanzie militari; revocato nel 1685. Lettera di maestà (1609, Boemia): libertà di culto ai ceti protestanti, violata da Ferdinando e causa della guerra dei Trent'anni. Pace di Vestfalia (1648): riconoscimento anche dei calvinisti e anno normale 1624; la religione smette di essere motivo di guerra tra Stati."},{"id":"k224","ch":"ripasso","t":"Battaglie da non confondere","x":"Un trucco è collegare ogni battaglia a chi vince e cosa cambia. Agnadello 1509: Francia batte Venezia, fine dell'espansione veneziana. Marignano 1515: Francia batte Svizzeri, Milano francese. Pavia 1525: Carlo V cattura Francesco I. Mohács 1526: Ottomani battono Ungheria. Kappel 1531: cattolici battono Zwingli. Prevesa 1538: Ottomani battono la flotta cristiana. Mühlberg 1547: Carlo V batte Smalcalda. San Quintino 1557: Spagna batte Francia. Lepanto 1571: Lega Santa batte Ottomani. Montagna Bianca 1620: imperiali battono boemi. Breitenfeld 1631: svedesi vincono; Lützen 1632: svedesi vincono ma muore Gustavo Adolfo; Nördlingen 1634: imperiali vincono. Rocroi 1643: Francia batte i tercios. Marston Moor 1644 e Naseby 1645: Parlamento batte il re."},{"id":"k225","ch":"ripasso","t":"Rivolte del Cinque-Seicento a confronto","x":"Quasi tutte le grandi rivolte di questo periodo nascono dal fisco e dalla difesa di privilegi e autonomie contro un potere centrale che cresce. In Spagna e nei suoi domini: comuneros di Castiglia (1520-1521) contro le richieste di denaro di Carlo V; moriscos delle Alpujarras (1568) contro la cancellazione della loro cultura; Paesi Bassi (dal 1566) per religione e autonomie; Aragona (1591) per i fueros; Catalogna e Portogallo (1640) contro l'Unión de las Armas; Napoli (Masaniello) e Palermo (1647-1648) e Messina (1672-1678) contro le gabelle. In Francia la Fronda (1648-1653) unì parlamenti, nobili e popolo contro Mazzarino e il fisco; in Inghilterra la rivoluzione (1640-1660) contro l'assolutismo degli Stuart. Distinguere chi si ribella contro chi aiuta a non confonderle."},{"id":"k226","ch":"ripasso","t":"I papi da ricordare","x":"Una catena di papi per orientarsi: Alessandro VI Borgia (1492-1503: Inter caetera, Cesare Borgia, Savonarola); Giulio II (1503-1513: Cambrai, Lega Santa, Lateranense V); Leone X Medici (1513-1521: indulgenze, scomunica di Lutero); Adriano VI (1522-1523, ex precettore di Carlo V); Clemente VII Medici (1523-1534: Cognac, sacco di Roma, no al divorzio di Enrico VIII); Paolo III Farnese (1534-1549: gesuiti 1540, Sant'Uffizio 1542, Trento 1545, Parma e Piacenza); Giulio III (riapre Trento 1551); Paolo IV Carafa (1555-1559: Indice 1559, Morone in carcere); Pio IV (chiude Trento 1563); Pio V (1566-1572: repressione, Lepanto, scomunica di Elisabetta); Gregorio XIII (calendario 1582); Sisto V (1585-1590: congregazioni); Paolo V (interdetto a Venezia 1606); Innocenzo X (protesta contro Vestfalia 1648)."},{"id":"k227","ch":"ripasso","t":"L'Italia dopo Cateau-Cambrésis","x":"Dopo il 1559 la Spagna governa direttamente il Ducato di Milano, il Regno di Napoli, la Sicilia, la Sardegna e lo Stato dei Presidi (porti fortificati sulla costa toscana). Gli altri Stati sono indipendenti ma nella sua orbita: il Ducato di Savoia restituito a Emanuele Filiberto (capitale a Torino dal 1563, Saluzzo dal 1601), la Toscana dei Medici (con Siena dal 1557, granducato dal 1569), la Repubblica di Genova (con la Corsica restituita dalla Francia), i ducati di Parma e Piacenza (Farnese), Mantova e Monferrato (Gonzaga), Modena e Reggio (Este, che nel 1598 perdono Ferrara a favore del papa), la Repubblica di Lucca e lo Stato della Chiesa. L'unica vera eccezione è Venezia, neutrale e gelosa della propria indipendenza."}]};
const DATA = RAW.chs;
const TOP = {}; RAW.tp.forEach(t => TOP[t.id] = t);
const CC = {}; RAW.cc.forEach(x => CC[x.id] = x);
const L = ["A","B","C","D","E"];
const KEY = "quiz-storia-moderna-v1";
const REV = "da-ripassare";
let state = {mode:"quiz", ans:{}};
try { const s = JSON.parse(localStorage.getItem(KEY)||"null"); if (s && s.ans) state = Object.assign(state, s); } catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
let filter = null, order = null, cur = 0, view = "chap", retry = {};

const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function qid(ci, qi){ return DATA[ci].id + ":" + qi; }
function isWrong(ci, qi){ const a = state.ans[qid(ci,qi)]; return a!==undefined && a!==DATA[ci].qs[qi].a; }

function chapStats(ci){
  const c = DATA[ci]; let done=0, ok=0;
  c.qs.forEach((q,qi)=>{ const a = state.ans[qid(ci,qi)]; if (a!==undefined){ done++; if (a===q.a) ok++; } });
  return {n:c.qs.length, done, ok};
}
function totals(){ let n=0,d=0,o=0; DATA.forEach((_,ci)=>{const s=chapStats(ci); n+=s.n; d+=s.done; o+=s.ok;}); return {n,d,o}; }
function wrongList(){
  const by = {};
  DATA.forEach((c,ci)=>c.qs.forEach((q,qi)=>{ if (isWrong(ci,qi) || retry[qid(ci,qi)]) (by[q.k] = by[q.k] || []).push([ci,qi]); }));
  return by;
}
function nWrong(){ let n=0; DATA.forEach((c,ci)=>c.qs.forEach((q,qi)=>{ if (isWrong(ci,qi)) n++; })); return n; }
function meta(s){ return `${s.n} domande · ${s.done} ${s.done===1?'risposta':'risposte'} · ${s.ok} ${s.ok===1?'giusta':'giuste'}`; }

function card(tp, open){
  if (!tp) return "";
  const plus = tp.p.length ? `<h4 class="plus">Per approfondire · oltre il riassunto</h4><ul class="p">${tp.p.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : "";
  return `<details class="card"${open?" open":""}><summary><span class="tag">Scheda di ripasso</span><span>${esc(tp.t)}</span></summary><div class="cbody"><h4>Dal riassunto</h4><ul>${tp.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${plus}</div></details>`;
}

function deep(ids, open){
  return (ids||[]).map(id=>CC[id]).filter(Boolean).map(x=>`<details class="deep"${open?" open":""}><summary><span class="tag">Approfondimento</span><span>${esc(x.t)}</span></summary><div class="dbody"><p>${esc(x.x)}</p></div></details>`).join("");
}

function renderToc(){
  const toc = $("toc"), pick = $("pick");
  toc.innerHTML = ""; pick.innerHTML = "";
  const nw = nWrong();
  const rl = document.createElement("li");
  rl.innerHTML = `<a class="rev-link" href="#${REV}" ${view==="rev"?'aria-current="page"':''}><span>Da ripassare</span><small>${nw} ${nw===1?'errore':'errori'}</small></a>`;
  toc.appendChild(rl);
  const ro = document.createElement("option"); ro.value = REV; ro.textContent = `Da ripassare (${nw} errori)`; if (view==="rev") ro.selected = true; pick.appendChild(ro);
  DATA.forEach((c,ci)=>{
    const s = chapStats(ci);
    const li = document.createElement("li");
    li.innerHTML = `<a href="#${c.id}" ${view==="chap"&&ci===cur?'aria-current="page"':''}><span>${esc(c.t)}</span><small class="${s.done===s.n?'done':''}">${s.done ? s.ok+'/'+s.n : s.n}</small></a>`;
    toc.appendChild(li);
    const op = document.createElement("option"); op.value = c.id; op.textContent = `${c.t} (${s.n})`; if (view==="chap" && ci===cur) op.selected = true; pick.appendChild(op);
  });
  const t = totals();
  $("tally").innerHTML = `Totale: <b>${t.o}</b> ${t.o===1?'giusta':'giuste'} su <b>${t.d}</b> ${t.d===1?'risposta':'risposte'} · ${t.n} domande`;
}

function answerBox(q, chosen, mode){
  const right = `<b>${L[q.a]}</b> – ${esc(q.o[q.a])}`;
  const tp = TOP[q.k];
  if (mode==="study") return `<div class="ans is-study"><div class="verdict">Risposta</div><p>${right}</p><p>${esc(q.e)}</p></div>` + deep(q.c,false) + card(tp,false);
  const ok = chosen===q.a;
  return `<div class="ans ${ok?'is-ok':'is-ko'}"><div class="verdict">${ok?'Esatto':'Sbagliato · la risposta giusta è '+L[q.a]}</div><p>${right}</p><p>${esc(q.e)}</p></div>` + deep(q.c, !ok) + card(tp, false);
}

function renderQ(ci, qi){
  const q = DATA[ci].qs[qi];
  const chosen = state.ans[qid(ci,qi)];
  const study = state.mode==="study";
  const answered = chosen!==undefined;
  const li = document.createElement("li");
  li.className = "q" + (answered && chosen!==q.a && !study ? " wrongcard" : "");
  li.dataset.ci = ci; li.dataset.qi = qi;
  const opts = q.o.map((o,oi)=>{
    let cls = "opt";
    if (study || answered){ if (oi===q.a) cls+=" right"; else if (answered && !study && oi===chosen) cls+=" wrong"; }
    return `<button type="button" class="${cls}" data-oi="${oi}" ${study||answered?'disabled':''}><span class="L">${L[oi]}</span><span>${esc(o)}</span></button>`;
  }).join("");
  const num = view==="rev" ? `${esc(DATA[ci].t.split(" – ")[0])} · n. ${qi+1}` : `${qi+1}.`;
  li.innerHTML = `<p class="qtext"><span class="qn">${num}</span><span>${esc(q.q)}</span></p><div class="opts">${opts}</div>` + ((study||answered)? answerBox(q, chosen, study?"study":"quiz") : "");
  return li;
}

function showChapterChrome(on){
  document.querySelector(".tools").hidden = !on;
  document.querySelector(".bar").hidden = !on;
  $("key").hidden = !on; $("cards").hidden = !on; $("deeps").hidden = !on;
}

function renderChapter(){
  showChapterChrome(true);
  const c = DATA[cur];
  $("ctitle").textContent = c.t;
  const s = chapStats(cur);
  $("cmeta").textContent = meta(s);
  $("cbar").style.width = (s.done/s.n*100)+"%";
  const list = $("qs"); list.innerHTML = "";
  const idxs = order || c.qs.map((_,i)=>i);
  let shown = 0;
  idxs.forEach(qi=>{
    const a = state.ans[qid(cur,qi)];
    if (filter==="wrong" && !isWrong(cur,qi)) return;
    if (filter==="unans" && a!==undefined) return;
    list.appendChild(renderQ(cur, qi)); shown++;
  });
  $("empty").textContent = "Nessuna domanda corrisponde al filtro.";
  $("empty").hidden = shown>0;
  $("t-wrong").setAttribute("aria-pressed", filter==="wrong");
  $("t-unans").setAttribute("aria-pressed", filter==="unans");
  $("t-next").hidden = cur===DATA.length-1;
  const tps = RAW.tp.filter(t=>t.ch===c.id);
  const dps = RAW.cc.filter(x=>x.ch===c.id);
  $("deeps").innerHTML = `<h3>Approfondimenti del capitolo</h3><p class="hint">${dps.length} spiegazioni: contesto, cosa stabilisce ogni pace o trattato, perché conta ogni battaglia o istituzione.</p>` + dps.map(x=>deep([x.id],false)).join("");
  $("cards").innerHTML = `<h3>Schede di ripasso del capitolo</h3><p class="hint">${tps.length} schede: i punti chiave del riassunto e, separati, alcuni dettagli in più da sapere.</p>` + tps.map(t=>card(t,false)).join("");
  const items = c.qs.map(q=>`<li><b>${L[q.a]}</b> – ${esc(q.o[q.a])}</li>`).join("");
  $("key").innerHTML = `<h3>Risposte del capitolo</h3><p class="hint">Chiave completa in ordine di domanda.</p><details${state.mode==="study"?" open":""}><summary>Mostra la chiave delle risposte</summary><ol>${items}</ol></details>`;
}

function renderReview(){
  showChapterChrome(false);
  $("ctitle").textContent = "Da ripassare";
  const by = wrongList();
  const ids = RAW.tp.map(t=>t.id).filter(id=>by[id]);
  const nw = nWrong();
  $("cmeta").textContent = `${nw} ${nw===1?'errore':'errori'} in ${ids.length} ${ids.length===1?'argomento':'argomenti'}`;
  const list = $("qs"); list.innerHTML = "";
  $("empty").textContent = "Nessun errore finora. Quando sbagli una domanda, qui compare la scheda dell'argomento con le domande da rifare.";
  $("empty").hidden = ids.length>0;
  ids.sort((a,b)=>by[b].length-by[a].length).forEach(id=>{
    const tp = TOP[id]; const qs = by[id];
    const chap = DATA.find(c=>c.id===tp.ch);
    const li = document.createElement("li");
    li.className = "rev-topic"; li.style.listStyle = "none";
    const still = qs.filter(([ci,qi])=>isWrong(ci,qi)).length;
    li.innerHTML = `<div class="row"><span class="tally">${esc(chap?chap.t:"")} · <b>${still}</b> da rifare</span><button class="btn" type="button" data-retry="${id}">Rifai queste domande</button></div>` + card(tp,true);
    const ol = document.createElement("ol"); ol.className = "qs";
    qs.forEach(([ci,qi])=>ol.appendChild(renderQ(ci,qi)));
    li.appendChild(ol);
    list.appendChild(li);
  });
}

function render(){ if (view==="rev") renderReview(); else renderChapter(); }

document.addEventListener("click", e=>{
  const r = e.target.closest("[data-retry]");
  if (r){
    const by = wrongList();
    (by[r.dataset.retry]||[]).forEach(([ci,qi])=>{ retry[qid(ci,qi)] = true; delete state.ans[qid(ci,qi)]; });
    save(); renderToc(); renderReview(); return;
  }
  const b = e.target.closest(".opt"); if (!b || b.disabled) return;
  const li = b.closest("li.q"); const ci = +li.dataset.ci, qi = +li.dataset.qi, oi = +b.dataset.oi;
  state.ans[qid(ci,qi)] = oi; save();
  li.replaceWith(renderQ(ci, qi));
  if (view==="chap"){
    const s = chapStats(cur);
    $("cmeta").textContent = meta(s);
    $("cbar").style.width = (s.done/s.n*100)+"%";
  } else {
    const nw = nWrong(); $("cmeta").textContent = `${nw} ${nw===1?'errore':'errori'} da ripassare`;
  }
  renderToc();
});

function setMode(m){
  state.mode = m; save();
  $("m-quiz").setAttribute("aria-pressed", m==="quiz");
  $("m-study").setAttribute("aria-pressed", m==="study");
  render();
}
$("m-quiz").onclick = ()=>setMode("quiz");
$("m-study").onclick = ()=>setMode("study");
$("t-wrong").onclick = ()=>{ filter = filter==="wrong"?null:"wrong"; renderChapter(); };
$("t-unans").onclick = ()=>{ filter = filter==="unans"?null:"unans"; renderChapter(); };
$("t-shuffle").onclick = ()=>{ const n = DATA[cur].qs.length; order = [...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]];} renderChapter(); };
$("t-reset").onclick = ()=>{ DATA[cur].qs.forEach((_,qi)=>delete state.ans[qid(cur,qi)]); save(); filter=null; renderToc(); renderChapter(); };
$("t-next").onclick = ()=>{ if (cur<DATA.length-1) location.hash = DATA[cur+1].id; };
$("pick").onchange = e=>{ location.hash = e.target.value; };

function route(){
  const h = location.hash.slice(1);
  order = null; filter = null;
  if (h===REV){ view = "rev"; retry = {}; }
  else { view = "chap"; const i = DATA.findIndex(c=>c.id===h); cur = i>=0 ? i : 0; }
  renderToc(); render();
  if (h) window.scrollTo({top:0});
}
window.addEventListener("hashchange", route);
setMode(state.mode==="study"?"study":"quiz");
route();
</script>

</body>
