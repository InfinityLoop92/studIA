i spirituali; oltre 500 collegi; Ratio studiorum (1599)."],"p":["Ignazio di Loyola fu ferito nel 1521 durante la difesa di Pamplona; la sua conversione avvenne durante la convalescenza."]},{"id":"c14-italia","ch":"cap-14","t":"Riforma in Italia e Sant'Uffizio","s":["Paolo III (1534-1549): Consilium de emendanda ecclesia (1536); cardinali Contarini, Pole, Bembo.","Idee riformate a Venezia, Lucca, Modena, Ferrara, Napoli; anabattisti veneti; valdesi aderiscono nel 1532. Circolo di Juan de Valdés a Napoli († 1541); spirituali; Beneficio di Cristo (1543).","Ratisbona (1541): fallisce Contarini. 1542: Congregazione del Sant'Uffizio (Carafa). Ochino fugge a Ginevra («Cristo in mascara»)."],"p":[]},{"id":"c14-trento","ch":"cap-14","t":"Il Concilio di Trento","s":["Aperto a Trento (principato vescovile dell'Impero) nel dicembre 1545. Gennaio 1547: condannata la sola fide; 1547 trasferito a Bologna (tifo petecchiale); riaperto nel 1551 da Giulio III, sospeso nel 1552.","Paolo IV Carafa (1555): niente concilio, Morone in carcere (1557), primo Indice (1559, tutto Erasmo). Pio IV (1559-1565): ultima fase 1562-1563.","Dottrina: opere + fede; Scrittura + Tradizione; Vulgata; sette sacramenti; transustanziazione; clero distinto dai laici; indulgenze, purgatorio, santi.","Disciplina: seminari; parroci con celibato, abito talare, registri; vescovi residenti, visite ogni due anni."],"p":["Le tre fasi del concilio sono quindi 1545-1547 (Trento, poi Bologna), 1551-1552 e 1562-1563; il concilio fu chiuso nel dicembre 1563."]},{"id":"c14-dopo","ch":"cap-14","t":"Dopo Trento: papato, vescovi, Inquisizione","s":["Papato rafforzato: Congregazione del concilio; Bellarmino (Chiesa come monarchia). Sisto V (1585-1590): 15 congregazioni (6 Stato, 9 Chiesa); 1622 De Propaganda Fide.","Calendario gregoriano (1582): dal 4 al 15 ottobre. Declino internazionale (assenza a Vestfalia).","Carlo Borromeo arcivescovo di Milano dal 1565. Confessione individuale, comunione frequente; foro interno e foro esterno.","Inquisizione: abiura, relapsi; Pio V (1566-1572); valdesi di Calabria sterminati; dopo il 1580 stregoneria e costumi. Bruno al rogo (17 febbraio 1600), abiura di Galileo (1633); Bibbie in volgare all'Indice (1596).","Cantimori: «eretici di tutte le Chiese»; Jedin: tanti corsi d'acqua senza un fiume."],"p":["Giordano Bruno fu bruciato a Roma in Campo de' Fiori, dove oggi c'è la sua statua (1889)."]},{"id":"c15-inghilterra","ch":"cap-15","t":"Inghilterra e Scozia nel Cinquecento","s":["Scozia calvinista e presbiteriana con John Knox; Mary Stuart (regina dal 1561) fugge in Inghilterra nel 1568.","Enrico VIII (1509-1547): per avere un erede e sposare Anna Bolena, chiede l'annullamento da Caterina d'Aragona; Clemente VII rifiuta; Atto di supremazia (1534): «scisma senza eresia»; More giustiziato (1535).","Edoardo VI (1547-1553): Book of Common Prayer (1552). Maria Tudor (1553-1558), cattolica, moglie di Filippo II: «Bloody Mary».","Elisabetta I (1558-1603): Trentanove articoli (1571 nel cap. 15; 1563 nel cap. 17). Scomunica di Pio V (1570). Drake: circumnavigazione 1577-1580, attacco a Cadice 1587; nel 1587 Mary Stuart giustiziata."],"p":["Gli articoli furono approvati in una prima versione dalla Convocazione del clero nel 1563 e resi definitivi e obbligatori nel 1571: per questo il riassunto riporta due date.","Mary Stuart fu decapitata l'8 febbraio 1587 nel castello di Fotheringhay."]},{"id":"c15-cateau","ch":"cap-15","t":"Cateau-Cambrésis e l'Italia spagnola","s":["San Quintino (10 agosto 1557): Emanuele Filiberto di Savoia batte i francesi. Bancarotta spagnola (1557); muore Maria Tudor (1558).","Cateau-Cambrésis (3 aprile 1559): la Francia rinuncia a Milano e Napoli, rende la Corsica a Genova e i territori sabaudi; tiene Calais, Metz, Toul, Verdun, piazzeforti in Piemonte e Saluzzo.","Spagna: Milano, Napoli, isole, Stato dei Presidi; indipendente in pratica solo Venezia.","Enrico II muore in un torneo (10 luglio 1559) → crisi francese."],"p":[]},{"id":"c15-filippo","ch":"cap-15","t":"Filippo II: governo, finanze, Inquisizione","s":["Filippo II (1556-1598): austero; corte a Madrid (1559) ed Escorial; governo dal suo ufficio. Si oppone alla bolla In coena Domini (1568).","Sistema dei Consigli (di Stato, guerra, finanze; per Castiglia, Aragona, Italia, Indie, Fiandre, Portogallo); letrados; juntas.","1580: Portogallo unito alla Spagna (morti Sebastiano I in Marocco nel 1578 e il cardinale Enrico nel 1580). Motto Non sufficit orbis.","Finanze: argento americano circa 25% delle entrate; alcabala; asientos (15-20%) trasformati in juros (5-7%); bancarotte 1557, 1575, 1596; banchieri genovesi.","Inquisizione e auto da fé; rivolta dei moriscos delle Alpujarras (1568), espulsione nel 1609; marrani e limpieza de sangre.","Debolezze: Mesta (allevatori transumanti), declino del tessile (Toledo, Segovia), rivolta aragonese per i fueros (1591)."],"p":["Filippo II si sposò quattro volte: con Maria Manuela di Portogallo, Maria Tudor, Elisabetta di Valois e Anna d'Austria."]},{"id":"c15-lepanto","ch":"cap-15","t":"Lepanto (1571)","s":["1570: Selim II attacca Cipro (veneziana). Lega Santa: Venezia, papa, Cavalieri di Malta, Savoia, Genova, Spagna.","7 ottobre 1571, Lepanto (ingresso del golfo di Corinto): vince la flotta di don Giovanni d'Austria; circa 30.000 ottomani prigionieri.","Risultati limitati: obiettivi diversi; Venezia firma la pace separata nel 1573 cedendo Cipro; tregua ispano-ottomana nel 1578."],"p":["Alla battaglia di Lepanto combatté, e fu ferito alla mano sinistra, Miguel de Cervantes, il futuro autore del Don Chisciotte.","La flotta veneziana a Lepanto era comandata da Sebastiano Venier, quella ottomana da Müezzinzade Alì Pascià, che morì nella battaglia."]},{"id":"c15-paesibassi","ch":"cap-15","t":"La rivolta dei Paesi Bassi","s":["17 province (unite nel 1548), ognuna con statolder; Stati generali. Calvinismo; Granvelle consiglia la reggente Margherita.","5 aprile 1566: petizione dei nobili, i gueux («pezzenti»); estate 1566: iconoclastia. Duca d'Alba: repressione (Egmont giustiziato).","Guglielmo d'Orange guida la rivolta; «pezzenti del mare»; Olanda e Zelanda; Guglielmo calvinista dal 1573.","Bancarotta 1575; saccheggio di Anversa (1576); Pacificazione di Gand (novembre 1576). Alessandro Farnese (1578): Unione di Arras (6 gennaio 1579) per il sud; Unione di Utrecht per il nord; indipendenza all'Aia (1581).","Guglielmo ucciso il 10 luglio 1584; indipendenza riconosciuta nel 1648: Guerra degli Ottant'anni."],"p":["Guglielmo d'Orange fu ucciso a Delft da Balthasar Gérard, un cattolico fedele a Filippo II, che aveva messo una taglia sulla sua testa."]},{"id":"c15-francia","ch":"cap-15","t":"Le guerre di religione in Francia","s":["Ugonotti: primo sinodo a Parigi (1559); un terzo dei nobili; capi Giovanna d'Albret e Coligny; cattolici guidati dai Guisa.","Francesco II (1559-1560), Carlo IX (1560-1574) con Caterina de' Medici e il cancelliere de l'Hôpital. Editto di Saint-Germain (gennaio 1562) → massacro di Vassy (1° marzo 1562): 36 anni di guerre.","Pace di Saint-Germain (1570): quattro piazzeforti (La Rochelle). Notte di San Bartolomeo (24 agosto 1572), durante le nozze di Margherita di Valois ed Enrico di Navarra: oltre 2.000 morti, tra cui Coligny. Monarcomachi; politiques (Bodin, 1576).","Guerra dei tre Enrichi (dal 1584): Guisa ucciso a Blois (1588); Enrico III ucciso da Jacques Clément (1° agosto 1589). Enrico IV convertito: Chartres (febbraio 1594), Parigi (22 marzo 1594), papa (1595).","1598: pace di Vervins con la Spagna; Editto di Nantes (libertà di coscienza, culto, diritti civili, circa cento piazzeforti)."],"p":["A Enrico IV è attribuita la frase «Parigi val bene una messa», a proposito della sua conversione.","L'Editto di Nantes fu revocato da Luigi XIV nel 1685 con l'editto di Fontainebleau."]},{"id":"c15-armata","ch":"cap-15","t":"L'Invincibile Armata (1588)","s":["Piano: controllare la Manica e far sbarcare l'esercito di Alessandro Farnese dai Paesi Bassi.","1588: da Lisbona circa 130 navi e 17.000 uomini; navi pesanti, tempeste, mancato coordinamento; circumnavigazione delle isole britanniche; tornano 67 navi, un terzo degli uomini perduti.","Colpo al prestigio spagnolo, ascesa della potenza navale inglese."],"p":["La flotta spagnola era comandata dal duca di Medina Sidonia."]},{"id":"c16-francia","ch":"cap-16","t":"Francia da Enrico IV a Richelieu","s":["Enrico IV (1589-1610) con il ministro calvinista Sully: finanze, amministrazione, agricoltura. Paulette (1604): uffici ereditari → nobiltà di toga.","Ucciso da Ravaillac (14 maggio 1610); reggenza di Maria de' Medici (filospagnola); Stati generali 1614-1615 (ultimi prima del 1789); Concini favorito, ucciso nel 1617.","Richelieu: cardinale (1622), Consiglio di Stato (1624). Intendenti, repressione dei nobili, Académie française (1635), La Rochelle presa (1628), ugonotti senza garanzie militari (1629).","Dal 1630 contro gli Asburgo; taglia da 17 a 57 milioni (1614-1648); rivolte urbane (Parigi e Lione 1633, Lione 1642), croquants (1636-1637), nu-pieds (Normandia)."],"p":["Richelieu morì nel dicembre 1642 e Luigi XIII nel maggio 1643; il potere passò al cardinale Mazzarino durante la minorità di Luigi XIV.","La Fronda (1648-1653) fu la grande rivolta francese contro Mazzarino e il fisco, citata nel cap. 18."]},{"id":"c16-spagna","ch":"cap-16","t":"Spagna di Filippo III e IV","s":["Filippo III (1598-1621) e il valido duca di Lerma. Pace con l'Inghilterra (1604), tregua di 12 anni con le Province Unite (1609); espulsione di circa 300.000 moriscos (1609).","Filippo IV (1621-1665) e Olivares: arbitristas, Unión de las Armas (1626, 140.000 uomini) respinta da Catalogna, Aragona, Valencia, Portogallo.","1640: rivolta della Catalogna (1641 protezione francese; Barcellona ripresa nel 1652) e del Portogallo (Giovanni IV di Braganza; riconosciuto nel 1668). Olivares licenziato il 17 gennaio 1643; bancarotta 1647; rivolte di Napoli e Palermo."],"p":[]},{"id":"c16-province","ch":"cap-16","t":"Province Unite, Polonia e Svezia","s":["Province Unite: Maurizio di Nassau; sud sotto Alberto e Isabella (Bruxelles); Schelda bloccata (1585). Sette province: Olanda, Zelanda, Utrecht, Gheldria, Frisia, Overijssel, Groninga. Stati generali all'Aia (unanimità); statolder (Orange) contro Gran pensionario (patriziati). Arminiani (Oldenbarnevelt, giustiziato) contro gomaristi (Maurizio); Grozio fugge (1621); sinodo di Dordrecht (1618-1619).","Polonia: Unione di Lublino (1569); re elettivo, repubblica nobiliare, pacta conventa; Enrico di Valois (1573-1574), Bathory (1574-1587), Sigismondo III Vasa (1587-1632), Ladislao IV, Giovanni II Casimiro; Chiesa uniata (1596); sociniani espulsi (1658).","Svezia: monarchia ereditaria dal 1544; Riksdag e Riksråd; Carlo IX (1599-1611); Gustavo II Adolfo (1611-1632): coscrizione, ferma ventennale, armi leggere; Ingria e Carelia (1617), Livonia con Riga (1621); rame e ferro oltre il 60% dell'export."],"p":[]},{"id":"c16-guerra1","ch":"cap-16","t":"Guerra dei Trent'anni: verso il conflitto e fase boemo-palatina","s":["Augusta 1555 ignora i calvinisti (Federico IV del Palatinato, Giovanni Sigismondo di Brandeburgo). Rodolfo II (1576-1612) a Praga; Baviera centro cattolico.","1608 Unione evangelica (Federico V), 1609 Lega cattolica (Massimiliano di Baviera). Lettera di maestà (1609). Mattia imperatore (1612-1619); Ferdinando di Stiria re di Boemia (1617).","Defenestrazione di Praga (23 maggio 1618). Boemi offrono la corona a Federico V (19 agosto 1619); Ferdinando II imperatore (28 agosto 1619). Elettori cattolici: Treviri, Colonia, Magonza.","Montagna Bianca (8 novembre 1620): Federico, «re d'inverno», perde Palatinato e titolo (1623, a Massimiliano). Repressione; corona boema ereditaria (1627)."],"p":["Alla Montagna Bianca l'esercito della Lega cattolica era comandato da Johann Tserclaes conte di Tilly."]},{"id":"c16-italia","ch":"cap-16","t":"Valtellina e Monferrato","s":["Valtellina (luglio 1620): sacro macello dei protestanti; occupazione spagnola del corridoio della via di Spagna; trattato di Monçon (1626); restituita ai Grigioni nel 1639.","Monferrato: prima guerra 1612-1617 (Savoia sconfitto dalla Spagna). Seconda: alla morte di Vincenzo II (1627) erede Carlo Gonzaga-Nevers; sacco di Mantova (1630); francesi a Casale.","Trattato di Cherasco (1631): Nevers tiene Mantova e Monferrato; Savoia ottiene Alba ma cede Pinerolo alla Francia."],"p":["Il sacco di Mantova del 1630 e la peste che lo accompagnò sono lo sfondo storico dei Promessi sposi di Manzoni, ambientati nella Lombardia spagnola del 1628-1630."]},{"id":"c16-guerra2","ch":"cap-16","t":"Fasi danese, svedese e francese","s":["Fase danese (1625-1629): Cristiano IV (ducato di Holstein) sconfitto; Wallenstein, «imprenditore della guerra», duca di Friedland (1624), da 24.000 a oltre 100.000 uomini. Pace di Lubecca (7 giugno 1629). Editto di restituzione (1629): beni secolarizzati dopo il 1552.","Fase svedese (1630-1635): Gustavo Adolfo, «leone del Nord», finanziato da Richelieu; Breitenfeld (17 settembre 1631); Lützen (17 novembre 1632): vittoria ma morte del re; Oxenstierna per Cristina. Wallenstein ucciso (25 febbraio 1634). Nördlingen (6 settembre 1634): vittoria imperiale. Pace di Praga (1635).","Fase francese (maggio 1635-1648): Francia con Svezia e Province Unite: guerra politica per l'egemonia."],"p":["Nel 1631 le truppe imperiali di Tilly saccheggiarono Magdeburgo, una delle stragi più gravi della guerra."]},{"id":"c16-vestfalia","ch":"cap-16","t":"La pace di Vestfalia (1648)","s":["Sconfitte asburgiche: Breda (1637), Dune (21 ottobre 1639), il duca d'Enghien batte i tercios (19 maggio 1643).","Trattative a Münster e Osnabrück; la guerra franco-spagnola continua fino al 1659.","Territori: Province Unite indipendenti; Francia: Metz, Toul, Verdun, parte dell'Alsazia, Pinerolo; Svezia: Pomerania occidentale; Brandeburgo: Pomerania orientale, Magdeburgo, Minden.","Religione: anno normale 1624, calvinisti riconosciuti; elettori da 7 a 8 (Baviera + Palatinato restituito); Innocenzo X non riconosce. Principi liberi di allearsi; Germania perde quasi un terzo della popolazione."],"p":["La battaglia del 19 maggio 1643 è quella di Rocroi.","La guerra tra Francia e Spagna si chiuse con la pace dei Pirenei del 1659.","A Vestfalia fu riconosciuta formalmente anche l'indipendenza della Confederazione svizzera dall'Impero."]},{"id":"c17-societa","ch":"cap-17","t":"L'Inghilterra degli Stuart: economia e istituzioni","s":["1603: Giacomo I Stuart (già Giacomo VI di Scozia dal 1567): unione personale; unione politica nel 1707.","Enclosures contro open fields; lana: circa 75% dell'export; popolazione circa 4,5 milioni.","Parlamento: Lord e Comuni (voto nelle contee con 40 scellini di rendita). Anglicanesimo con Trentanove articoli; puritani; papisti.","Società: nobiltà senza grandi privilegi; gentry (giudici di pace, deputati); City di Londra; yeomen e freeholders, copyholders, braccianti, cottagers."],"p":[]},{"id":"c17-giacomo","ch":"cap-17","t":"Giacomo I e Carlo I fino al 1640","s":["Giacomo I (1603-1625): ministro Robert Cecil; tonnage and poundage; Bacon condannato (1621); Buckingham; congiura delle polveri (1605); Padri pellegrini (Mayflower, 1620); «No bishops, no king»; baronetti (1611).","Carlo I (1625-1649): Petition of Right (1628); Buckingham ucciso (agosto 1628); governo personale dal 1629 con Strafford e Laud (arminiano); ship money estesa a tutto il paese.","1638: rivolta scozzese contro la Chiesa anglicana. Short Parliament (aprile 1640) e Long Parliament (novembre 1640-1653)."],"p":["La congiura delle polveri, scoperta il 5 novembre 1605, è legata al nome di Guy Fawkes; in Inghilterra il 5 novembre si festeggia ancora la «Bonfire Night»."]},{"id":"c17-guerra","ch":"cap-17","t":"Dal Long Parliament alla guerra civile","s":["Long Parliament (Pym, Hampden): Strafford giustiziato (1641), Laud (1645); Triennial Act; abolita la Camera stellata; ship money illegale; vescovi fuori dai Lord.","1641: rivolta irlandese; Grand Remonstrance (22 novembre 1641); tentato arresto dei capi dell'opposizione → guerra civile (1642). Perché fallì l'assolutismo: niente esercito permanente né burocrazia, self-government della gentry, common law.","Re a Oxford; Parlamento con City, flotta e Solemn League and Covenant (1643). Marston Moor (2 luglio 1644): Cromwell e gli Ironsides; roundheads contro cavalieri. New Model Army (1645), Naseby (14 giugno 1645). Carlo si arrende agli scozzesi (1646)."],"p":[]},{"id":"c17-repubblica","ch":"cap-17","t":"Rivoluzione, repubblica e Cromwell","s":["Divisioni: presbiteriani (Chiesa di Stato) contro indipendenti (tolleranza); Levellers (dal 1646: sovranità popolare, voto ai maschi adulti liberi); agitatori dell'esercito. Putney (ottobre 1647): Rainborough contro Ireton.","Preston (agosto 1648); purga di Pride (6 dicembre 1648) → Rump Parliament; Carlo I decapitato il 30 gennaio 1649; Commonwealth il 19 maggio 1649.","Radicali: Diggers (Winstanley), Lilburne (England's New Chains), Burford (14 maggio 1649), Quinta Monarchia, quaccheri (Fox; Penn fonda la Pennsylvania nel 1681).","Cromwell: Irlanda (1649-1650), Scozia; Atto di navigazione (1651) e guerre con l'Olanda; Giamaica (1655); Lord Protettore (Instrument of Government, 1653). Muore il 3 settembre 1658.","Monck; Dichiarazione di Breda; Carlo II sbarca a Dover il 29 maggio 1660."],"p":["Carlo I fu decapitato a Londra, davanti alla Banqueting House di Whitehall.","Il conflitto tra corona e Parlamento si chiuse con la «Gloriosa rivoluzione» (1688-1689) e il Bill of Rights del 1689, che sancì la monarchia costituzionale."]},{"id":"c18-crisi","ch":"cap-18","t":"La crisi del Seicento","s":["Crisi generale: Hobsbawm (transizione dal feudalesimo al capitalismo) o scontro tra accentramento e autonomie (più tasse).","Rivolte di metà secolo: contadini, Catalogna, Portogallo, rivoluzione inglese, Napoli e Sicilia, Fronda.","Popolazione europea da circa 107 milioni (1600) a 125 milioni (1700): stagnazione in Germania, Spagna, Italia; crescita in Inghilterra, Province Unite, Russia, Scandinavia. Recessione dagli anni '20 a metà secolo; marginalizzazione del Mediterraneo."],"p":[]},{"id":"c18-scienza","ch":"cap-18","t":"La rivoluzione scientifica","s":["1543: Copernico. Keplero (1571-1630): orbite ellittiche, Astronomia nova (1609). Galileo (1564-1642): cannocchiale, fisica matematica, natura scritta in lingua matematica; ammonito nel 1616, Dialogo sopra i massimi sistemi (1632), abiura nel 1633.","Giordano Bruno (1548-1600): universo infinito, molti mondi; rogo il 17 febbraio 1600.","Meccanicismo: Cartesio (1596-1650); Harvey (1578-1657) e la circolazione del sangue. Bacone, Novum Organum (1620): metodo induttivo.","Strumenti: telescopio, microscopio, barometro, termometro, orologio a pendolo. Accademie: Lincei (Roma 1603), Cimento (Firenze 1657), Royal Society (Londra 1660), Académie des sciences (Parigi 1666). Leeuwenhoek.","1687: Newton, Principi matematici della filosofia naturale: gravitazione universale."],"p":["Galileo pubblicò nel 1610 il Sidereus Nuncius, dove descrisse le montagne della Luna e i quattro satelliti di Giove scoperti con il cannocchiale.","Il termine inglese «scientist» fu proposto da William Whewell nel 1833."]},{"id":"c18-streghe","ch":"cap-18","t":"La caccia alle streghe","s":["Dal XIII sec. l'idea del patto col demonio; nel XV sec. il modello del sabba. Malleus maleficarum (1486) dei domenicani Sprenger e Krämer.","Johann Weyer (De praestigiis daemonum, 1563): molte accusate sono malate; Bodin (Démonomanie, 1580) ribatte.","Processi soprattutto in tribunali civili (in Spagna e Italia anche Inquisizione: apostasia); vittime soprattutto donne povere, anziane, guaritrici e levatrici. Francia, Svizzera, Germania; Salem (1692, 19 condanne). Stime: 100.000-200.000 condanne. Ultime: Siviglia (1781), Poznań (1793)."],"p":[]},{"id":"c18-pensiero","ch":"cap-18","t":"Pensiero politico e mercantilismo","s":["Assolutismo: Filmer, Patriarcha (pubblicato nel 1680): il re come padre; Bossuet (pubblicato nel 1709): diritto divino.","Giusnaturalismo: Grozio, De jure belli ac pacis (1625), diritto internazionale.","Hobbes, Leviatano (1651): stato di natura = guerra di tutti contro tutti; pactum societatis + pactum subiectionis; potere assoluto per la sicurezza. Locke, Due trattati (1690): si conservano vita, libertà e proprietà; diritto di resistenza → liberalismo.","Mercantilismo (termine dal «sistema mercantile» di Adam Smith): economia al servizio dello Stato; Colbert (1666); metalli preziosi; bilancia attiva; dazi e monopoli; esclusiva coloniale; ricchezza mondiale considerata fissa."],"p":["Adam Smith critica il «sistema mercantile» nella Ricchezza delle nazioni (1776)."]},{"id":"c18-colonie","ch":"cap-18","t":"Imperi coloniali del Seicento","s":["Province Unite: VOC (1602, Oldenbarnevelt; società per azioni con poteri militari). Celebes (1607), Batavia (1619), Malacca (1641), Ceylon (1658), Molucche (1667), Capo (1652); Australia (1606), Nuova Zelanda (1642); Giappone. WIC (1621-1674): flotta spagnola catturata (1628), Luanda, São Jorge da Mina (1637), Brasile del nord (dal 1630, espulsi nel 1654), Nuova Olanda e Nieuw Amsterdam (New York dal 1664); restano Guyana e Curaçao.","Spagna: Filippine colonia dal 1583, capitale Manila. Portogallo: restano Timor, Macao, Goa, Diu; zucchero e tabacco in Brasile; oro e diamanti a Minas Gerais.","Inghilterra: Compagnia di Moscovia (1553); Compagnia delle Indie orientali (1600; società per azioni dal 1657); Amboina (1623); Hormuz (1622); Surat, Calicut, Madras, Bombay. America: Virginia (Raleigh, 1584), Massachusetts, Maryland, Giamaica (1655), New York (1664); tabacco, schiavi, contratti di servitù.","Francia: Québec (1608), Compagnia dei Cento Associati (1627, pellicce), Montreal (1642), coloni cattolici; Guadalupa e Martinica (1635), Guyana (1637), Saint-Domingue (1661); controllo regio (1663-1664), Colbert; 16.000 coloni nel 1700; Louisiana (1682); Compagnia delle Indie (1664), Pondichéry (1683)."],"p":["Il primo insediamento inglese stabile in Virginia fu Jamestown, fondato nel 1607.","Québec fu fondata da Samuel de Champlain; la Louisiana fu rivendicata da René-Robert Cavelier de La Salle.","La VOC fu sciolta nel 1799."]},{"id":"c19-economia","ch":"cap-19","t":"Economia italiana: crisi e ripresa","s":["Dopo il 1559: crescita («estate di San Martino»), oltre 13 milioni di abitanti nel 1600; bonifiche (Val di Chiana, Maremma, Polesine).","Crisi 1620-1660: lana -60% a Firenze, -70% a Venezia, -80-90% a Milano; seta -65% a Venezia, -80% a Genova e Milano. Cause esterne: guerre, Trent'anni, peste del 1630 (Nord e Toscana) e del 1656 (Sud), piccola glaciazione. Cause interne: concorrenza delle new draperies, corporazioni (magliai di Milano 1663). Resistono il lusso: liuteria di Cremona, vetro di Murano, sete d'oro.","Ripresa: circa 13,5 milioni; Roma da 100.000 a 135.000; riso e mais in pianura padana, gelsibachicoltura, viticoltura toscana; fustagni nelle campagne milanesi; organzini (filatoi idraulici, da Bologna). Divario Nord-Sud. L'Italia esporta materie prime e importa manufatti."],"p":["A Cremona lavoravano in questo periodo le grandi botteghe di liutai degli Amati, dei Guarneri e di Antonio Stradivari (1644-1737).","La peste del 1630 a Milano è quella raccontata da Manzoni nei Promessi sposi."]},{"id":"c19-cultura","ch":"cap-19","t":"Società e cultura del Seicento","s":["Ricchi investono in terra e debito pubblico; mentalità aristocratica: a Milano il commercio all'ingrosso diventa «vile commercio» (1593); a Genova arti meccaniche vietate ai patrizi (1603).","Barocco: stupore, movimento; Tesauro, Cannocchiale aristotelico (1654), metafora; Stigliani; Caravaggio. Controriforma e censura.","Torquato Accetto, La dissimulazione onesta (1641). Campanella (1568-1639): congiura antispagnola (1599), arresto (1600), finta pazzia, 27 anni a Napoli e 3 a Roma; La città del sole (1623)."],"p":["Campanella scrisse La città del sole in carcere intorno al 1602, prima in italiano; la prima edizione a stampa, in latino, uscì a Francoforte nel 1623."]},{"id":"c19-stati","ch":"cap-19","t":"Gli Stati italiani sotto l'egemonia spagnola","s":["Cambi: Ferrara al papa (1598), Urbino al papa (estinti i Della Rovere), Saluzzo ai Savoia (1601). Spagna: Sicilia e Sardegna, Napoli (1503), Milano (1535), Presidi: quasi metà della penisola. Altri: Parma e Piacenza (Farnese), Mantova e Monferrato (Gonzaga), Modena e Reggio (Este), Lucca (città imperiale). Solo Venezia fuori dall'influenza spagnola e con propri magistrati nei processi inquisitoriali.","Savoia: Emanuele Filiberto (1553-1580) sposta la capitale a Torino; Carlo Emanuele I (1580-1630), trattato di Lione (1601) per Saluzzo; Vittorio Amedeo I (1630-1637) cede Pinerolo; reggenza di Cristina e crisi risolta nel 1643; Carlo Emanuele II (1663-1675).","Toscana: duchi (1532), granduchi (1569). Cosimo I (1537-1574): Pratica segreta (1547), Siena (1557, «Stato nuovo»). Francesco I, Ferdinando I (porto franco di Livorno). Mezzadria.","Genova: Corsica recuperata (1559); guerra civile (1575), leges novae (1576); doge biennale, Serenissimi collegi; Banco di San Giorgio e i suoi «luoghi»; bombardamento di Luigi XIV (1684), scuse a Versailles.","Stato della Chiesa: congregazioni (Sisto V); legazioni di Bologna e Ferrara; piccolo nepotismo (cardinal nipote). Roma barocca di Bernini (1598-1680) e Borromini (1599-1667); Cristina di Svezia."],"p":["Di Bernini sono il colonnato di piazza San Pietro e il baldacchino della basilica; di Borromini la chiesa di San Carlo alle Quattro Fontane e Sant'Ivo alla Sapienza."]},{"id":"c19-missioni","ch":"cap-19","t":"Missioni e religione popolare","s":["1523: dodici francescani nel Messico di Cortés; difficoltà (violenza, battesimi superficiali; Inquisizione in America).","Gesuiti: Francesco Saverio (1506-1552: Goa, Malacca, Giappone; muore verso la Cina), Roberto Nobili (India), Valignano (Giappone), Matteo Ricci (Cina). Collegi missionari a Roma; De Propaganda Fide (1622).","In Italia missioni popolari, processioni, preghiere in latino; Bibbia in volgare vietata."],"p":["Matteo Ricci arrivò a Pechino nel 1601 e vi morì nel 1610; fu il primo europeo sepolto con il permesso dell'imperatore."]},{"id":"c19-venezia","ch":"cap-19","t":"Venezia nel Seicento","s":["Dopo Agnadello (1509) e Cipro (1571): neutralità. Consiglio dei Dieci sopra il Senato; tre Inquisitori di Stato (1539). «Giovani» contro «vecchi».","1605: due preti arrestati; 1606 interdetto di Paolo V; Venezia espelle i gesuiti; Paolo Sarpi difende lo Stato (Storia del concilio tridentino, 1619); mediazione franco-spagnola. Richer (1614).","Guerra di Gradisca (1615-1617) contro gli Asburgo e gli uscocchi. Concorrenza di Ancona e Ragusa; ville in Terraferma. Guerra di Candia (1645-1669): oltre cento famiglie della Terraferma nel patriziato; Creta perduta nel 1669."],"p":["Nel 1607 Paolo Sarpi fu aggredito e ferito a pugnalate a Venezia da sicari legati alla Curia romana; sopravvisse."]},{"id":"c19-rivolte","ch":"cap-19","t":"Rivolte nel Mezzogiorno: Palermo, Napoli, Messina","s":["Più tasse sul Sud e sulle isole (Milano risparmiata). Palermo (agosto 1647): gabelle abolite, corporazioni nel governo, ordine ristabilito presto.","Napoli (7 luglio 1647, tassa sulla frutta): Masaniello (Tommaso Aniello D'Amalfi) e Giulio Genoino; Masaniello ucciso il 16 luglio; rivolta antifeudale nelle province; Real repubblica napoletana (ottobre 1647) sotto protezione francese; spagnoli di nuovo a Napoli il 6 aprile 1648.","Messina: rivolta (1672), corporazioni a metà del Senato; nel 1674 espulsione degli spagnoli con l'aiuto di Luigi XIV; Palermo non aderisce; riconquista spagnola (1678)."],"p":["Masaniello aveva 27 anni (era nato nel 1620)."]},{"id":"x-cronologia","ch":"ripasso","t":"Cronologia essenziale 1454-1700","s":["1454 Lodi · 1492 America, Granada, morte di Lorenzo · 1494 Carlo VIII · 1498 Vasco da Gama · 1509 Agnadello · 1513 Il Principe · 1515 Marignano · 1517 95 tesi · 1519 Carlo V imperatore · 1521 Worms, Tenochtitlán · 1525 Pavia · 1527 sacco di Roma · 1530 Bologna · 1534 Atto di supremazia, gesuiti · 1545 Trento · 1555 Augusta · 1559 Cateau-Cambrésis · 1571 Lepanto · 1572 San Bartolomeo · 1581 Province Unite · 1588 Armata · 1598 Nantes · 1618 Praga · 1648 Vestfalia · 1649 Carlo I giustiziato · 1660 Restaurazione · 1687 Newton."],"p":[]},{"id":"x-imperi","ch":"ripasso","t":"Imperi, colonie e assetti territoriali","s":["Carlo V (1519): Castiglia e Aragona con Napoli, Sicilia, Sardegna e America; Paesi Bassi e Borgogna; Austria; Impero; Milano dal 1535. Divisione: a Filippo II Spagna, Italia, America, Paesi Bassi; a Ferdinando Austria e Impero.","Unione iberica 1580-1640 (riconoscimento del Portogallo nel 1668).","Portogallo: Goa, Malacca, Hormuz, Macao, Brasile. Spagna: dalla California al Cile, Filippine. Olanda: Batavia, Ceylon, Molucche, Capo, Nieuw Amsterdam, Curaçao. Inghilterra: Virginia, Massachusetts, Giamaica, India (Madras, Bombay). Francia: Québec, Louisiana, Antille, Pondichéry."],"p":[]},{"id":"x-istituzioni","ch":"ripasso","t":"Battaglie, organi e trattati a confronto","s":["Organi: Stati generali (Francia; Province Unite all'Aia), Cortes (Spagna), Parlamento (Inghilterra), Sejm (Polonia), Riksdag (Svezia), Stände (Germania); Venezia: Maggior Consiglio, Senato, Consiglio dei Dieci, doge; Genova: doge biennale, Serenissimi collegi.","Vittorie ottomane: Mohács (1526), Prevesa (1538). Sconfitte francesi: Garigliano (1503), Bicocca (1522), Pavia (1525), San Quintino (1557). Breitenfeld 1631, Lützen 1632, Nördlingen 1634.","Editti e paci religiose: Augusta 1555, Saint-Germain 1562, Nantes 1598, Lettera di maestà 1609, restituzione 1629, Vestfalia 1648."],"p":[]}]};
const DATA = RAW.chs;
const TOP = {}; RAW.tp.forEach(t => TOP[t.id] = t);
const L = ["A","B","C","D","E"];
const KEY = "quiz-storia-moderna-v1";
const REV = "da-ripassare";
let state = {mode:"quiz", ans:{}};
try { const s = JSON.parse(localStorage.getItem(KEY)||"null"); if (s && s.ans) state = Object.assign(state, s); } catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
let filter = null, order = null, cur = 0, view = "chap", retry = {};

const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function qid(ci, qi){ return DATA[ci].id + ":" + qi; }
function isWrong(ci, qi){ const a = state.ans[qid(ci,qi)]; return a!==undefined && a!==DATA[ci].qs[qi].a; }

function chapStats(ci){
  const c = DATA[ci]; let done=0, ok=0;
  c.qs.forEach((q,qi)=>{ const a = state.ans[qid(ci,qi)]; if (a!==undefined){ done++; if (a===q.a) ok++; } });
  return {n:c.qs.length, done, ok};
}
function totals(){ let n=0,d=0,o=0; DATA.forEach((_,ci)=>{const s=chapStats(ci); n+=s.n; d+=s.done; o+=s.ok;}); return {n,d,o}; }
function wrongList(){
  const by = {};
  DATA.forEach((c,ci)=>c.qs.forEach((q,qi)=>{ if (isWrong(ci,qi) || retry[qid(ci,qi)]) (by[q.k] = by[q.k] || []).push([ci,qi]); }));
  return by;
}
function nWrong(){ let n=0; DATA.forEach((c,ci)=>c.qs.forEach((q,qi)=>{ if (isWrong(ci,qi)) n++; })); return n; }
function meta(s){ return `${s.n} domande · ${s.done} ${s.done===1?'risposta':'risposte'} · ${s.ok} ${s.ok===1?'giusta':'giuste'}`; }

function card(tp, open){
  if (!tp) return "";
  const plus = tp.p.length ? `<h4 class="plus">Per approfondire · oltre il riassunto</h4><ul class="p">${tp.p.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : "";
  return `<details class="card"${open?" open":""}><summary><span class="tag">Scheda di ripasso</span><span>${esc(tp.t)}</span></summary><div class="cbody"><h4>Dal riassunto</h4><ul>${tp.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${plus}</div></details>`;
}

function renderToc(){
  const toc = $("toc"), pick = $("pick");
  toc.innerHTML = ""; pick.innerHTML = "";
  const nw = nWrong();
  const rl = document.createElement("li");
  rl.innerHTML = `<a class="rev-link" href="#${REV}" ${view==="rev"?'aria-current="page"':''}><span>Da ripassare</span><small>${nw} ${nw===1?'errore':'errori'}</small></a>`;
  toc.appendChild(rl);
  const ro = document.createElement("option"); ro.value = REV; ro.textContent = `Da ripassare (${nw} errori)`; if (view==="rev") ro.selected = true; pick.appendChild(ro);
  DATA.forEach((c,ci)=>{
    const s = chapStats(ci);
    const li = document.createElement("li");
    li.innerHTML = `<a href="#${c.id}" ${view==="chap"&&ci===cur?'aria-current="page"':''}><span>${esc(c.t)}</span><small class="${s.done===s.n?'done':''}">${s.done ? s.ok+'/'+s.n : s.n}</small></a>`;
    toc.appendChild(li);
    const op = document.createElement("option"); op.value = c.id; op.textContent = `${c.t} (${s.n})`; if (view==="chap" && ci===cur) op.selected = true; pick.appendChild(op);
  });
  const t = totals();
  $("tally").innerHTML = `Totale: <b>${t.o}</b> ${t.o===1?'giusta':'giuste'} su <b>${t.d}</b> ${t.d===1?'risposta':'risposte'} · ${t.n} domande`;
}

function answerBox(q, chosen, mode){
  const right = `<b>${L[q.a]}</b> – ${esc(q.o[q.a])}`;
  const tp = TOP[q.k];
  if (mode==="study") return `<div class="ans is-study"><div class="verdict">Risposta</div><p>${right}</p><p>${esc(q.e)}</p></div>` + card(tp,false);
  const ok = chosen===q.a;
  return `<div class="ans ${ok?'is-ok':'is-ko'}"><div class="verdict">${ok?'Esatto':'Sbagliato · la risposta giusta è '+L[q.a]}</div><p>${right}</p><p>${esc(q.e)}</p></div>` + card(tp, !ok);
}

function renderQ(ci, qi){
  const q = DATA[ci].qs[qi];
  const chosen = state.ans[qid(ci,qi)];
  const study = state.mode==="study";
  const answered = chosen!==undefined;
  const li = document.createElement("li");
  li.className = "q" + (answered && chosen!==q.a && !study ? " wrongcard" : "");
  li.dataset.ci = ci; li.dataset.qi = qi;
  const opts = q.o.map((o,oi)=>{
    let cls = "opt";
    if (study || answered){ if (oi===q.a) cls+=" right"; else if (answered && !study && oi===chosen) cls+=" wrong"; }
    return `<button type="button" class="${cls}" data-oi="${oi}" ${study||answered?'disabled':''}><span class="L">${L[oi]}</span><span>${esc(o)}</span></button>`;
  }).join("");
  const num = view==="rev" ? `${esc(DATA[ci].t.split(" – ")[0])} · n. ${qi+1}` : `${qi+1}.`;
  li.innerHTML = `<p class="qtext"><span class="qn">${num}</span><span>${esc(q.q)}</span></p><div class="opts">${opts}</div>` + ((study||answered)? answerBox(q, chosen, study?"study":"quiz") : "");
  return li;
}

function showChapterChrome(on){
  document.querySelector(".tools").hidden = !on;
  document.querySelector(".bar").hidden = !on;
  $("key").hidden = !on; $("cards").hidden = !on;
}

function renderChapter(){
  showChapterChrome(true);
  const c = DATA[cur];
  $("ctitle").textContent = c.t;
  const s = chapStats(cur);
  $("cmeta").textContent = meta(s);
  $("cbar").style.width = (s.done/s.n*100)+"%";
  const list = $("qs"); list.innerHTML = "";
  const idxs = order || c.qs.map((_,i)=>i);
  let shown = 0;
  idxs.forEach(qi=>{
    const a = state.ans[qid(cur,qi)];
    if (filter==="wrong" && !isWrong(cur,qi)) return;
    if (filter==="unans" && a!==undefined) return;
    list.appendChild(renderQ(cur, qi)); shown++;
  });
  $("empty").textContent = "Nessuna domanda corrisponde al filtro.";
  $("empty").hidden = shown>0;
  $("t-wrong").setAttribute("aria-pressed", filter==="wrong");
  $("t-unans").setAttribute("aria-pressed", filter==="unans");
  $("t-next").hidden = cur===DATA.length-1;
  const tps = RAW.tp.filter(t=>t.ch===c.id);
  $("cards").innerHTML = `<h3>Schede di ripasso del capitolo</h3><p class="hint">${tps.length} schede: i punti chiave del riassunto e, separati, alcuni dettagli in più da sapere.</p>` + tps.map(t=>card(t,false)).join("");
  const items = c.qs.map(q=>`<li><b>${L[q.a]}</b> – ${esc(q.o[q.a])}</li>`).join("");
  $("key").innerHTML = `<h3>Risposte del capitolo</h3><p class="hint">Chiave completa in ordine di domanda.</p><details${state.mode==="study"?" open":""}><summary>Mostra la chiave delle risposte</summary><ol>${items}</ol></details>`;
}

function renderReview(){
  showChapterChrome(false);
  $("ctitle").textContent = "Da ripassare";
  const by = wrongList();
  const ids = RAW.tp.map(t=>t.id).filter(id=>by[id]);
  const nw = nWrong();
  $("cmeta").textContent = `${nw} ${nw===1?'errore':'errori'} in ${ids.length} ${ids.length===1?'argomento':'argomenti'}`;
  const list = $("qs"); list.innerHTML = "";
  $("empty").textContent = "Nessun errore finora. Quando sbagli una domanda, qui compare la scheda dell'argomento con le domande da rifare.";
  $("empty").hidden = ids.length>0;
  ids.sort((a,b)=>by[b].length-by[a].length).forEach(id=>{
    const tp = TOP[id]; const qs = by[id];
    const chap = DATA.find(c=>c.id===tp.ch);
    const li = document.createElement("li");
    li.className = "rev-topic"; li.style.listStyle = "none";
    const still = qs.filter(([ci,qi])=>isWrong(ci,qi)).length;
    li.innerHTML = `<div class="row"><span class="tally">${esc(chap?chap.t:"")} · <b>${still}</b> da rifare</span><button class="btn" type="button" data-retry="${id}">Rifai queste domande</button></div>` + card(tp,true);
    const ol = document.createElement("ol"); ol.className = "qs";
    qs.forEach(([ci,qi])=>ol.appendChild(renderQ(ci,qi)));
    li.appendChild(ol);
    list.appendChild(li);
  });
}

function render(){ if (view==="rev") renderReview(); else renderChapter(); }

document.addEventListener("click", e=>{
  const r = e.target.closest("[data-retry]");
  if (r){
    const by = wrongList();
    (by[r.dataset.retry]||[]).forEach(([ci,qi])=>{ retry[qid(ci,qi)] = true; delete state.ans[qid(ci,qi)]; });
    save(); renderToc(); renderReview(); return;
  }
  const b = e.target.closest(".opt"); if (!b || b.disabled) return;
  const li = b.closest("li.q"); const ci = +li.dataset.ci, qi = +li.dataset.qi, oi = +b.dataset.oi;
  state.ans[qid(ci,qi)] = oi; save();
  li.replaceWith(renderQ(ci, qi));
  if (view==="chap"){
    const s = chapStats(cur);
    $("cmeta").textContent = meta(s);
    $("cbar").style.width = (s.done/s.n*100)+"%";
  } else {
    const nw = nWrong(); $("cmeta").textContent = `${nw} ${nw===1?'errore':'errori'} da ripassare`;
  }
  renderToc();
});

function setMode(m){
  state.mode = m; save();
  $("m-quiz").setAttribute("aria-pressed", m==="quiz");
  $("m-study").setAttribute("aria-pressed", m==="study");
  render();
}
$("m-quiz").onclick = ()=>setMode("quiz");
$("m-study").onclick = ()=>setMode("study");
$("t-wrong").onclick = ()=>{ filter = filter==="wrong"?null:"wrong"; renderChapter(); };
$("t-unans").onclick = ()=>{ filter = filter==="unans"?null:"unans"; renderChapter(); };
$("t-shuffle").onclick = ()=>{ const n = DATA[cur].qs.length; order = [...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]];} renderChapter(); };
$("t-reset").onclick = ()=>{ DATA[cur].qs.forEach((_,qi)=>delete state.ans[qid(cur,qi)]); save(); filter=null; renderToc(); renderChapter(); };
$("t-next").onclick = ()=>{ if (cur<DATA.length-1) location.hash = DATA[cur+1].id; };
$("pick").onchange = e=>{ location.hash = e.target.value; };

function route(){
  const h = location.hash.slice(1);
  order = null; filter = null;
  if (h===REV){ view = "rev"; retry = {}; }
  else { view = "chap"; const i = DATA.findIndex(c=>c.id===h); cur = i>=0 ? i : 0; }
  renderToc(); render();
  if (h) window.scrollTo({top:0});
}
window.addEventListener("hashchange", route);
setMode(state.mode==="study"?"study":"quiz");
route();
</script>

</body>
