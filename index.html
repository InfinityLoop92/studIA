ientati nella Lombardia spagnola del 1628-1630."]},{"id":"c16-guerra2","ch":"cap-16","t":"Fasi danese, svedese e francese","s":["Fase danese (1625-1629): Cristiano IV (ducato di Holstein) sconfitto; Wallenstein, «imprenditore della guerra», duca di Friedland (1624), da 24.000 a oltre 100.000 uomini. Pace di Lubecca (7 giugno 1629). Editto di restituzione (1629): beni secolarizzati dopo il 1552.","Fase svedese (1630-1635): Gustavo Adolfo, «leone del Nord», finanziato da Richelieu; Breitenfeld (17 settembre 1631); Lützen (17 novembre 1632): vittoria ma morte del re; Oxenstierna per Cristina. Wallenstein ucciso (25 febbraio 1634). Nördlingen (6 settembre 1634): vittoria imperiale. Pace di Praga (1635).","Fase francese (maggio 1635-1648): Francia con Svezia e Province Unite: guerra politica per l'egemonia."],"p":["Nel 1631 le truppe imperiali di Tilly saccheggiarono Magdeburgo, una delle stragi più gravi della guerra."]},{"id":"c16-vestfalia","ch":"cap-16","t":"La pace di Vestfalia (1648)","s":["Sconfitte asburgiche: Breda (1637), Dune (21 ottobre 1639), il duca d'Enghien batte i tercios (19 maggio 1643).","Trattative a Münster e Osnabrück; la guerra franco-spagnola continua fino al 1659.","Territori: Province Unite indipendenti; Francia: Metz, Toul, Verdun, parte dell'Alsazia, Pinerolo; Svezia: Pomerania occidentale; Brandeburgo: Pomerania orientale, Magdeburgo, Minden.","Religione: anno normale 1624, calvinisti riconosciuti; elettori da 7 a 8 (Baviera + Palatinato restituito); Innocenzo X non riconosce. Principi liberi di allearsi; Germania perde quasi un terzo della popolazione."],"p":["La battaglia del 19 maggio 1643 è quella di Rocroi.","La guerra tra Francia e Spagna si chiuse con la pace dei Pirenei del 1659.","A Vestfalia fu riconosciuta formalmente anche l'indipendenza della Confederazione svizzera dall'Impero."]},{"id":"c17-societa","ch":"cap-17","t":"L'Inghilterra degli Stuart: economia e istituzioni","s":["1603: Giacomo I Stuart (già Giacomo VI di Scozia dal 1567): unione personale; unione politica nel 1707.","Enclosures contro open fields; lana: circa 75% dell'export; popolazione circa 4,5 milioni.","Parlamento: Lord e Comuni (voto nelle contee con 40 scellini di rendita). Anglicanesimo con Trentanove articoli; puritani; papisti.","Società: nobiltà senza grandi privilegi; gentry (giudici di pace, deputati); City di Londra; yeomen e freeholders, copyholders, braccianti, cottagers."],"p":[]},{"id":"c17-giacomo","ch":"cap-17","t":"Giacomo I e Carlo I fino al 1640","s":["Giacomo I (1603-1625): ministro Robert Cecil; tonnage and poundage; Bacon condannato (1621); Buckingham; congiura delle polveri (1605); Padri pellegrini (Mayflower, 1620); «No bishops, no king»; baronetti (1611).","Carlo I (1625-1649): Petition of Right (1628); Buckingham ucciso (agosto 1628); governo personale dal 1629 con Strafford e Laud (arminiano); ship money estesa a tutto il paese.","1638: rivolta scozzese contro la Chiesa anglicana. Short Parliament (aprile 1640) e Long Parliament (novembre 1640-1653)."],"p":["La congiura delle polveri, scoperta il 5 novembre 1605, è legata al nome di Guy Fawkes; in Inghilterra il 5 novembre si festeggia ancora la «Bonfire Night»."]},{"id":"c17-guerra","ch":"cap-17","t":"Dal Long Parliament alla guerra civile","s":["Long Parliament (Pym, Hampden): Strafford giustiziato (1641), Laud (1645); Triennial Act; abolita la Camera stellata; ship money illegale; vescovi fuori dai Lord.","1641: rivolta irlandese; Grand Remonstrance (22 novembre 1641); tentato arresto dei capi dell'opposizione → guerra civile (1642). Perché fallì l'assolutismo: niente esercito permanente né burocrazia, self-government della gentry, common law.","Re a Oxford; Parlamento con City, flotta e Solemn League and Covenant (1643). Marston Moor (2 luglio 1644): Cromwell e gli Ironsides; roundheads contro cavalieri. New Model Army (1645), Naseby (14 giugno 1645). Carlo si arrende agli scozzesi (1646)."],"p":[]},{"id":"c17-repubblica","ch":"cap-17","t":"Rivoluzione, repubblica e Cromwell","s":["Divisioni: presbiteriani (Chiesa di Stato) contro indipendenti (tolleranza); Levellers (dal 1646: sovranità popolare, voto ai maschi adulti liberi); agitatori dell'esercito. Putney (ottobre 1647): Rainborough contro Ireton.","Preston (agosto 1648); purga di Pride (6 dicembre 1648) → Rump Parliament; Carlo I decapitato il 30 gennaio 1649; Commonwealth il 19 maggio 1649.","Radicali: Diggers (Winstanley), Lilburne (England's New Chains), Burford (14 maggio 1649), Quinta Monarchia, quaccheri (Fox; Penn fonda la Pennsylvania nel 1681).","Cromwell: Irlanda (1649-1650), Scozia; Atto di navigazione (1651) e guerre con l'Olanda; Giamaica (1655); Lord Protettore (Instrument of Government, 1653). Muore il 3 settembre 1658.","Monck; Dichiarazione di Breda; Carlo II sbarca a Dover il 29 maggio 1660."],"p":["Carlo I fu decapitato a Londra, davanti alla Banqueting House di Whitehall.","Il conflitto tra corona e Parlamento si chiuse con la «Gloriosa rivoluzione» (1688-1689) e il Bill of Rights del 1689, che sancì la monarchia costituzionale."]},{"id":"c18-crisi","ch":"cap-18","t":"La crisi del Seicento","s":["Crisi generale: Hobsbawm (transizione dal feudalesimo al capitalismo) o scontro tra accentramento e autonomie (più tasse).","Rivolte di metà secolo: contadini, Catalogna, Portogallo, rivoluzione inglese, Napoli e Sicilia, Fronda.","Popolazione europea da circa 107 milioni (1600) a 125 milioni (1700): stagnazione in Germania, Spagna, Italia; crescita in Inghilterra, Province Unite, Russia, Scandinavia. Recessione dagli anni '20 a metà secolo; marginalizzazione del Mediterraneo."],"p":[]},{"id":"c18-scienza","ch":"cap-18","t":"La rivoluzione scientifica","s":["1543: Copernico. Keplero (1571-1630): orbite ellittiche, Astronomia nova (1609). Galileo (1564-1642): cannocchiale, fisica matematica, natura scritta in lingua matematica; ammonito nel 1616, Dialogo sopra i massimi sistemi (1632), abiura nel 1633.","Giordano Bruno (1548-1600): universo infinito, molti mondi; rogo il 17 febbraio 1600.","Meccanicismo: Cartesio (1596-1650); Harvey (1578-1657) e la circolazione del sangue. Bacone, Novum Organum (1620): metodo induttivo.","Strumenti: telescopio, microscopio, barometro, termometro, orologio a pendolo. Accademie: Lincei (Roma 1603), Cimento (Firenze 1657), Royal Society (Londra 1660), Académie des sciences (Parigi 1666). Leeuwenhoek.","1687: Newton, Principi matematici della filosofia naturale: gravitazione universale."],"p":["Galileo pubblicò nel 1610 il Sidereus Nuncius, dove descrisse le montagne della Luna e i quattro satelliti di Giove scoperti con il cannocchiale.","Il termine inglese «scientist» fu proposto da William Whewell nel 1833."]},{"id":"c18-streghe","ch":"cap-18","t":"La caccia alle streghe","s":["Dal XIII sec. l'idea del patto col demonio; nel XV sec. il modello del sabba. Malleus maleficarum (1486) dei domenicani Sprenger e Krämer.","Johann Weyer (De praestigiis daemonum, 1563): molte accusate sono malate; Bodin (Démonomanie, 1580) ribatte.","Processi soprattutto in tribunali civili (in Spagna e Italia anche Inquisizione: apostasia); vittime soprattutto donne povere, anziane, guaritrici e levatrici. Francia, Svizzera, Germania; Salem (1692, 19 condanne). Stime: 100.000-200.000 condanne. Ultime: Siviglia (1781), Poznań (1793)."],"p":[]},{"id":"c18-pensiero","ch":"cap-18","t":"Pensiero politico e mercantilismo","s":["Assolutismo: Filmer, Patriarcha (pubblicato nel 1680): il re come padre; Bossuet (pubblicato nel 1709): diritto divino.","Giusnaturalismo: Grozio, De jure belli ac pacis (1625), diritto internazionale.","Hobbes, Leviatano (1651): stato di natura = guerra di tutti contro tutti; pactum societatis + pactum subiectionis; potere assoluto per la sicurezza. Locke, Due trattati (1690): si conservano vita, libertà e proprietà; diritto di resistenza → liberalismo.","Mercantilismo (termine dal «sistema mercantile» di Adam Smith): economia al servizio dello Stato; Colbert (1666); metalli preziosi; bilancia attiva; dazi e monopoli; esclusiva coloniale; ricchezza mondiale considerata fissa."],"p":["Adam Smith critica il «sistema mercantile» nella Ricchezza delle nazioni (1776)."]},{"id":"c18-colonie","ch":"cap-18","t":"Imperi coloniali del Seicento","s":["Province Unite: VOC (1602, Oldenbarnevelt; società per azioni con poteri militari). Celebes (1607), Batavia (1619), Malacca (1641), Ceylon (1658), Molucche (1667), Capo (1652); Australia (1606), Nuova Zelanda (1642); Giappone. WIC (1621-1674): flotta spagnola catturata (1628), Luanda, São Jorge da Mina (1637), Brasile del nord (dal 1630, espulsi nel 1654), Nuova Olanda e Nieuw Amsterdam (New York dal 1664); restano Guyana e Curaçao.","Spagna: Filippine colonia dal 1583, capitale Manila. Portogallo: restano Timor, Macao, Goa, Diu; zucchero e tabacco in Brasile; oro e diamanti a Minas Gerais.","Inghilterra: Compagnia di Moscovia (1553); Compagnia delle Indie orientali (1600; società per azioni dal 1657); Amboina (1623); Hormuz (1622); Surat, Calicut, Madras, Bombay. America: Virginia (Raleigh, 1584), Massachusetts, Maryland, Giamaica (1655), New York (1664); tabacco, schiavi, contratti di servitù.","Francia: Québec (1608), Compagnia dei Cento Associati (1627, pellicce), Montreal (1642), coloni cattolici; Guadalupa e Martinica (1635), Guyana (1637), Saint-Domingue (1661); controllo regio (1663-1664), Colbert; 16.000 coloni nel 1700; Louisiana (1682); Compagnia delle Indie (1664), Pondichéry (1683)."],"p":["Il primo insediamento inglese stabile in Virginia fu Jamestown, fondato nel 1607.","Québec fu fondata da Samuel de Champlain; la Louisiana fu rivendicata da René-Robert Cavelier de La Salle.","La VOC fu sciolta nel 1799."]},{"id":"c19-economia","ch":"cap-19","t":"Economia italiana: crisi e ripresa","s":["Dopo il 1559: crescita («estate di San Martino»), oltre 13 milioni di abitanti nel 1600; bonifiche (Val di Chiana, Maremma, Polesine).","Crisi 1620-1660: lana -60% a Firenze, -70% a Venezia, -80-90% a Milano; seta -65% a Venezia, -80% a Genova e Milano. Cause esterne: guerre, Trent'anni, peste del 1630 (Nord e Toscana) e del 1656 (Sud), piccola glaciazione. Cause interne: concorrenza delle new draperies, corporazioni (magliai di Milano 1663). Resistono il lusso: liuteria di Cremona, vetro di Murano, sete d'oro.","Ripresa: circa 13,5 milioni; Roma da 100.000 a 135.000; riso e mais in pianura padana, gelsibachicoltura, viticoltura toscana; fustagni nelle campagne milanesi; organzini (filatoi idraulici, da Bologna). Divario Nord-Sud. L'Italia esporta materie prime e importa manufatti."],"p":["A Cremona lavoravano in questo periodo le grandi botteghe di liutai degli Amati, dei Guarneri e di Antonio Stradivari (1644-1737).","La peste del 1630 a Milano è quella raccontata da Manzoni nei Promessi sposi."]},{"id":"c19-cultura","ch":"cap-19","t":"Società e cultura del Seicento","s":["Ricchi investono in terra e debito pubblico; mentalità aristocratica: a Milano il commercio all'ingrosso diventa «vile commercio» (1593); a Genova arti meccaniche vietate ai patrizi (1603).","Barocco: stupore, movimento; Tesauro, Cannocchiale aristotelico (1654), metafora; Stigliani; Caravaggio. Controriforma e censura.","Torquato Accetto, La dissimulazione onesta (1641). Campanella (1568-1639): congiura antispagnola (1599), arresto (1600), finta pazzia, 27 anni a Napoli e 3 a Roma; La città del sole (1623)."],"p":["Campanella scrisse La città del sole in carcere intorno al 1602, prima in italiano; la prima edizione a stampa, in latino, uscì a Francoforte nel 1623."]},{"id":"c19-stati","ch":"cap-19","t":"Gli Stati italiani sotto l'egemonia spagnola","s":["Cambi: Ferrara al papa (1598), Urbino al papa (estinti i Della Rovere), Saluzzo ai Savoia (1601). Spagna: Sicilia e Sardegna, Napoli (1503), Milano (1535), Presidi: quasi metà della penisola. Altri: Parma e Piacenza (Farnese), Mantova e Monferrato (Gonzaga), Modena e Reggio (Este), Lucca (città imperiale). Solo Venezia fuori dall'influenza spagnola e con propri magistrati nei processi inquisitoriali.","Savoia: Emanuele Filiberto (1553-1580) sposta la capitale a Torino; Carlo Emanuele I (1580-1630), trattato di Lione (1601) per Saluzzo; Vittorio Amedeo I (1630-1637) cede Pinerolo; reggenza di Cristina e crisi risolta nel 1643; Carlo Emanuele II (1663-1675).","Toscana: duchi (1532), granduchi (1569). Cosimo I (1537-1574): Pratica segreta (1547), Siena (1557, «Stato nuovo»). Francesco I, Ferdinando I (porto franco di Livorno). Mezzadria.","Genova: Corsica recuperata (1559); guerra civile (1575), leges novae (1576); doge biennale, Serenissimi collegi; Banco di San Giorgio e i suoi «luoghi»; bombardamento di Luigi XIV (1684), scuse a Versailles.","Stato della Chiesa: congregazioni (Sisto V); legazioni di Bologna e Ferrara; piccolo nepotismo (cardinal nipote). Roma barocca di Bernini (1598-1680) e Borromini (1599-1667); Cristina di Svezia."],"p":["Di Bernini sono il colonnato di piazza San Pietro e il baldacchino della basilica; di Borromini la chiesa di San Carlo alle Quattro Fontane e Sant'Ivo alla Sapienza."]},{"id":"c19-missioni","ch":"cap-19","t":"Missioni e religione popolare","s":["1523: dodici francescani nel Messico di Cortés; difficoltà (violenza, battesimi superficiali; Inquisizione in America).","Gesuiti: Francesco Saverio (1506-1552: Goa, Malacca, Giappone; muore verso la Cina), Roberto Nobili (India), Valignano (Giappone), Matteo Ricci (Cina). Collegi missionari a Roma; De Propaganda Fide (1622).","In Italia missioni popolari, processioni, preghiere in latino; Bibbia in volgare vietata."],"p":["Matteo Ricci arrivò a Pechino nel 1601 e vi morì nel 1610; fu il primo europeo sepolto con il permesso dell'imperatore."]},{"id":"c19-venezia","ch":"cap-19","t":"Venezia nel Seicento","s":["Dopo Agnadello (1509) e Cipro (1571): neutralità. Consiglio dei Dieci sopra il Senato; tre Inquisitori di Stato (1539). «Giovani» contro «vecchi».","1605: due preti arrestati; 1606 interdetto di Paolo V; Venezia espelle i gesuiti; Paolo Sarpi difende lo Stato (Storia del concilio tridentino, 1619); mediazione franco-spagnola. Richer (1614).","Guerra di Gradisca (1615-1617) contro gli Asburgo e gli uscocchi. Concorrenza di Ancona e Ragusa; ville in Terraferma. Guerra di Candia (1645-1669): oltre cento famiglie della Terraferma nel patriziato; Creta perduta nel 1669."],"p":["Nel 1607 Paolo Sarpi fu aggredito e ferito a pugnalate a Venezia da sicari legati alla Curia romana; sopravvisse."]},{"id":"c19-rivolte","ch":"cap-19","t":"Rivolte nel Mezzogiorno: Palermo, Napoli, Messina","s":["Più tasse sul Sud e sulle isole (Milano risparmiata). Palermo (agosto 1647): gabelle abolite, corporazioni nel governo, ordine ristabilito presto.","Napoli (7 luglio 1647, tassa sulla frutta): Masaniello (Tommaso Aniello D'Amalfi) e Giulio Genoino; Masaniello ucciso il 16 luglio; rivolta antifeudale nelle province; Real repubblica napoletana (ottobre 1647) sotto protezione francese; spagnoli di nuovo a Napoli il 6 aprile 1648.","Messina: rivolta (1672), corporazioni a metà del Senato; nel 1674 espulsione degli spagnoli con l'aiuto di Luigi XIV; Palermo non aderisce; riconquista spagnola (1678)."],"p":["Masaniello aveva 27 anni (era nato nel 1620)."]},{"id":"x-cronologia","ch":"ripasso","t":"Cronologia essenziale 1454-1700","s":["1454 Lodi · 1492 America, Granada, morte di Lorenzo · 1494 Carlo VIII · 1498 Vasco da Gama · 1509 Agnadello · 1513 Il Principe · 1515 Marignano · 1517 95 tesi · 1519 Carlo V imperatore · 1521 Worms, Tenochtitlán · 1525 Pavia · 1527 sacco di Roma · 1530 Bologna · 1534 Atto di supremazia, gesuiti · 1545 Trento · 1555 Augusta · 1559 Cateau-Cambrésis · 1571 Lepanto · 1572 San Bartolomeo · 1581 Province Unite · 1588 Armata · 1598 Nantes · 1618 Praga · 1648 Vestfalia · 1649 Carlo I giustiziato · 1660 Restaurazione · 1687 Newton."],"p":[]},{"id":"x-imperi","ch":"ripasso","t":"Imperi, colonie e assetti territoriali","s":["Carlo V (1519): Castiglia e Aragona con Napoli, Sicilia, Sardegna e America; Paesi Bassi e Borgogna; Austria; Impero; Milano dal 1535. Divisione: a Filippo II Spagna, Italia, America, Paesi Bassi; a Ferdinando Austria e Impero.","Unione iberica 1580-1640 (riconoscimento del Portogallo nel 1668).","Portogallo: Goa, Malacca, Hormuz, Macao, Brasile. Spagna: dalla California al Cile, Filippine. Olanda: Batavia, Ceylon, Molucche, Capo, Nieuw Amsterdam, Curaçao. Inghilterra: Virginia, Massachusetts, Giamaica, India (Madras, Bombay). Francia: Québec, Louisiana, Antille, Pondichéry."],"p":[]},{"id":"x-istituzioni","ch":"ripasso","t":"Battaglie, organi e trattati a confronto","s":["Organi: Stati generali (Francia; Province Unite all'Aia), Cortes (Spagna), Parlamento (Inghilterra), Sejm (Polonia), Riksdag (Svezia), Stände (Germania); Venezia: Maggior Consiglio, Senato, Consiglio dei Dieci, doge; Genova: doge biennale, Serenissimi collegi.","Vittorie ottomane: Mohács (1526), Prevesa (1538). Sconfitte francesi: Garigliano (1503), Bicocca (1522), Pavia (1525), San Quintino (1557). Breitenfeld 1631, Lützen 1632, Nördlingen 1634.","Editti e paci religiose: Augusta 1555, Saint-Germain 1562, Nantes 1598, Lettera di maestà 1609, restituzione 1629, Vestfalia 1648."],"p":[]}],"cc":[{"id":"k0","ch":"cap-4","t":"Mulini e camma: l'energia prima delle macchine","x":"Prima della macchina a vapore l'unica energia «meccanica» disponibile oltre a uomini e animali veniva dall'acqua e dal vento. I mulini ad acqua, noti già ai Romani ma poco usati nell'Alto Medioevo (in un'economia chiusa conveniva di più la manodopera servile), tornarono a diffondersi dal IX secolo; dal XII arrivò il mulino a vento, decisivo nelle pianure del Nord senza grandi corsi d'acqua. La svolta tecnica fu la camma, che trasforma la rotazione della ruota in un movimento su e giù: così la stessa energia poteva battere la lana nella gualchiera (follatura, che rende il tessuto compatto e resistente), ridurre in pasta gli stracci nella cartiera o azionare mantici e magli. È la base tecnologica su cui l'età moderna costruì, senza rivoluzionarla, la propria manifattura."},{"id":"k1","ch":"cap-4","t":"Stampa e polvere da sparo","x":"Le due innovazioni simbolo dell'inizio dell'età moderna hanno effetti ben oltre la tecnica. La stampa a caratteri mobili (Gutenberg, metà Quattrocento) moltiplica e rende economici i libri, e sarà essenziale per l'Umanesimo e per la diffusione della Riforma. La polvere da sparo, oltre a cambiare la guerra (artiglieria, archibugi, fine dei castelli), entra nelle miniere: con le cariche esplosive si scavano pozzi fino a 300 metri, mentre le ruote idrauliche prosciugano le gallerie. Ne deriva più argento e rame, metalli fondamentali per le monete e per l'artiglieria, e servono altiforni in muratura per fondere il ferro."},{"id":"k2","ch":"cap-4","t":"La crisi del legno e il passaggio al carbone","x":"Le società preindustriali dipendevano dal legno per tutto: cucinare, scaldarsi, costruire case e navi, alimentare fornaci, tintorie e fonderie (tramite il carbone di legna). Tra fine Cinquecento e inizio Seicento la crescita della popolazione, il disboscamento per coltivare e le costruzioni navali resero il legno scarso: il suo prezzo passò da 98 a 500 (indice 100 = media 1450-1650) e il carbone di legna aumentò di due volte e mezza tra 1630 e 1670. Fu una crisi energetica in anticipo sui tempi. L'Inghilterra rispose aprendo miniere di carbon fossile dalla metà del XVI secolo, l'Olanda bruciando torba. Il passaggio da una fonte rinnovabile (il legno) a una non rinnovabile ma abbondante (il carbone) è una delle condizioni che permetteranno, due secoli dopo, la Rivoluzione industriale inglese."},{"id":"k3","ch":"cap-4","t":"Manifattura, non industria","x":"Gli storici distinguono manifattura e industria. L'industria moderna nasce con la Rivoluzione industriale: grandi capitali, molti operai salariati riuniti in fabbrica, macchine e divisione razionale del lavoro. Nell'età moderna prevalgono invece la produzione domestica e la bottega artigiana. Esistono però già grandi concentrazioni di lavoratori dove serve: l'Arsenale di Venezia (oltre 3.000 addetti, capace nel 1570 di armare 100 galere in due mesi), le miniere di allume dello Stato della Chiesa (l'allume serviva a fissare i colori e conciare le pelli), le manifatture di lusso finanziate dallo Stato francese come i Gobelins (arazzi) e Saint-Gobain (vetri). Non sono ancora fabbriche moderne perché molti lavoratori restano artigiani proprietari dei propri attrezzi."},{"id":"k4","ch":"cap-4","t":"Le corporazioni (arti)","x":"Le corporazioni nascono con la rinascita delle città dall'XI secolo, come associazioni giurate di chi esercitava lo stesso mestiere, simili ai patti che diedero origine ai Comuni. La gerarchia interna era fissa: il maestro possedeva la bottega, l'apprendista imparava il mestiere (spesso pagando), il garzone lavorava a salario. La corporazione aveva il monopolio della produzione in città, fissava qualità, prezzi e salari, e svolgeva funzioni religiose e assistenziali (santo patrono, aiuto a vedove e orfani). Proprio questa protezione la rese, nell'età moderna, un freno: le corporazioni escludevano i forestieri e bloccavano le innovazioni che potevano togliere lavoro, come accadde a Milano a fine Seicento contro una macchina che faceva il lavoro di venti filatrici di oro e argento. Gli illuministi le criticarono come ostacolo alla libertà di lavoro; furono abolite durante la Rivoluzione francese."},{"id":"k5","ch":"cap-4","t":"Il putting out system","x":"Il putting out system (manifattura dispersa) è il modo in cui il capitale mercantile organizza la produzione fuori dalle città. Il mercante-imprenditore compra la lana, la fa pulire, poi la distribuisce ai contadini, che la filano e la tessono in casa nei mesi in cui il lavoro dei campi lascia tempo; agenti consegnano e ritirano, il pagamento è a cottimo. Il mercante finisce il ciclo con follatura e tintura e vende. I vantaggi: si evitano i vincoli corporativi, la manodopera rurale costa poco, la produzione si allarga o si restringe secondo la domanda. Il risultato sono tessuti meno pregiati ma economici, come le new draperies inglesi, che conquistano i mercati e mettono in crisi le manifatture urbane fiamminghe e italiane. Si parla di protoindustria perché in alcune regioni preparò la fabbrica, quando i telai meccanici divennero troppo costosi per i contadini."},{"id":"k6","ch":"cap-4","t":"Le navi dell'età moderna","x":"Ogni nave risponde a un mare e a uno scopo. Nel Mediterraneo domina fino al Seicento la galea, lunga e bassa, spinta da remi e vele latine: manovrabile anche senza vento, ideale per la guerra (Lepanto 1571) ma con poca stiva. Sull'Atlantico servono scafi tondi e alti: la caravella portoghese, piccola, veloce e con equipaggio ridotto, è la nave delle esplorazioni; il galeone, con due ponti, quattro alberi e molti cannoni, unisce guerra e trasporto di metalli preziosi; il fluyt olandese (fine XVI secolo), con grande stiva e pochi marinai, abbassa i costi dei noli e fa degli olandesi i trasportatori d'Europa. Intanto si passa dai portolani (manuali di navigazione costiera) alla navigazione in mare aperto con bussola, astrolabio e carte come quella di Mercatore (1569), che permette di tracciare rotte rettilinee."},{"id":"k7","ch":"cap-4","t":"Pirateria e guerra di corsa","x":"Il pirata attacca le navi per conto proprio; il corsaro lo fa con una «lettera di corsa» rilasciata da uno Stato in guerra, contro le navi nemiche: è una forma legale di guerra economica. Nella pratica il confine era sottile, perché i pirati ottenevano lettere in tempo di guerra e continuavano in tempo di pace. Nel Mediterraneo operavano soprattutto i corsari barbareschi del Nord Africa; nell'Atlantico filibustieri e bucanieri inglesi, francesi e olandesi assaltavano i galeoni spagnoli carichi d'argento. La Francia rivoluzionaria abolì la corsa nel 1792 (salvo poi appoggiare Robert Surcouf contro gli inglesi); l'abolizione internazionale arrivò con la Dichiarazione di Parigi del 1856, firmata al congresso che chiuse la guerra di Crimea."},{"id":"k8","ch":"cap-4","t":"Hansa, Sund e commercio del Nord","x":"Nel Nord Europa il commercio medievale era organizzato dalla Lega anseatica (Hansa), un'alleanza di città mercantili tedesche e baltiche (Lubecca, Amburgo, Brema, Danzica, Riga) che controllava legname, grano, pellicce e pesce. Dal Quattrocento la Lega declina davanti agli Stati territoriali: nel 1535 la Svezia sconfigge Lubecca e si libera dalla sua tutela. Nel Seicento il Baltico diventa il «granaio» dell'Europa occidentale e il dominio passa agli olandesi; il passaggio obbligato è lo stretto di Sund, dove la Danimarca riscuote dazi, e i suoi registri ci mostrano poi l'ascesa inglese nel Settecento. Per raggiungere la Russia evitando il Baltico, nel Cinquecento si apre anche la rotta artica fino ad Arcangelo, sul Mar Bianco."},{"id":"k9","ch":"cap-4","t":"Dal Mediterraneo all'Atlantico","x":"All'inizio dell'età moderna il Mediterraneo è ancora il centro degli scambi con l'Asia: le spezie arrivano via golfo Persico e mar Rosso ai porti del Levante e Venezia e Genova le distribuiscono in Europa. Due eventi cambiano il quadro: nel 1498 i portoghesi arrivano in India circumnavigando l'Africa e comprano le spezie alla fonte; dal 1492 l'America apre l'Atlantico, con oro e argento che affluiscono a Siviglia e poi zucchero e tabacco. Venezia regge per tutto il Cinquecento, ma nel Seicento declinano Spagna e Portogallo e salgono Olanda, Inghilterra e Francia. Il commercio con l'Asia resta in passivo (l'Europa compra più di quanto vende e paga in argento). Il risultato di lungo periodo è lo spostamento del baricentro economico europeo verso il Nord e l'Atlantico."},{"id":"k10","ch":"moneta","t":"Lira, soldo e denaro","x":"Con la riforma di fine VIII secolo Carlo Magno fondò il sistema monetario usato in Europa per un millennio: una sola moneta reale d'argento, il denaro (1,76 g, lega 950/1000), e due unità di conto per fare i calcoli, il soldo (12 denari) e la lira (20 soldi = 240 denari). Lira e soldo inizialmente non venivano coniati: erano «monete di conto», come oggi diremmo «un milione» senza che esista una banconota da un milione. Questo schema 1:20:240 sopravvisse fino al sistema decimale francese del 1795, e in Inghilterra (pound, shilling, pence) addirittura fino al 1971."},{"id":"k11","ch":"moneta","t":"Il ritorno dell'oro: fiorino e bimetallismo","x":"Con la crescita economica dopo il Mille il piccolo denaro d'argento non basta più per i grandi pagamenti: si conia il grosso d'argento e, nel 1252, Firenze (fiorino) e Genova (genovino) tornano a coniare oro, seguite da Venezia (ducato) e Francia (scudo). Nasce il bimetallismo: circolano insieme monete d'oro e d'argento, e lo Stato deve fissare un rapporto legale tra i due metalli (per esempio 1 oro = 12 argento) che segua il loro prezzo di mercato, altrimenti la moneta sottovalutata sparisce dalla circolazione. Chiunque poteva portare metallo alla zecca e ricevere monete, meno le spese di coniazione e il signoraggio, cioè la quota che spettava allo Stato."},{"id":"k12","ch":"moneta","t":"Banche e lettera di cambio","x":"Due invenzioni italiane del XII secolo permettono di far circolare la ricchezza senza spostare monete. I banchieri accettano depositi e rilasciano ricevute; capiscono che non serve tenere in cassa tutto e prestano una parte del denaro: nasce il credito. Quando le ricevute passano di mano con una girata diventano una prima forma di banconota (moneta bancaria). La lettera di cambio, invece, è un ordine di pagamento: un mercante versa denaro a Firenze e il suo corrispondente lo restituisce a Bruges, in un'altra moneta e dopo un certo tempo, con un interesse nascosto nel cambio. Così il commercio a distanza evita il trasporto di contante e i rischi di furti."},{"id":"k13","ch":"moneta","t":"La rivoluzione dei prezzi","x":"Nel Cinquecento i prezzi in Europa salgono in modo continuo fino ai primi decenni del Seicento. Lo storico Earl J. Hamilton (1934) lo collegò all'arrivo dell'argento americano a Siviglia, applicando la teoria quantitativa della moneta di Irving Fisher (1909): se aumentano la moneta e la sua velocità di circolazione mentre i beni restano gli stessi, i prezzi salgono. La spiegazione è stata corretta: l'aumento fu in media del 2% annuo, molti vivevano ancora di autoconsumo, una parte dell'argento finì in Asia e l'inflazione era cominciata prima del grande afflusso da Potosí. Oggi si considera decisiva anche la crescita della popolazione, che fa salire la domanda di cibo più in fretta della produzione agricola: non a caso i cereali quadruplicano quasi di prezzo, molto più dei salari, impoverendo chi vive del proprio lavoro."},{"id":"k14","ch":"moneta","t":"Svalutazioni e legge di Gresham","x":"Le monete valevano per il metallo che contenevano, e questo le esponeva a due abusi. I privati le «tosavano», limandone i bordi (contro cui dal Seicento si introduce il bordo zigrinato); i sovrani le svalutavano, aggiungendo metallo vile per coniarne di più con lo stesso argento, come Filippo IV il Bello, accusato da Dante di falsificare la moneta. La legge di Gresham descrive cosa succede quando circolano monete con lo stesso valore legale ma diverso contenuto: la gente spende quella cattiva e tiene, esporta o fonde quella buona, che sparisce. Le svalutazioni però non erano solo negative: in un'economia con poco metallo prezioso aumentavano i mezzi di pagamento e contrastavano la deflazione."},{"id":"k15","ch":"moneta","t":"Moneta grossa, piccola e di conto","x":"Dal XIII secolo convivono la moneta grossa (oro e argento buono, per commercio e finanza) e la moneta piccola (per spese quotidiane e salari), che viene svalutata fino a diventare quasi solo rame: una moneta fiduciaria che vale per legge più del metallo che contiene. Poiché le monete reali cambiavano continuamente valore e negli Stati circolavano decine di monete straniere (Beccaria nel 1762 ne contò a Milano 22 d'oro e 29 d'argento, quasi tutte estere), i conti si tenevano in moneta di conto (lira tornese in Francia, lira imperiale, sterlina, gulden). Così si vede come il fiorino d'oro, stabile, passi da 240 a 1680 denari nel 1500 e a 3192 a inizio Settecento: non è il fiorino che sale, è il denaro che si svaluta. Per i debitori, come i sovrani, una moneta di conto svalutata alleggeriva i debiti."},{"id":"k16","ch":"moneta","t":"Dal franco al 1971","x":"La Rivoluzione francese semplifica tutto: nel 1795 nasce il franco d'argento diviso in 100 centesimi, sistema decimale che le conquiste napoleoniche diffondono in Europa. Nell'Ottocento si afferma il gold standard: le banconote sono convertibili in oro e le banche centrali non possono stampare oltre le riserve, cosa che garantisce stabilità ma lega la moneta all'oro disponibile. Il sistema crolla con la Prima guerra mondiale; dopo la Seconda (accordi di Bretton Woods, 1944) solo il dollaro resta convertibile, a 35 dollari l'oncia, e le altre valute si agganciano al dollaro. Il 15 agosto 1971 Nixon sospende la convertibilità: da allora le monete sono puramente fiduciarie, valgono per la fiducia nelle istituzioni che le emettono."},{"id":"k17","ch":"cap-6","t":"Lo Stato di antico regime","x":"Nel Medioevo il re era solo uno dei poteri: nobili, vescovi, città e corporazioni amministravano giustizia, riscuotevano tasse e armavano uomini. Dal XI secolo il diritto romano rilancia l'idea di imperium, un potere superiore agli altri; dalla metà del Quattrocento i re di Francia, Spagna e Inghilterra costruiscono apparati (fisco, eserciti, funzionari) per ridurre queste autonomie. Ne escono gli Stati di antico regime: monarchie più forti, ma che convivono con i privilegi dei ceti, i diritti feudali, le autonomie locali e l'idea che il regno sia patrimonio della dinastia. Per questo non sono ancora Stati moderni: l'uguaglianza davanti alla legge e il territorio uniforme arriveranno con la Rivoluzione francese."},{"id":"k18","ch":"cap-6","t":"Machiavelli, Bodin, Botero: nasce la teoria dello Stato","x":"Tra Cinquecento e Seicento la parola «Stato» assume il senso moderno di potere organizzato su un territorio e una popolazione. Machiavelli nel Principe (1513) distingue repubbliche e principati e studia la politica come tecnica per conquistare e mantenere il potere. Jean Bodin, nei Sei libri della Repubblica (1576), scritti durante le guerre di religione francesi, definisce la sovranità come potere perpetuo e assoluto di fare le leggi senza il consenso dei sudditi: l'unico modo, per lui, di salvare l'ordine dalla guerra civile. Giovanni Botero (Della Ragion di Stato, 1589) teorizza che l'azione politica miri alla conservazione e alla potenza dello Stato. Hobbes, nel Seicento, porterà questa linea al Leviatano."},{"id":"k19","ch":"cap-6","t":"Legibus solutus e leggi fondamentali","x":"La formula «car tel est notre plaisir» (perché così ci piace) chiudeva gli editti dei re di Francia e riassume l'assolutismo: il re è legibus solutus, sciolto dalle leggi che egli stesso fa. Ma assoluto non vuol dire arbitrario: anche per Bodin il re deve rispettare la legge divina, il diritto naturale (per esempio la proprietà dei sudditi) e le leggi fondamentali del regno, che nemmeno lui può cambiare. La più nota è la legge salica, che in Francia escludeva le donne e i loro discendenti dalla successione: fu decisiva nel 1589, quando portò sul trono Enrico di Borbone, parente lontanissimo ma in linea maschile."},{"id":"k20","ch":"cap-6","t":"Monarchia patrimoniale e confini","x":"Per i re dell'età moderna il regno era un patrimonio di famiglia: si ereditava, si portava in dote, si scambiava nei trattati. Lo mostra Carlo V, che dopo la pace di Crépy (1544) rinunciò a cedere i Paesi Bassi perché erano il cuore dell'eredità borgognona della dinastia. Ne derivavano confini ben diversi dai nostri: non linee nette, ma intrecci di feudi, diritti dinastici, diocesi e pedaggi, in cui un sovrano poteva essere vassallo di un altro per alcune terre. Il confine come linea che separa due sovranità e due popoli si afferma solo dopo la Rivoluzione francese, insieme all'idea moderna di nazione."},{"id":"k21","ch":"cap-6","t":"Il re sacro: sacre, tocco regio, diritto divino","x":"La monarchia non era solo un potere politico ma una funzione sacra. In Francia il re veniva consacrato a Reims (dove la tradizione poneva il battesimo di Clodoveo, nel 496) con l'olio della Santa Ampolla e riceveva la comunione sotto le due specie come un sacerdote; l'anello simboleggiava le nozze con il regno. Ai re di Francia e d'Inghilterra si attribuiva il potere di guarire la scrofolosi toccando i malati («il re ti tocca, Dio ti guarisce»): Luigi XV ne toccò circa 2000 nel 1722 e il rito durò fino al 1824. Teoricamente il potere veniva da Dio (omnis potestas a Deo), ma per Tommaso d'Aquino passava attraverso il popolo, mentre i teorici del diritto divino lo facevano discendere direttamente da Dio, rendendo il re responsabile solo davanti a lui. Nel Settecento i sovrani illuminati (Federico II, Giuseppe II) si presentano invece come primi servitori dello Stato."},{"id":"k22","ch":"cap-6","t":"Assemblee dei ceti e dualismo istituzionale","x":"All'inizio dell'età moderna il re governa insieme alle assemblee che rappresentano i ceti (clero, nobiltà, terzo stato): Stati generali in Francia, Cortes in Spagna, Stände in Germania, Parlamento in Inghilterra (Lord e Comuni), Sejm in Polonia (solo nobiltà). Si parla di dualismo istituzionale e di Stato per ceti (Ständestaat). Le assemblee nascono da un patto: riconoscono il re se questi rispetta privilegi e consuetudini, e soprattutto votano le tasse, secondo il principio «ciò che riguarda tutti deve essere approvato da tutti» (dove «tutti» sono i ceti, non gli individui). Lo scontro decisivo riguarda la frequenza delle riunioni: dove i re riescono a non convocarle (Francia, Spagna) nasce l'assolutismo; dove le assemblee si riuniscono regolarmente (Inghilterra, Polonia) il potere del re resta limitato."},{"id":"k23","ch":"cap-6","t":"La corte e i primi organi stabili","x":"Nel Rinascimento i sovrani smettono di spostarsi tra un castello e l'altro e si fermano in una residenza: nasce la corte, con cortigiani, artisti, letterati e un'etichetta rigida che diventa modello di buone maniere per tutta la società (da qui «cortese»). La sua magnificenza è politica: mostra la superiorità del re sull'alta nobiltà, che a corte viene tenuta vicina e sorvegliata. Ma la corte è il centro simbolico, non l'amministrazione vera e propria: già tra XI e XIV secolo si erano separati organi stabili come la cancelleria (atti e corrispondenza) e i supremi tribunali, nucleo della futura burocrazia."},{"id":"k24","ch":"cap-6","t":"Stato moderno, Hegel e Marx","x":"La Rivoluzione francese e l'Ottocento definiscono lo Stato moderno: una sovranità su un territorio preciso, il monopolio della forza legittima (secondo la definizione di Max Weber), leggi uguali per tutti i cittadini e un'amministrazione separata dalle persone che governano, tanto che lo Stato diventa una persona giuridica che sopravvive ai cambi di governo. Sulla sua natura si scontrano due interpretazioni: per Hegel (1821) lo Stato è la realtà superiore che compone gli egoismi della società civile; per Marx è lo strumento della classe dominante. Oggi globalizzazione, finanza, terrorismo e crisi ambientale superano i confini e mettono in crisi la sovranità del singolo Stato."},{"id":"k25","ch":"stato-moderno","t":"La pace di Lodi e la diplomazia permanente","x":"La pace di Lodi (1454) chiuse le guerre tra Milano e Venezia e creò un equilibrio tra i cinque grandi Stati italiani (Milano, Venezia, Firenze, Stato della Chiesa, Napoli), garantito da una Lega italica. Per mantenerlo ognuno doveva sapere cosa facevano gli altri: nacquero così gli ambasciatori residenti, stabili presso le corti straniere, mentre prima si inviavano solo missioni occasionali. Venezia fu maestra in questo (le relazioni dei suoi ambasciatori al Senato sono fonti preziosissime). Nel Cinquecento il modello si estese all'Europa: Francesco I mandò rappresentanti persino presso il sultano, il papa i nunzi; nacquero regole di precedenza e cerimoniale."},{"id":"k26","ch":"stato-moderno","t":"Dalla cavalleria alla fanteria: svizzeri, lanzichenecchi, tercios","x":"Per secoli la guerra era stata dominata dalla cavalleria pesante dei nobili, e quindi il re dipendeva dai feudatari. La guerra dei Cent'anni ne mostrò i limiti: ad Azincourt (1415) gli arcieri inglesi decimarono i cavalieri francesi. Tra Quattro e Cinquecento la regina delle battaglie diventa la fanteria: gli Svizzeri combattono in quadrati compatti di picchieri (picche di oltre cinque metri) contro cui le cariche si infrangono, e vengono assoldati da tutti; Massimiliano d'Asburgo li imita con i lanzichenecchi tedeschi; la Spagna crea nel 1496 i tercios, unità di circa 3000 uomini che uniscono picche e armi da fuoco e dominano i campi di battaglia fino a metà Seicento. I fanti si reclutano e si pagano: è un esercito del re, non dei nobili."},{"id":"k27","ch":"stato-moderno","t":"Artiglieria e fortezze bastionate","x":"Dalla seconda metà del Quattrocento i cannoni diventano abbastanza potenti da abbattere le alte mura medievali: la discesa di Carlo VIII in Italia nel 1494 lo mostrò in modo traumatico. Il castello perde il valore militare e diventa residenza. Per difendersi si inventa la fortezza bastionata, detta «alla moderna»: mura basse e spesse rinforzate da terrapieni, pianta poligonale con bastioni sporgenti a punta da cui si colpisce di fianco chi attacca. Queste fortezze costano moltissimo e rendono la guerra lenta, fatta di lunghi assedi: un altro motivo per cui servono Stati con grandi entrate fiscali."},{"id":"k28","ch":"stato-moderno","t":"Marignano 1515","x":"A Marignano (oggi Melegnano, vicino a Milano), il 13-14 settembre 1515 (il cap. 12 del riassunto indica il 14-15), il giovane Francesco I di Francia affrontò gli Svizzeri che difendevano il ducato di Milano per conto di Massimiliano Sforza. I quadrati svizzeri furono fermati dall'artiglieria francese e dai lanzichenecchi; la battaglia durò due giorni e fu così sanguinosa da essere chiamata «battaglia dei giganti». Ebbe due conseguenze: la Francia riprese Milano (confermata dalla pace di Noyon del 1516) e gli Svizzeri, dopo la «pace perpetua» firmata con la Francia a Friburgo nel 1516, rinunciarono alle avventure in Italia, conservando il Ticino. Militarmente segnò la fine del mito della fanteria svizzera invincibile."},{"id":"k29","ch":"stato-moderno","t":"Armi da fuoco, baionetta e fuoco a salve","x":"Le armi da fuoco individuali si evolvono dallo schioppo all'archibugio e, da metà Cinquecento, al moschetto. Arco e balestra spariscono non perché peggiori, ma perché richiedevano anni di addestramento, mentre un archibugiere si formava in poco tempo: si potevano quindi arruolare masse di soldati. La cultura cavalleresca le disprezzava (Ariosto le chiama «abominioso ordigno» perché un villano poteva uccidere un cavaliere). Due innovazioni completano la trasformazione: il fuoco a salve successive degli olandesi (fine Cinquecento), in cui le file sparano a turno mentre le altre ricaricano, che richiede un addestramento ossessivo; e la baionetta (fine Seicento), che trasforma il fucile in picca e fa sparire i picchieri all'inizio del Settecento."},{"id":"k30","ch":"stato-moderno","t":"Eserciti permanenti e tasse","x":"La rivoluzione militare ha un effetto politico decisivo. Fanti, artiglieria e fortezze si pagano con il denaro, non con i vassalli: il re che dispone di soldi recluta e comanda direttamente, riducendo la dipendenza dai nobili. Nella prima metà del Seicento i maggiori Stati mantengono eserciti permanenti di almeno 100.000 uomini, professionisti e mercenari addestrati di continuo. Per pagarli le tasse, prima straordinarie, diventano regolari: da qui nascono i conflitti con le assemblee dei ceti e, alla lunga, le grandi rivolte fiscali del Seicento."},{"id":"k31","ch":"stato-moderno","t":"Il re protettore della Chiesa","x":"Poiché il potere regio era considerato di origine divina, i sovrani si presentavano come difensori della fede e ne ricavavano titoli: «cristianissimo» il re di Francia, «re cattolici» Ferdinando e Isabella (dopo la conquista di Granada, 1492), «Defensor fidei» Enrico VIII, premiato da Leone X per un libro contro Lutero (il papa glielo tolse dopo lo scisma del 1534, ma il Parlamento glielo riconfermò nel 1544, e i sovrani britannici lo portano ancora). In cambio volevano controllare la Chiesa nazionale: diritto di intervenire nelle questioni religiose (jus circa sacra), di sorvegliarla (jus inspectionis) e correggerla (jus reformandi), il placet sugli atti del papa, la nomina dei vescovi e la tassazione dei beni ecclesiastici."},{"id":"k32","ch":"stato-moderno","t":"Consigli ristretti e favoriti","x":"Per decidere in fretta, i re affidano la politica a organi ristretti di persone di fiducia: il Privy Council inglese, il Conseil d'en haut francese, il Consejo de Estado spagnolo, il Consiglio segreto tedesco. Accanto crescono i segretari di Stato, da cui nascerà la figura del ministro. Spesso i membri sono «uomini nuovi», non grandi aristocratici, scelti per competenza e fedeltà. Ma il potere reale poteva anche non coincidere con le cariche: il favorito (valido) contava perché aveva l'accesso diretto al re, come il duca di Lerma con Filippo III e il conte-duca di Olivares con Filippo IV (1621-1643)."},{"id":"k33","ch":"stato-moderno","t":"Venalità delle cariche e nobiltà di toga","x":"In molti Stati, e soprattutto in Francia, gli uffici pubblici (giudici, funzionari delle finanze) si compravano: lo Stato ne ricavava denaro immediato, l'acquirente un reddito e un prestigio. Col tempo gli ufficiali considerarono la carica una proprietà da vendere o lasciare ai figli; nel 1604 Enrico IV ne regolò l'ereditarietà con una tassa annuale (la paulette). Le cariche più alte davano la nobiltà: così mercanti e finanzieri del Terzo Stato entrarono nell'élite come «nobiltà di toga», distinta dalla vecchia nobiltà di spada. Effetto doppio: mobilità sociale, ma anche funzionari inamovibili che il re non poteva controllare."},{"id":"k34","ch":"stato-moderno","t":"Fisco di antico regime","x":"Lo Stato moderno nasce anche dalla fame di entrate. Ma il fisco di antico regime era frammentato: tante casse separate, nessun bilancio generale, prestiti forzosi nei momenti di bisogno. Le imposte dirette erano rozze: il testatico colpiva ogni persona, il focatico ogni famiglia (fuoco), senza guardare alla ricchezza. Le indirette (sui consumi) venivano appaltate a finanzieri privati che anticipavano il denaro e poi lo riscuotevano con profitto. Regioni e ceti avevano privilegi diversi: in Francia la gabella del sale variava da provincia a provincia e la Bretagna ne era esente; clero e nobiltà erano spesso esentati. Nel Settecento i catasti (censimenti delle terre) rendono più equa l'imposta fondiaria, ma un fisco uniforme arriva solo con la Rivoluzione francese."},{"id":"k35","ch":"stato-moderno","t":"La pace di Vestfalia come sistema di Stati","x":"La pace di Vestfalia (1648), formata dai trattati di Münster e Osnabrück, chiuse la guerra dei Trent'anni. Oltre alle clausole territoriali e religiose, è considerata la nascita del sistema internazionale moderno: gli Stati si riconoscono come entità sovrane ed eguali per dignità, indipendentemente dalla religione e senza un'autorità superiore (né papa né imperatore). Da allora la politica estera ragiona in termini di interessi ed equilibrio tra potenze, non di unità della cristianità."},{"id":"k36","ch":"stato-moderno","t":"Lepanto 1571","x":"La battaglia di Lepanto (7 ottobre 1571), all'imbocco del golfo di Corinto, fu la più grande battaglia navale del Cinquecento: la flotta della Lega Santa (Spagna, Venezia, papa e altri) guidata da don Giovanni d'Austria distrusse quella ottomana. Si combatté ancora all'antica, con galee che speronavano e abbordavano, e furono decisivi i soldati imbarcati, tra cui i tercios spagnoli. Fu un enorme successo simbolico, ma con pochi effetti politici: Venezia nel 1573 cedette comunque Cipro agli Ottomani."},{"id":"k37","ch":"cap-9","t":"Che cos'è l'Umanesimo","x":"L'Umanesimo è il movimento culturale nato in Italia tra Trecento e Quattrocento che voleva rinnovare educazione e sapere tornando ai classici greci e latini. Gli studia humanitatis (grammatica, retorica, poesia, storia, filosofia morale) dovevano formare l'uomo completo, contro una cultura scolastica giudicata astratta. Petrarca (1304-1374) ne fu il precursore: cercava manoscritti antichi e parlò di media aetas, l'età di mezzo tra l'antichità e la sua rinascita, da cui il termine Medioevo. Dietro c'è una nuova società urbana, ricca e laica, che vuole una cultura utile alla vita civile e non più monopolio del clero."},{"id":"k38","ch":"cap-9","t":"Umanesimo civile e mecenatismo","x":"A Firenze, tra fine Trecento e primo Quattrocento, i cancellieri della repubblica (Salutati, Bruni, Bracciolini) usano la cultura classica per difendere la libertà repubblicana contro i Visconti di Milano: è l'Umanesimo civile, che fa del sapere un servizio alla città. Con il passaggio dai Comuni alle signorie cambia il ruolo dell'intellettuale: diventa cortigiano, celebra il principe ed è mantenuto dai mecenati (Gonzaga a Mantova, Este a Ferrara, Montefeltro a Urbino, poi i papi a Roma). L'ideale passa dall'uomo universale di Leon Battista Alberti, che unisce arte, scienza e impegno civile, al cortigiano raffinato e prudente descritto da Castiglione nel Cortegiano (1528)."},{"id":"k39","ch":"cap-9","t":"Greco, Platone e stampa","x":"Gli umanisti cercano nei monasteri i testi perduti (Poggio Bracciolini trova il De rerum natura di Lucrezio a San Gallo) e riscoprono il greco, quasi dimenticato in Occidente: nel 1397 Firenze affida la prima cattedra al bizantino Manuele Crisolora, e i dotti greci in fuga dai Turchi portano manoscritti (Aurispa ne riporta 238 nel 1423). Marsilio Ficino traduce Platone e fonda l'Accademia platonica a Careggi, nella villa donata da Cosimo de' Medici. La stampa a caratteri mobili di Gutenberg (Magonza, Bibbia a 42 linee del 1454-55) moltiplica i testi: entro il 1500 si stampano 10-20 milioni di copie (gli incunaboli), e il sapere diventa più accessibile e uniforme."},{"id":"k40","ch":"cap-9","t":"Filologia e Donazione di Costantino","x":"La vera novità dell'Umanesimo non fu leggere gli antichi (il Medioevo conosceva Aristotele), ma il metodo: la filologia, cioè la critica storica dei testi per ricostruirne la forma originale e capirli nel loro tempo. L'esempio più clamoroso è Lorenzo Valla, che nel 1440 dimostrò che la Donazione di Costantino era falsa: il documento con cui l'imperatore avrebbe dato a papa Silvestro I il potere su Roma e l'Occidente usava un latino e istituzioni che nel IV secolo non esistevano, quindi era stato scritto dalla curia tra VIII e IX secolo. Così si colpiva la base giuridica del potere temporale dei papi. Sul rapporto col Medioevo gli storici discutono: Burckhardt (1860) vedeva una rottura netta, Le Goff un «lungo Medioevo» fino al Settecento."},{"id":"k41","ch":"cap-9","t":"La prospettiva e l'arte rinascimentale","x":"L'arte medievale rappresentava i soggetti secondo la loro importanza religiosa; quella rinascimentale vuole riprodurre il mondo come lo vede l'occhio. Lo strumento è la prospettiva lineare, sperimentata da Brunelleschi e spiegata da Alberti nel De pictura (1436): le linee parallele convergono in un punto di fuga e il quadro è come una finestra che taglia la «piramide visiva», con regole geometriche. Nasce il ritratto come genere autonomo, segno della nuova attenzione all'individuo. Anche l'architettura e l'urbanistica si fanno razionali: Alberti nel De re aedificatoria (1452), Filarete con la città ideale di Sforzinda, a pianta stellare, dedicata a Francesco Sforza. Vasari (1550) racconterà questa storia da Giotto a Michelangelo."},{"id":"k42","ch":"cap-9","t":"Dignità dell'uomo e Utopia","x":"L'Umanesimo rovescia il contemptus mundi medievale: l'uomo ha dignità, ragione e libertà. Pico della Mirandola, nell'orazione De dignitate hominis (1486), immagina che Dio abbia dato a ogni creatura un posto fisso tranne all'uomo, lasciato libero di farsi da sé: può abbassarsi al livello dei bruti o elevarsi a quello degli angeli. Da questa fiducia nella ragione nasce anche l'immaginazione di società perfette: Thomas More in Utopia (1516) descrive un'isola senza proprietà privata né denaro, con sei ore di lavoro e tolleranza religiosa, che è in realtà una critica dell'Inghilterra del suo tempo (le recinzioni che cacciavano i contadini). I nomi ironici (Utopia = non-luogo, Amauroto, Anidro, Itlodeo) dichiarano che è un modello ideale."},{"id":"k43","ch":"cap-9","t":"Ermetismo, astronomia e verità effettuale","x":"Il Rinascimento non è solo razionale: Ficino traduce il Corpus hermeticum (1463), attribuito al mitico Ermete Trismegisto, e si diffondono magia, astrologia e alchimia, che resteranno intrecciate alla scienza fino a Newton (1687). Ma nasce anche un nuovo sguardo sulla natura: Cusano (1440) immagina un universo infinito; Copernico (1543) mette il Sole al centro, contro il modello di Aristotele e Tolomeo che separava un cielo perfetto da una Terra imperfetta. Il filo comune è il rifiuto del principio d'autorità: Leonardo vuole conoscere per esperienza («la sapienza è figliola della sperienza»), Machiavelli guarda alla «verità effettuale» della politica, a come gli uomini agiscono davvero e non a come dovrebbero."},{"id":"k44","ch":"cap-9","t":"Erasmo e l'Elogio della follia","x":"Erasmo da Rotterdam (circa 1466-1536) è il principe degli umanisti europei e propone un «Umanesimo cristiano»: unire i classici al ritorno al Vangelo delle origini. Applica la filologia alla Bibbia: nel 1516 pubblica il Novum instrumentum, il testo greco del Nuovo Testamento con una nuova traduzione latina, base della critica biblica moderna (e strumento che userà anche Lutero). Nell'Elogio della follia (1511), dedicato all'amico Thomas More, è la Follia a parlare: deride principi guerrafondai, teologi cavillosi e papi mondani. Nei Colloquia (1522) critica la religiosità esteriore (reliquie, pellegrinaggi). Il suo è un cristianesimo etico e interiore, che lo renderà vicino ma alla fine contrario a Lutero."},{"id":"k45","ch":"cap-10","t":"Perché gli europei esplorano","x":"Le esplorazioni nascono dall'incontro di interessi, conoscenze e mentalità. Le spezie asiatiche valevano moltissimo, ma passavano per intermediari musulmani e veneziani; la conquista ottomana di Costantinopoli (1453) rese i traffici più difficili. Bisognava trovare una via diretta per le Indie. Le conoscenze c'erano: la Geografia di Tolomeo, tradotta in latino nel 1410, confermava ai dotti la sfericità della Terra; caravelle, bussola e astrolabio permettevano di lasciare le coste. Si aggiungevano lo spirito di crociata contro l'Islam e la ricerca di oro."},{"id":"k46","ch":"cap-10","t":"L'espansione portoghese in Africa","x":"Il Portogallo, piccolo e con poche terre fertili, sotto la dinastia di Aviz (dal 1385) puntò sul mare. Dopo la presa di Ceuta (1415) i portoghesi scesero lungo la costa africana: Madera, Azzorre, capo Bojador (1434), Senegal, Guinea, e nel 1471 la Costa d'oro (Ghana). Enrico il Navigatore organizzò a Sagres un centro di studi nautici. L'obiettivo iniziale non era l'India ma l'oro, l'avorio e gli schiavi che arrivavano con le carovane del Sahara: i portoghesi fondarono basi fortificate sulla costa per prenderli direttamente. I papi (bolle del 1451, 1455, 1456) legittimarono queste conquiste in nome della diffusione della fede. È l'inizio della tratta atlantica degli schiavi."},{"id":"k47","ch":"cap-10","t":"Bartolomeu Dias e il capo di Buona Speranza","x":"Con Giovanni II (1481-1495) l'obiettivo diventa raggiungere le Indie girando attorno all'Africa. Nel 1487-88 Bartolomeu Dias, spinto da una tempesta, doppiò la punta meridionale del continente, che il re chiamò capo di Buona Speranza proprio perché apriva la speranza della via per l'Oriente. Si dimostrò che Atlantico e Oceano Indiano erano collegati. Intanto Giovanni II mandava agenti in Oriente a raccogliere informazioni e si cercava il leggendario regno cristiano del prete Gianni (probabilmente l'Etiopia), possibile alleato contro l'Islam. Per questo il re rifiutò il progetto di Colombo: la rotta africana gli sembrava più sicura."},{"id":"k48","ch":"cap-10","t":"Il progetto di Colombo","x":"Il genovese Cristoforo Colombo propose di arrivare in Asia andando verso ovest: un'idea non assurda (la Terra era notoriamente sferica, e Toscanelli l'aveva sostenuta nel 1474), ma basata su calcoli sbagliati, perché Colombo rimpiccioliva la Terra e stimava solo 60° tra Canarie e Giappone (Cipango). Rifiutato dal Portogallo, ottenne l'appoggio dei Re cattolici appena conquistata Granada: le capitolazioni di Santa Fe (17 aprile 1492) gli davano i titoli di ammiraglio, viceré e governatore e parte dei profitti. Partito da Palos il 3 agosto 1492 con Niña, Pinta e Santa Maria, il 12 ottobre sbarcò a San Salvador nelle Bahamas, poi a Cuba e Hispaniola. In altri tre viaggi raggiunse il continente (foce dell'Orinoco, America centrale), ma morì nel 1506 convinto di essere in Asia: per questo gli abitanti furono chiamati «indios»."},{"id":"k49","ch":"cap-10","t":"Inter caetera e trattato di Tordesillas","x":"Il viaggio di Colombo aprì una contesa tra Spagna e Portogallo. Nel 1493 il papa spagnolo Alessandro VI con la bolla Inter caetera tracciò una linea (raya) da polo a polo 100 leghe a ovest delle isole di Capo Verde: a ovest le terre spettavano alla Spagna. Il Portogallo protestò, temendo per le sue rotte atlantiche, e trattò direttamente con la Spagna: il trattato di Tordesillas (1494) spostò la linea 270 leghe più a ovest (370 leghe da Capo Verde). Cosa stabiliva: una divisione del mondo extraeuropeo in due zone di esplorazione e conquista. Conseguenze: la punta orientale del Sud America cadeva nella zona portoghese, e così il Brasile, toccato da Cabral nel 1500, divenne portoghese (ancora oggi vi si parla portoghese). Francia e Inghilterra, escluse, non riconobbero mai la spartizione."},{"id":"k50","ch":"cap-10","t":"Caboto, Verrazzano e il Nord America","x":"Le potenze escluse da Tordesillas cercarono vie proprie verso l'Asia più a nord. Il veneziano Giovanni Caboto, per Enrico VII d'Inghilterra, toccò nel 1497 Terranova e rivendicò quelle terre alla corona inglese, base delle future pretese inglesi sul Nord America. Il fiorentino Giovanni da Verrazzano, per Francesco I di Francia, esplorò nel 1524 la costa atlantica dalla Carolina a Terranova (passando dalla baia dove sorgerà New York). Sono le premesse della colonizzazione inglese e francese del Seicento."},{"id":"k51","ch":"cap-10","t":"Vasco da Gama e la via delle Indie","x":"Dieci anni dopo Dias, Vasco da Gama (partito nel luglio 1497 con quattro navi) doppiò il capo di Buona Speranza, risalì la costa orientale africana e a Malindi trovò un pilota arabo che lo guidò attraverso l'Oceano Indiano: nel maggio 1498 arrivò a Calicut, in India. Tornò nel 1499 con solo due navi, ma il carico di spezie ripagò la spedizione molte volte. Nel 1500 Pedro Álvares Cabral, deviando a ovest per sfruttare i venti, toccò il Brasile («Terra della vera croce») e proseguì per l'India, dove si scontrò con Calicut e si alleò con la rivale Cochin. La rotta del Capo spezzava il monopolio veneziano-arabo delle spezie."},{"id":"k52","ch":"cap-10","t":"Diu e Albuquerque: l'impero portoghese in Asia","x":"Il re Manuele I volle trasformare la nuova rotta in un dominio militare dell'Oceano Indiano. La battaglia navale di Diu (2 febbraio 1509) distrusse la flotta di Gujarat, mamelucchi d'Egitto e Calicut, appoggiata da Ottomani e Venezia, che temevano la concorrenza: da allora i cannoni portoghesi dominarono il mare. Il governatore Alfonso de Albuquerque conquistò i punti chiave: Goa (1510), capitale dell'impero; Malacca (1511), porta verso la Cina e le isole delle spezie; Hormuz (1515), all'ingresso del golfo Persico. Seguirono Ceylon, Molucche, i rapporti col Giappone (1543) e Macao (1557). Fu un impero di basi e rotte, non di territori: i portoghesi in India non superarono mai circa 15.000 persone, e non riuscendo a prendere Aden non chiusero mai il mar Rosso, per cui il commercio veneziano sopravvisse."},{"id":"k53","ch":"cap-10","t":"Vespucci: un Nuovo Mondo","x":"Colombo credeva di essere in Asia; il fiorentino Amerigo Vespucci, dopo due viaggi lungo le coste del Sud America (1499-1500 per la Spagna, 1501-1502 per il Portogallo), capì che si trattava di un continente nuovo, sconosciuto agli antichi. La lettera Mundus novus (1503), a lui attribuita, diffuse questa idea in tutta Europa. Nel 1507 il cartografo tedesco Martin Waldseemüller, nella sua carta del mondo, chiamò il nuovo continente «America» dal nome di Amerigo. Il nome si impose e con esso la consapevolezza che il mondo era diverso da come lo descrivevano i classici."},{"id":"k54","ch":"cap-10","t":"Balboa e Magellano: la prima circumnavigazione","x":"Nel 1513 Vasco Núñez de Balboa attraversò l'istmo di Panama e vide un nuovo oceano, il Mare del Sud: l'America era una barriera tra l'Europa e l'Asia, e per passare serviva uno stretto. Il portoghese Ferdinando Magellano lo cercò al servizio di Carlo V, che voleva raggiungere le Molucche, ricche di spezie, senza violare la zona portoghese. Partito da Siviglia nel settembre 1519 con cinque navi, trovò lo stretto che porta il suo nome (ottobre 1520), attraversò il Pacifico tra fame e scorbuto e morì nelle Filippine (1521). Solo la Victoria, guidata da Elcano, tornò in Spagna nel settembre 1522 con meno di venti uomini: fu la prova concreta che la Terra si può circumnavigare (il cronista Pigafetta notò anche la perdita di un giorno di calendario). Le Molucche però restarono al Portogallo, a cui Carlo V le cedette nel 1529 (trattato di Saragozza)."},{"id":"k55","ch":"cap-10","t":"Cortés e la caduta degli Aztechi","x":"Nel 1519 Hernán Cortés, un hidalgo partito da Cuba con circa 500 uomini, 16 cavalli e pochi cannoni, sbarcò in Messico, fondò Veracruz e affondò le navi per impedire ritirate. L'impero azteco era potente ma odiato dai popoli sottomessi, che diventarono alleati degli spagnoli (soprattutto Tlaxcala). Accolto a Tenochtitlán, città costruita su un lago, Cortés catturò con l'inganno l'imperatore Moctezuma II, forse incerto perché legava gli stranieri alla profezia del ritorno del dio Quetzalcoatl. La rivolta guidata da Cuitláhuac cacciò gli spagnoli nella «noche triste» (30 giugno 1520), ma Cortés tornò con migliaia di alleati indigeni e imbarcazioni per il lago, mentre il vaiolo decimava gli assediati: il 13 agosto 1521 Tenochtitlán cadde e sulle sue rovine nacque Città del Messico."},{"id":"k56","ch":"cap-10","t":"Pizarro e la fine degli Inca","x":"L'impero inca, esteso lungo le Ande, era appena uscito da una guerra civile tra i fratellastri Atahualpa e Huáscar quando arrivò Francisco Pizarro con circa 180 uomini (1531). A Cajamarca, il 15 novembre 1532, Pizarro catturò Atahualpa con un'imboscata: l'imperatore era considerato figlio del Sole, e la sua cattura paralizzò l'esercito. Atahualpa pagò un enorme riscatto in oro, ma fu ucciso nel 1533; poco dopo cadde Cuzco. Nel 1535 Pizarro fondò Lima, futura capitale del vicereame del Perù (1542). I conquistadores si divisero tra loro (Almagro fu giustiziato nel 1538, Pizarro ucciso nel 1541) e la resistenza inca continuò sulle Ande fino all'esecuzione di Túpac Amaru nel 1572."},{"id":"k57","ch":"cap-10","t":"Perché crollarono gli imperi americani","x":"Come poche centinaia di spagnoli conquistarono imperi di milioni di abitanti? Nessuna causa basta da sola. Contarono armi d'acciaio, cavalli e armi da fuoco, sconosciuti agli indigeni; le divisioni interne (popoli sottomessi agli Aztechi, guerra civile inca); soprattutto le epidemie europee come il vaiolo, contro cui gli americani non avevano difese, che uccisero più delle armi. Ebbero un ruolo anche fattori culturali: la sacralità dell'imperatore, la cui cattura disorientava, e visioni del mondo diverse dalla guerra europea. Dove queste condizioni mancavano, come tra gli Araucani del Cile meridionale, la resistenza durò secoli."},{"id":"k58","ch":"cap-10","t":"Il Regno delle Indie e le sue istituzioni","x":"La Spagna non considerava l'America una colonia ma un regno della corona di Castiglia, il Regno delle Indie, governato come gli altri regni. Le istituzioni: la Casa de Contratación di Siviglia (1503) controllava navi, merci e passeggeri (solo da Siviglia si poteva partire, e non potevano andarci stranieri, ebrei o sospetti eretici); il Consiglio delle Indie (1524) affiancava il re nel governo; due vicereami, la Nuova Spagna (1529, capitale Città del Messico) e il Perù (1542, capitale Lima), erano retti da viceré; la giustizia spettava alle audiencias, tribunali con giudici spagnoli. Le città, a pianta regolare attorno alla piazza con cattedrale e palazzo del governatore, erano i centri del potere."},{"id":"k59","ch":"cap-10","t":"L'encomienda","x":"L'encomienda deriva dalle pratiche della Reconquista spagnola. In America la corona, proprietaria delle terre e degli indios, «affidava» un gruppo di indigeni a un conquistador o colono (encomendero), che poteva esigere lavoro e tributi; in cambio doveva proteggerli, convertirli al cattolicesimo e servire il re in armi. In teoria non era un feudo né ereditario, perché la corona temeva la nascita di una nobiltà indipendente; nella pratica divenne uno strumento di sfruttamento brutale. Le Nuove leggi di Carlo V (1542) cercarono di abolirla, ma la rivolta dei coloni in Perù ne impedì l'applicazione."},{"id":"k60","ch":"cap-10","t":"Società coloniale: creoli, meticci, mulatti","x":"Nel Cinquecento emigrarono in America circa 250.000 spagnoli, in gran parte uomini: le unioni con donne indigene (spesso violente o occasionali, ma dal 1514 anche matrimoni misti autorizzati) crearono una società mescolata e gerarchica. Al vertice gli spagnoli nati in Europa, poi i creoli (spagnoli nati in America, che due secoli dopo guideranno le indipendenze), i meticci (europei e indigeni), i mulatti (europei e africani), gli zambos (africani e indigeni), gli indios e gli schiavi africani, importati per sostituire una popolazione indigena in crollo."},{"id":"k61","ch":"cap-10","t":"Argento, Potosí e mita","x":"Dopo l'oro dei primi anni, la vera ricchezza americana fu l'argento. Nel 1545 fu scoperta la montagna d'argento di Potosí (nell'Alto Perù, oggi Bolivia), che in pochi anni divenne una città di oltre 100.000 abitanti; dal 1555 l'uso del mercurio per separare l'argento moltiplicò la produzione. Il lavoro era fornito dalla mita, un antico turno di lavoro obbligatorio inca riadattato dagli spagnoli, che mandava gli indios in miniera in condizioni terribili. L'argento attraversava l'oceano in convogli scortati dai galeoni fino a Siviglia, finanziando le guerre degli Asburgo, alimentando l'inflazione europea e finendo in parte in Asia."},{"id":"k62","ch":"cap-10","t":"La catastrofe demografica","x":"La conquista provocò uno dei più grandi crolli demografici della storia. Le stime sono incerte (Denevan: circa 25 milioni in Messico e Caraibi e 18 nelle Ande nel 1500), ma secondo Livi Bacci la popolazione del continente passò da circa 42 milioni nel 1500 a 13 nel 1600. Le cause principali furono le malattie europee (vaiolo, morbillo, tifo, influenza), a cui si aggiunsero lavoro forzato, violenze e la distruzione dei sistemi agricoli tradizionali. Lo scambio fu in parte reciproco: la sifilide, comparsa in Europa nel 1495 tra i soldati di Carlo VIII a Napoli, potrebbe essere di origine americana."},{"id":"k63","ch":"cap-10","t":"Prodotti dal Nuovo Mondo","x":"Lo scambio tra i due mondi (detto anche «scambio colombiano») cambiò l'alimentazione di entrambi. Dall'America arrivarono mais, patate, pomodori, peperoni, zucche, girasole, ananas, cacao e tabacco: mais e patate, molto produttivi, diventeranno nei secoli successivi il cibo base dei contadini europei. In America gli europei portarono cavalli, buoi, pecore, frumento, vite e olivo, e svilupparono le piantagioni di canna da zucchero nei Caraibi, lavorate dagli schiavi africani."},{"id":"k64","ch":"cap-10","t":"Evangelizzazione e patronato","x":"Le conquiste iberiche erano giustificate come diffusione della fede, con lo spirito della Reconquista. In cambio di questo impegno il papa concesse ai re il controllo delle Chiese coloniali: il padroado real portoghese (missioni in Asia, Africa e Brasile) e il patronato universale spagnolo, con cui il re nominava i vescovi delle 22 diocesi americane e incassava le decime. La conversione fu spesso forzata, con battesimi di massa; molti indios continuarono i culti tradizionali di nascosto e l'Inquisizione fu estesa all'America per controllarli (nel 1539 un indigeno battezzato, Carlos, fu mandato al rogo)."},{"id":"k65","ch":"cap-10","t":"Las Casas, le Nuove leggi e Valladolid","x":"Le violenze dei conquistadores suscitarono in Spagna un dibattito senza precedenti. Il domenicano Bartolomé de Las Casas, ex encomendero, denunciò le atrocità nella Brevissima relazione della distruzione delle Indie (1542). Nel 1536 Paolo III aveva affermato che gli indios erano uomini a pieno titolo; nel 1542 Carlo V emanò le Nuove leggi, che li riconoscevano sudditi liberi e dovevano abolire l'encomienda. Nella disputa di Valladolid (1550-1551) Las Casas si scontrò con Juan Ginés de Sepúlveda, che con Aristotele sosteneva la schiavitù naturale dei popoli «barbari» e la guerra giusta per sottometterli. Francesco de Vitoria, teologo di Salamanca, pose le basi del diritto delle genti: la conversione con la persuasione, la guerra solo per respingere un'offesa."},{"id":"k66","ch":"cap-10","t":"Montaigne e il «buon selvaggio»","x":"L'incontro con l'America costrinse gli europei a ripensare se stessi. Montaigne, negli Essais (1580), osservò che chiamiamo «barbaro» ciò che non è nostro costume e che i cannibali americani non erano più crudeli degli europei delle guerre di religione: un'anticipazione del relativismo culturale. Nacque il mito del «buon selvaggio», l'uomo naturale e innocente opposto alla corruzione civile, che tornerà con Rousseau. Solo nel Novecento storici come Nathan Wachtel hanno provato a raccontare la conquista dal punto di vista dei vinti, usando fonti indigene, archeologia ed etnografia."},{"id":"k67","ch":"riforma","t":"Scisma d'Occidente e conciliarismo","x":"Dopo il periodo avignonese, nel 1378 due conclavi elessero due papi rivali, uno a Roma e uno ad Avignone, e l'Europa si divise secondo le alleanze politiche; a un certo punto i papi furono tre. Lo Scisma d'Occidente si chiuse solo con il Concilio di Costanza (1414-1417), che depose i contendenti ed elesse Martino V. Da questa crisi nacque il conciliarismo: se un concilio aveva salvato la Chiesa, allora il concilio, che rappresenta tutti i fedeli, doveva essere superiore al papa. Nel Quattrocento i papi lo sconfissero e accentrarono il potere nella Curia, ma la paura di un concilio «sopra il papa» spiega perché nel Cinquecento esitarono tanto a convocare quello di Trento."},{"id":"k68","ch":"riforma","t":"Abusi della Chiesa e precursori: Wyclif e Hus","x":"Alla vigilia della Riforma le critiche erano molte: vescovi e abati che accumulavano benefici (cariche con rendita) senza risiedere, preti ignoranti, Curia che chiedeva denaro per ogni atto, come le annate (il reddito del primo anno di un beneficio). In Germania, senza un re forte che trattasse con Roma, questo pesava di più: nel 1511 Massimiliano raccolse le proteste nei Gravamina. C'erano anche precursori: l'inglese John Wyclif (1330-1384) contestò ricchezza e autorità del clero e ispirò i lollardi; il boemo Jan Hus predicò il primato della Scrittura e Cristo come unico capo della Chiesa, e fu bruciato a Costanza nel 1415 nonostante il salvacondotto. I suoi seguaci (hussiti) chiedevano la comunione con pane e vino per tutti (sub utraque specie)."},{"id":"k69","ch":"riforma","t":"Lutero e la giustificazione per fede","x":"Martin Lutero (1483-1546), figlio di un imprenditore minerario, entrò tra gli agostiniani dopo aver fatto un voto durante un temporale (1505). Viveva nell'angoscia di non poter mai essere abbastanza giusto davanti a Dio. Studiando la Lettera ai Romani a Wittenberg trovò la risposta: l'uomo è salvato per sola fede, non per le opere. Il peccato originale ha corrotto la natura umana, quindi nessuna penitenza, preghiera o opera buona può «guadagnare» la salvezza: è un dono gratuito di Dio, che rende giusto il peccatore che si affida a Cristo. Questa dottrina toglieva valore a tutto il sistema di meriti, sacramenti e intermediari su cui si fondava la Chiesa."},{"id":"k70","ch":"riforma","t":"Le indulgenze e le 95 tesi","x":"Un'indulgenza era la remissione della pena temporale per i peccati già perdonati, anche per le anime del purgatorio, concessa dalla Chiesa attingendo ai meriti di Cristo e dei santi. Nella pratica era diventata una vendita: Alberto di Hohenzollern, per avere anche l'arcivescovado di Magonza, si indebitò con i banchieri Fugger; il papa autorizzò una predicazione di indulgenze in Germania i cui proventi andavano metà ad Alberto e metà alla nuova basilica di San Pietro. Il predicatore Tetzel prometteva che «quando la moneta tintinna nella cassetta, l'anima salta fuori dal purgatorio». Il 31 ottobre 1517 Lutero rese pubbliche 95 tesi in latino per una disputa accademica: la vera penitenza riguarda tutta la vita, e nessun tesoro di meriti è in vendita. Tradotte in tedesco e stampate, si diffusero in poche settimane."},{"id":"k71","ch":"riforma","t":"1520-1521: la rottura con Roma e Worms","x":"Nel 1520 Lutero pubblica i tre scritti programmatici: «Alla nobiltà cristiana della nazione tedesca» chiede ai principi di riformare la Chiesa; «La cattività babilonese della Chiesa» riduce i sacramenti a battesimo ed eucaristia (con presenza reale ma senza transustanziazione); «La libertà del cristiano» spiega la libertà interiore data dalla fede. Unisce sola fide e sola scriptura (la Bibbia unica autorità) e il sacerdozio universale: ogni battezzato è sacerdote, quindi niente separazione clero-laici, niente celibato obbligatorio, niente monachesimo. Leone X lo minaccia di scomunica con la bolla Exsurge Domine; Lutero la brucia. Alla Dieta di Worms (aprile 1521), davanti a Carlo V, rifiuta di ritrattare: «la mia coscienza è prigioniera della Parola di Dio». Bandito dall'Impero, è nascosto da Federico il Saggio nel castello della Wartburg, dove traduce in tedesco il Nuovo Testamento, opera fondamentale anche per la lingua tedesca."},{"id":"k72","ch":"riforma","t":"La guerra dei contadini e Müntzer","x":"Le idee di Lutero furono lette anche in chiave sociale. Prima i cavalieri imperiali (Sickingen attaccò Treviri nel 1522, fallendo), poi nel 1524-1525 i contadini della Germania meridionale (dalla Svevia all'Alsazia, Tirolo, Stiria) si sollevarono: i Dodici articoli chiedevano la libera scelta dei pastori, meno decime, la restituzione di boschi, pascoli e diritti di caccia e pesca, la fine della servitù, «perché Cristo ha redento tutti». Thomas Müntzer guidò l'ala rivoluzionaria, sognando una comunità di uguali da realizzare con le armi. I principi schiacciarono i ribelli a Frankenhausen (1525) e Müntzer fu decapitato. Lutero si schierò contro i contadini: la libertà cristiana è interiore e l'autorità politica viene da Dio. Da allora la Chiesa luterana divenne una Chiesa di Stato sotto i principi."},{"id":"k73","ch":"riforma","t":"Erasmo contro Lutero: il libero arbitrio","x":"La polemica del 1524-1525 segna la rottura tra Umanesimo e Riforma. Erasmo, nel De libero arbitrio, sostiene che il peccato ha ferito ma non distrutto la libertà umana: l'uomo può collaborare con la grazia, e non bisogna diffondere tra i semplici dottrine che spingono alla passività. Lutero risponde con il De servo arbitrio: la volontà umana è schiava, la salvezza dipende solo da Dio, e la verità del Vangelo va proclamata anche a costo di conflitti. Erasmo, che voleva pace e unità, finì sospettato da entrambe le parti."},{"id":"k74","ch":"riforma","t":"Zwingli e la Riforma di Zurigo","x":"Ulrich Zwingli, cappellano della cattedrale di Zurigo, dal 1519 introdusse la Riforma con l'appoggio del consiglio cittadino, che prese il posto del vescovo nel governo della Chiesa: la Riforma svizzera è una Riforma delle città. Più radicale di Lutero, eliminò immagini e musica dalle chiese e intese l'eucaristia come semplice commemorazione («questo rappresenta il mio corpo»). Proprio su questo fallì il Colloquio di Marburgo (1529) voluto per unire luterani e svizzeri. La Riforma passò a Berna e Basilea, ma i cantoni originari (Uri, Svitto, Untervaldo) restarono cattolici, anche perché vivevano del mercenariato che Zwingli condannava. Nella battaglia di Kappel (1531) i cattolici vinsero e Zwingli morì; il successore Bullinger si accordò poi con Calvino (1549)."},{"id":"k75","ch":"riforma","t":"Calvino a Ginevra","x":"Giovanni Calvino (1509-1564), francese di formazione giuridica e umanistica, fuggì dalla Francia di Francesco I nel 1534 e nel 1536 pubblicò a Basilea l'Institutio religionis christianae, la più sistematica esposizione della teologia riformata. Chiamato a Ginevra da Farel (la città si era appena liberata dal vescovo e dai Savoia), ne fu espulso nel 1538 e richiamato nel 1541. Le Ordonnances ecclésiastiques organizzarono la Chiesa in pastori, dottori, diaconi e anziani laici; pastori e anziani formavano il Concistoro, che sorvegliava la vita morale dei cittadini (gioco, lusso, danze, bestemmie). Ginevra divenne una «Roma protestante» che formava pastori per tutta Europa; non era una teocrazia, perché il governo restava al Piccolo Consiglio, ma una comunità regolata dalla Bibbia."},{"id":"k76","ch":"riforma","t":"Predestinazione e vocazione","x":"Al centro del pensiero di Calvino c'è l'onnipotenza di Dio. Ne deriva la doppia predestinazione: Dio ha deciso dall'eternità chi sarà salvato e chi dannato, e l'uomo non può cambiarlo. Invece di paralizzare, la dottrina spinse all'azione: una vita disciplinata e il successo nel proprio lavoro potevano essere segni (non cause) dell'elezione. Ogni lavoro è una vocazione (Beruf) con cui si glorifica Dio. Calvino ammise anche il prestito a interesse per fini produttivi. Il sociologo Max Weber (L'etica protestante e lo spirito del capitalismo) vide in questa etica di lavoro, risparmio e reinvestimento una delle radici del capitalismo; la tesi è molto discussa ma resta un classico."},{"id":"k77","ch":"riforma","t":"Il caso Serveto","x":"Miguel Serveto, medico spagnolo, negava la Trinità. Nel 1553, di passaggio a Ginevra, fu riconosciuto, processato dalle autorità cittadine con l'appoggio di Calvino e bruciato sul rogo. Il caso scandalizzò molti riformatori, soprattutto gli esuli italiani e umanisti come Sebastiano Castellione, e dimostrò che anche le Chiese protestanti potevano essere intolleranti quanto Roma. Da questo dibattito nascono le prime riflessioni moderne sulla tolleranza religiosa."},{"id":"k78","ch":"riforma","t":"Spira, Augusta, Smalcalda: la Riforma diventa politica","x":"Il luteranesimo si diffuse dove i principi lo adottarono, anche per incamerare i beni della Chiesa: Alberto di Hohenzollern trasformò lo Stato dell'Ordine teutonico nel Ducato di Prussia (1525). Alla Dieta di Spira del 1529 Carlo V volle riattivare il bando di Worms: sei principi e quattordici città presentarono una «protestatio», da cui il nome di protestanti. Alla Dieta di Augusta del 1530 Melantone, il collaboratore di Lutero, presentò una confessione di fede moderata (Confessio Augustana), ancora oggi testo base dei luterani, ma l'accordo fallì. Nel 1531 i principi protestanti formarono la Lega di Smalcalda, guidata da Sassonia e Assia: la divisione religiosa era ormai uno schieramento politico-militare."},{"id":"k79","ch":"riforma","t":"La Riforma in Scandinavia","x":"In Scandinavia la Riforma si intrecciò con la nascita degli Stati. L'Unione di Kalmar (1397) univa Danimarca, Norvegia e Svezia sotto egemonia danese. Dopo il «bagno di sangue» di Stoccolma (1520), in cui il re danese Cristiano II fece giustiziare decine di nobili svedesi, la Svezia si ribellò e con Gustavo Vasa divenne indipendente (1523): il nuovo re confiscò i beni della Chiesa e dal 1527 avviò una Chiesa nazionale luterana. In Danimarca Cristiano III impose il luteranesimo come religione di Stato nel 1536, anche in Norvegia (ridotta a provincia danese) e Islanda."},{"id":"k80","ch":"riforma","t":"Enrico VIII e la Chiesa anglicana","x":"In Inghilterra la rottura fu politica prima che religiosa. Enrico VIII voleva l'annullamento del matrimonio con Caterina d'Aragona, che non gli aveva dato un erede maschio, per sposare Anna Bolena; papa Clemente VII, condizionato da Carlo V (nipote di Caterina), rifiutò. Nel 1534 il Parlamento approvò l'Atto di supremazia: il re diventava capo supremo della Chiesa d'Inghilterra. Furono soppressi i monasteri e le loro terre vendute, e si diffuse la Bibbia in inglese, ma la dottrina restò in gran parte cattolica. Solo con Edoardo VI ed Elisabetta I la Chiesa anglicana divenne protestante; i puritani, ispirati al calvinismo, volevano «purificarla» ancora."},{"id":"k81","ch":"riforma","t":"Anabattisti e Münster","x":"La Riforma radicale (definizione dello storico G. H. Williams) comprende chi rifiutava sia Roma sia le Chiese luterana e riformata. Gli anabattisti («ribattezzatori») battezzavano solo adulti consapevoli: la Chiesa doveva essere una comunità volontaria di credenti, separata dallo Stato. Molti rifiutavano giuramenti, cariche e armi; cattolici e luterani si accordarono per perseguitarli (Spira 1529). Una minoranza millenarista, convinta
