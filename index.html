 della fine imminente, prese Münster nel 1534 con Giovanni di Leida: teocrazia, beni in comune, poligamia, finché la città fu riconquistata e i capi giustiziati. Dopo questo disastro Menno Simons riorganizzò il movimento in senso pacifista (mennoniti), ancora esistente."},{"id":"k82","ch":"riforma","t":"Nicodemismo, antitrinitari e tolleranza","x":"Molti dissidenti, soprattutto italiani, non si riconoscevano in nessuna Chiesa. Alcuni praticavano il nicodemismo (termine di Calvino, da Nicodemo che andava da Gesù di notte): restavano formalmente cattolici e credevano in segreto. Altri, sulla scia di Erasmo, distinguevano poche verità essenziali (fundamentalia) dalle questioni secondarie (adiaphora), su cui non era lecito perseguitare: così Jacopo Aconcio (1564). I più radicali negarono la Trinità: i senesi Lelio e Fausto Sozzini, quest'ultimo in Polonia (Cracovia, Raków), fondarono le comunità sociniane, da cui vennero idee di razionalismo, pacifismo e tolleranza che influenzarono Locke e l'Illuminismo."},{"id":"k83","ch":"cap-12","t":"L'Italia dell'equilibrio (1454-1494)","x":"Con la pace di Lodi (1454) i cinque Stati maggiori (Milano, Venezia, Firenze, Stato della Chiesa, Regno di Napoli) si garantirono a vicenda i confini. L'Italia era la regione più ricca e colta d'Europa ma divisa, mentre attorno crescevano monarchie unitarie come Francia e Spagna. Lorenzo il Magnifico fu l'«ago della bilancia» di questo sistema; alla sua morte, nel 1492, nello stesso anno dell'elezione di Alessandro VI Borgia, l'equilibrio si ruppe e le rivalità aprirono la porta agli stranieri."},{"id":"k84","ch":"cap-12","t":"Il Regno di Napoli aragonese","x":"Il Mezzogiorno era retto da un ramo illegittimo degli Aragona: Ferdinando I (Ferrante, 1458-1494). Il papa lo considerava un feudo della Chiesa, e i grandi baroni dominavano le province. Ferrante cercò di rafforzare il potere centrale e nel 1485 represse duramente la congiura dei baroni. Questa debolezza interna e le pretese francesi (gli Angiò avevano regnato a Napoli prima degli Aragona) spiegano perché Napoli fu il primo obiettivo delle invasioni."},{"id":"k85","ch":"cap-12","t":"Lo Stato della Chiesa e il nepotismo","x":"Lo Stato pontificio comprendeva Lazio, Umbria, Marche, Romagna ed enclavi come Benevento e Pontecorvo nel Regno di Napoli, Avignone e il Contado venassino in Francia. Il controllo era debole: le famiglie baronali romane (Orsini, Colonna), città autonome come Bologna e Perugia e i «vicari» signori locali di Romagna e Marche governavano di fatto. I papi del Rinascimento, sovrani temporali oltre che capi spirituali, praticavano il nepotismo: «piccolo» nominando cardinali i nipoti, «grande» tentando di creare veri Stati per i familiari, come fece Alessandro VI per il figlio Cesare Borgia."},{"id":"k86","ch":"cap-12","t":"Il Ducato di Milano","x":"Milano era nata dall'evoluzione del Comune in signoria dei Visconti, che ottennero il titolo di duchi dall'imperatore; estinti i Visconti (1447), il condottiero Francesco Sforza prese il potere (1450). Il ducato, con nove province (Milano, Pavia, Lodi, Cremona, Como, Novara, Tortona, Alessandria, Vigevano), era ricchissimo e controllava i passi alpini verso l'Europa centrale: per questo Francia e Asburgo se lo contesero per tutto il Cinquecento. A fine Quattrocento governava Ludovico il Moro come tutore del nipote Gian Galeazzo, ma mirava al titolo per sé."},{"id":"k87","ch":"cap-12","t":"La Repubblica di Venezia: istituzioni e domini","x":"Venezia era una repubblica aristocratica. Con la «serrata» del Maggior Consiglio (1297-fine XIII secolo) l'accesso al governo fu riservato alle famiglie patrizie già presenti: il Maggior Consiglio, circa 2.500 membri nel Cinquecento, eleggeva le magistrature; il Senato decideva la politica; il doge, eletto a vita, rappresentava lo Stato ma con poteri limitati da magistrature collegiali e temporanee. I cittadini originari (circa 10.000) formavano la burocrazia senza diritti politici. Il dominio comprendeva lo Stato da terra (Veneto, Friuli, Brescia, Bergamo, Crema), conquistato nel Quattrocento, e lo Stato da mar (Istria, Dalmazia, isole Ionie, Creta, Cipro): ricchezza e solidità che ne fecero il bersaglio della Lega di Cambrai."},{"id":"k88","ch":"cap-12","t":"Firenze dei Medici","x":"Firenze restava formalmente una repubblica, ma il potere era di un'oligarchia di mercanti e banchieri. Con l'acquisto di Pisa (1406) e Livorno (1421) ottenne lo sbocco al mare. Dal 1434 Cosimo il Vecchio, banchiere, governò senza cariche ufficiali, controllando le nomine alle magistrature; il nipote Lorenzo il Magnifico fu mecenate e diplomatico. Il potere mediceo però non era mai del tutto accettato: alla prima crisi (1494) i Medici furono cacciati."},{"id":"k89","ch":"cap-12","t":"Savoia, Mantova, Ferrara","x":"Accanto ai grandi Stati c'erano principati nati da signorie cittadine e legittimati da titoli imperiali o papali: gli Este a Ferrara, Modena e Reggio; i Gonzaga marchesi di Mantova (duchi nel 1530); i Savoia, duchi dal 1416, il cui Stato era ancora più francese che italiano (capitale Chambéry, con Savoia, Nizza, Aosta e Piemonte, ma non Saluzzo, Monferrato e Asti). Splendide corti, ma deboli militarmente: potevano solo schierarsi con le grandi potenze."},{"id":"k90","ch":"cap-12","t":"La discesa di Carlo VIII (1494-1495)","x":"Nel 1494 Carlo VIII di Francia scese in Italia per rivendicare il Regno di Napoli come erede degli Angiò (i cui diritti erano passati alla corona nel 1481), sognando poi una crociata. Per avere le spalle coperte cedette Cerdagne e Roussillon alla Spagna e Franca Contea e Artois a Massimiliano. Lo chiamò anche Ludovico il Moro, che voleva liberarsi degli Aragonesi, parenti del nipote. L'esercito francese, con la sua artiglieria moderna, attraversò la penisola quasi senza combattere ed entrò a Napoli il 22 febbraio 1495: fu lo shock che rivelò la fragilità degli Stati italiani e aprì sessant'anni di guerre."},{"id":"k91","ch":"cap-12","t":"Savonarola e la Repubblica fiorentina","x":"Piero de' Medici, figlio di Lorenzo, consegnò a Carlo VIII le fortezze fiorentine; i cittadini lo cacciarono e nacque la prima Repubblica (1494-1512). Il domenicano Girolamo Savonarola, priore di San Marco, che aveva profetizzato un castigo divino per la corruzione di Firenze e della Chiesa, ne fu l'ispiratore: si creò un Consiglio grande di circa 3.000 cittadini, sul modello veneziano, e si promosse una riforma morale (i «falò delle vanità»). La città si divise tra piagnoni (savonaroliani), arrabbiati (oligarchici) e bigi o palleschi (filomedicei). Scomunicato da Alessandro VI, che attaccava come simoniaco, Savonarola perse il sostegno e fu giustiziato nel 1498."},{"id":"k92","ch":"cap-12","t":"Lega antifrancese e Fornovo","x":"La facile conquista di Napoli allarmò tutti: nel 1495 Venezia, Milano (Ludovico il Moro aveva ormai ottenuto il ducato), il papa, Ferdinando di Spagna e l'imperatore formarono una lega. Carlo VIII dovette risalire la penisola e a Fornovo sul Taro (6 luglio 1495) si aprì la strada verso la Francia in una battaglia incerta. A Napoli il re aragonese Ferrandino tornò con l'aiuto delle truppe spagnole di Gonzalo de Córdoba, il «Gran Capitano», ma cedette a Venezia porti pugliesi. Nessun dominio francese, ma ormai Francia e Spagna avevano messo piede in Italia."},{"id":"k93","ch":"cap-12","t":"Luigi XII conquista Milano","x":"Luigi XII (1498-1515) rivendicava Milano perché discendeva da Valentina Visconti, che aveva sposato un Orléans nel 1387. Si comprò l'appoggio di Venezia (promettendole Cremona e la Ghiara d'Adda), degli Svizzeri e del papa (che ottenne per Cesare Borgia il ducato francese di Valentinois, da cui il soprannome «il Valentino»). Ludovico il Moro fuggì, tentò di riprendersi il ducato ma fu sconfitto e catturato a Novara (10 aprile 1500), e morì prigioniero in Francia. Milano restò francese fino al 1512."},{"id":"k94","ch":"cap-12","t":"Trattato di Granada e Napoli spagnola","x":"Col trattato segreto di Granada (11 novembre 1500) Luigi XII e Ferdinando il Cattolico, che già possedeva la Sicilia, si spartirono il Regno di Napoli. Cosa stabiliva: alla Francia Campania, Abruzzo e titolo regio; alla Spagna Calabria e Puglia. Il re aragonese Federico III, tradito dai parenti spagnoli, cedette senza combattere. Ma i due alleati litigarono sui confini e la guerra fu vinta dai tercios di Gonzalo de Córdoba (battaglia del Garigliano, 1503). L'armistizio di Lione (1504) diede tutto il Regno alla Spagna: da allora Napoli fu governata da viceré spagnoli per due secoli."},{"id":"k95","ch":"cap-12","t":"Cesare Borgia, il principe nuovo","x":"Cesare Borgia, figlio di Alessandro VI, lasciò la porpora per diventare gonfaloniere (capitano generale) della Chiesa e, con truppe francesi, conquistò Romagna e Marche eliminando con forza e inganno i signori locali. Il suo Stato serviva alla famiglia ma rafforzava anche il papato su territori fino ad allora solo nominalmente pontifici. Machiavelli, che lo incontrò come diplomatico, ne fece nel Principe il modello del «principe nuovo» che sa usare virtù e occasione. Ma tutto dipendeva dal padre: quando Alessandro VI morì (1503) e, dopo Pio III, fu eletto il nemico Giulio II, lo Stato di Cesare crollò. Morì nel 1507 combattendo in Navarra."},{"id":"k96","ch":"cap-12","t":"Lega di Cambrai e Agnadello","x":"Giulio II (1503-1513), il «papa guerriero», voleva riprendere il controllo dello Stato della Chiesa. Venezia, dopo la caduta del Borgia, si era presa Rimini e Faenza, oltre a porti pugliesi, Cremona e territori rivendicati dall'imperatore (Gorizia, Trieste, Fiume). Nel 1508 il papa riunì contro di lei Francia, Spagna, Impero e principi italiani nella Lega di Cambrai. Ad Agnadello (14 maggio 1509) i francesi distrussero l'esercito veneziano e la repubblica perse quasi tutta la terraferma. Venezia si salvò con la diplomazia, le divisioni tra i vincitori e la fedeltà dei contadini, e recuperò gran parte dei domini, ma da allora rinunciò a espandersi e adottò una politica di neutralità."},{"id":"k97","ch":"cap-12","t":"Lega Santa, Ravenna e la fine della prima Repubblica","x":"Ridimensionata Venezia, Giulio II si rivolse contro la Francia. Luigi XII rispose convocando a Pisa un concilio per deporre il papa; Giulio II convocò il V Concilio Lateranense e formò la Lega Santa (1511) con Venezia, Svizzeri, Spagna e Inghilterra, al grido di «Fuori i barbari!» (anche se gli spagnoli erano stranieri quanto i francesi). A Ravenna (11 aprile 1512) i francesi vinsero ma persero il comandante Gaston de Foix e poi, all'arrivo degli Svizzeri, dovettero lasciare Milano, affidata a Massimiliano Sforza. Ferdinando ne approfittò per prendere la Navarra. Firenze, alleata dei francesi, pagò: gli spagnoli saccheggiarono Prato e riportarono i Medici. Nel 1513 un Medici, Leone X, divenne papa."},{"id":"k98","ch":"cap-12","t":"Machiavelli e Il Principe","x":"Niccolò Machiavelli era stato segretario della Repubblica fiorentina e diplomatico. Al ritorno dei Medici (1512) perse tutto, fu imprigionato e torturato con l'accusa di congiura, poi si ritirò in campagna. Lì nel 1513 interruppe i Discorsi sulla prima Deca di Tito Livio, riflessione sulle repubbliche, per scrivere il Principe (pubblicato postumo nel 1532): un trattato su come si conquista e si mantiene uno Stato, fondato sulla «verità effettuale» e non sulla morale astratta, sul rapporto tra virtù del principe e fortuna. L'ultimo capitolo esorta un principe nuovo a liberare l'Italia dai «barbari»: nasce la scienza politica moderna."},{"id":"k99","ch":"cap-12","t":"Marignano e la pace di Noyon","x":"Francesco I, salito al trono nel 1515, scese subito in Italia per Milano. A Marignano (settembre 1515) sconfisse gli Svizzeri che difendevano Massimiliano Sforza, e Milano tornò francese; gli Svizzeri, con la pace perpetua, ottennero il riconoscimento del Ticino (confine ancora attuale). La pace di Noyon (1516), con il nuovo re di Spagna Carlo d'Asburgo, stabilì una spartizione: la Francia teneva Milano, la Spagna Napoli. Era un equilibrio provvisorio, perché Carlo stava per diventare il sovrano più potente d'Europa."},{"id":"k100","ch":"cap-12","t":"Carlo V: un'eredità senza precedenti","x":"Carlo d'Asburgo, nato a Gand nel 1500, era figlio di Filippo il Bello (figlio dell'imperatore Massimiliano e di Maria di Borgogna) e di Giovanna di Castiglia (figlia dei Re cattolici). Una serie di morti e matrimoni gli fece ereditare quattro eredità: i Paesi Bassi e la Borgogna (1506), la Spagna con Napoli, Sicilia, Sardegna e l'America (1516, come Carlo I), i domini austriaci (1519). Nel 1519 si presentò all'elezione imperiale contro Francesco I e vinse comprando i voti dei principi elettori con i prestiti dei banchieri Fugger e Welser: il 28 giugno divenne Carlo V. La Francia si trovò circondata, e da qui la lunga rivalità franco-asburgica."},{"id":"k101","ch":"cap-12","t":"La rivolta dei comuneros","x":"Carlo arrivò in Spagna nel 1517 senza parlare castigliano e circondato da consiglieri fiamminghi; dopo l'elezione imperiale chiese denaro alle Cortes e partì, lasciando reggente il precettore Adriano di Utrecht. Le città di Castiglia si ribellarono (1520): i comuneros difendevano le autonomie urbane contro i funzionari regi (corregidores) e chiedevano Cortes regolari. Quando la rivolta prese toni antinobiliari, la nobiltà si schierò col re, e i ribelli furono sconfitti a Villalar (23 aprile 1521). Carlo imparò la lezione: rispettò le istituzioni castigliane e fece della Castiglia la base finanziaria del suo impero."},{"id":"k102","ch":"cap-12","t":"Bicocca, Pavia e il trattato di Madrid","x":"Nel 1521 la guerra tra Francesco I e Carlo V riprese in Italia. Alla Bicocca (1522) i francesi persero Milano, affidata a Francesco II Sforza; il conestabile Carlo di Borbone, il più alto comandante francese, passò a Carlo V. Francesco I riprese Milano nel 1524 e assediò Pavia, ma il 24 febbraio 1525 l'esercito imperiale lo sconfisse e lo catturò: un re di Francia prigioniero del rivale. Col trattato di Madrid (14 gennaio 1526) Francesco I rinunciò all'Italia e alle Fiandre, cedette la Borgogna e consegnò i figli come ostaggi; appena libero dichiarò il trattato nullo perché estorto."},{"id":"k103","ch":"cap-12","t":"Lega di Cognac e sacco di Roma (1527)","x":"Nel 1526 Francesco I formò la Lega di Cognac con Inghilterra, Venezia, Firenze, Francesco II Sforza e il papa Medici Clemente VII, spaventato dalla potenza di Carlo V. La lega fu disunita e lenta. Carlo mandò in Italia circa 12.000 lanzichenecchi, molti luterani, guidati da Carlo di Borbone; Giovanni dalle Bande Nere, l'unico che tentò di fermarli, morì. Nel maggio 1527 l'esercito imperiale, senza paga e affamato, assaltò Roma: Borbone fu ucciso subito e i soldati, senza comandante, saccheggiarono la città per mesi, mentre il papa si chiudeva in Castel Sant'Angelo. L'Europa vi lesse una punizione divina della corruzione della Chiesa; politicamente il papato dimostrò di non potersi difendere dalle grandi potenze. A Firenze i Medici furono cacciati di nuovo (seconda Repubblica, 1527-1530)."},{"id":"k104","ch":"cap-12","t":"Andrea Doria e Genova","x":"Andrea Doria, ammiraglio e «imprenditore della guerra» con una flotta propria, serviva la Francia. Nel 1528, mentre i francesi assediavano Napoli, passò a Carlo V e tolse il blocco navale: l'assedio fallì, anche per il tifo. Il 12 settembre 1528 rientrò a Genova come liberatore e la riformò come repubblica oligarchica sul modello veneziano: le famiglie nobili iscritte nel libro d'oro eleggevano due Consigli e un doge che restava in carica solo due anni. Genova si legò alla Spagna, che le garantiva l'indipendenza; i suoi banchieri divennero i finanziatori della monarchia spagnola, e Carlo V ebbe la flotta per il Mediterraneo."},{"id":"k105","ch":"cap-12","t":"Pace di Cambrai e incoronazione di Bologna","x":"La pace di Cambrai (1529), detta «delle due dame» perché negoziata da Luisa di Savoia (madre di Francesco I) e Margherita d'Austria (zia di Carlo V), chiuse la prima fase delle guerre d'Italia. Cosa stabiliva: la Francia rinunciava a ogni pretesa sull'Italia ma teneva la Borgogna, e riscattava a caro prezzo i figli ostaggi. Prima Carlo V si era accordato con Clemente VII: investitura di Napoli e ritorno dei Medici a Firenze. Al congresso di Bologna fu ridisegnata l'Italia (Asti ai Savoia, Milano destinata agli Asburgo alla morte di Francesco II Sforza) e il 24 febbraio 1530 il papa incoronò Carlo imperatore e re d'Italia in San Petronio, ultima incoronazione imperiale di questo tipo. Firenze, dopo un lungo assedio (Michelangelo ne curò le difese), si arrese nell'agosto 1530: Alessandro de' Medici ne divenne duca."},{"id":"k106","ch":"cap-13","t":"La monarchia universale di Gattinara","x":"Il piemontese Mercurino Arborio da Gattinara, gran cancelliere dal 1518, diede a Carlo V un'idea politica: con tanti regni riuniti, l'imperatore poteva guidare una monarchia universale, garante della pace tra i cristiani e della lotta contro gli infedeli, come l'impero romano o quello sognato da Dante nel De monarchia. Era però un progetto difficile, perché ogni dominio aveva leggi, lingue e interessi propri. Morto Gattinara (1530), Carlo non nominò più un gran cancelliere: affidò i territori ai familiari (il fratello Ferdinando, re dei Romani dal 1531, cioè erede designato all'Impero, e la sorella Maria reggente dei Paesi Bassi) e a viceré, con consiglieri esecutori come Granvelle e Cobos."},{"id":"k107","ch":"cap-13","t":"Mohács e l'Ungheria","x":"Il regno d'Ungheria faceva da cuscinetto tra gli Ottomani e l'Europa centrale. Il 29 agosto 1526 a Mohács Solimano il Magnifico distrusse l'esercito ungherese; morì il giovane re Luigi II Jagellone, re anche di Boemia. Ferdinando d'Asburgo, cognato del re, ne rivendicò le corone: ottenne la Boemia, ma in Ungheria parte della nobiltà elesse Giovanni Szapolyai, sostenuto dai Turchi. L'Ungheria si divise in tre: un'Ungheria asburgica a ovest, la provincia ottomana di Buda (dal 1541) e la Transilvania vassalla del sultano, divisione confermata nel 1562. È l'origine della monarchia asburgica danubiana, baluardo contro i Turchi per due secoli."},{"id":"k108","ch":"cap-13","t":"L'assedio di Vienna (1529)","x":"Nel 1529 l'esercito di Solimano arrivò sotto le mura di Vienna, cuore dei domini asburgici. La città resistette e l'esercito ottomano, lontanissimo dalle sue basi e con l'inverno alle porte, si ritirò. L'episodio mostrò che l'Impero ottomano era una minaccia diretta per l'Europa centrale e che gli Asburgo, invece di concentrarsi su Francia e protestanti, dovevano tenere un fronte permanente a est. Gli Ottomani torneranno ad assediare Vienna nel 1683, respinti dall'intervento del re di Polonia Giovanni Sobieski."},{"id":"k109","ch":"cap-13","t":"Barbarossa, Tunisi, Prevesa, Algeri","x":"Nel Mediterraneo la minaccia veniva dai corsari barbareschi del Nord Africa, alleati del sultano. Khair-ad-Din, detto Barbarossa, prese Algeri nel 1529 e Solimano lo nominò ammiraglio della flotta ottomana. Nel 1535 Carlo V guidò personalmente la spedizione su Tunisi: conquistò la fortezza della Goletta e la città, liberando migliaia di schiavi cristiani, ma Barbarossa fuggì. Nel 1538 a Prevesa la flotta cristiana (spagnoli, veneziani, papa) di Andrea Doria fu sconfitta; i veneziani accusarono Doria di non aver combattuto, segno degli interessi divergenti (Venezia guardava al Levante, la Spagna al Mediterraneo occidentale). Nel 1541 la grande spedizione su Algeri fu distrutta da una tempesta. Solo Lepanto (1571) darà una grande vittoria cristiana."},{"id":"k110","ch":"cap-13","t":"Francesco I alleato del sultano","x":"Nel 1535 il re cristianissimo Francesco I strinse un'alleanza con Solimano il Magnifico, scandalizzando l'Europa: la logica politica (prendere gli Asburgo tra due fuochi) prevaleva ormai sulla solidarietà religiosa. Nel 1543 la flotta di Barbarossa svernò addirittura a Tolone e attaccò Nizza con i francesi. È uno dei primi esempi di ragion di Stato nella politica estera europea."},{"id":"k111","ch":"cap-13","t":"Milano asburgica e le ultime guerre con Francesco I","x":"Quando Francesco II Sforza morì senza eredi (1535), Carlo V prese direttamente il ducato di Milano, cerniera tra i suoi domini spagnoli, italiani e tedeschi. Francesco I reagì invadendo la Savoia e il Piemonte (Torino, 1536), che resteranno francesi fino al 1559. La tregua di Nizza (1538) doveva durare dieci anni, ma la guerra riprese nel 1542, con la flotta di Barbarossa al fianco dei francesi. La pace di Crépy (1544) ristabilì la situazione precedente: un matrimonio tra il duca d'Orléans e una principessa asburgica con in dote Milano o i Paesi Bassi avrebbe dovuto sigillarla, ma il principe morì nel 1545."},{"id":"k112","ch":"cap-13","t":"Opposizioni in Italia: Medici, Farnese, Siena","x":"Il predominio spagnolo in Italia non fu accettato senza resistenze. A Firenze Lorenzino de' Medici uccise nel 1537 il cugino duca Alessandro, presentandosi come tirannicida; gli succedette Cosimo I, che costruì uno Stato solido e fedele alla Spagna (granduca di Toscana dal 1569). Paolo III Farnese (1534-1549) staccò Parma e Piacenza dallo Stato della Chiesa per farne un ducato per il figlio Pier Luigi (1545): sospettato di intesa con la Francia, fu assassinato nel 1547 per ordine del governatore spagnolo di Milano. La Repubblica di Siena cacciò il presidio spagnolo nel 1552 e si mise sotto la Francia; dopo un lungo assedio cadde nel 1555 (gli ultimi repubblicani resistettero a Montalcino) e fu annessa alla Toscana di Cosimo."},{"id":"k113","ch":"cap-13","t":"Mühlberg e l'Interim","x":"Fallito ogni tentativo di accordo teologico (Ratisbona 1541), dopo la pace di Crépy Carlo V attaccò la Lega di Smalcalda. A Mühlberg, sull'Elba (1547), vinse e catturò l'elettore Giovanni Federico di Sassonia: sembrava il trionfo. Alla Dieta di Augusta del 1547-1548 impose l'Interim, una sistemazione religiosa provvisoria (concedendo ai protestanti il matrimonio dei preti e la comunione col calice) in attesa delle decisioni del Concilio di Trento, e propose di rafforzare l'Impero con un esercito e una cassa comuni. Ma cattolici e protestanti si opposero insieme, per difendere la «libertà tedesca» dei principi."},{"id":"k114","ch":"cap-13","t":"La pace di Augusta (1555)","x":"Nel 1551-1552 i principi protestanti si allearono con Enrico II di Francia, promettendogli i vescovati di Metz, Toul e Verdun, e sorpresero Carlo V, che dovette fuggire da Innsbruck. L'imperatore rinunciò a imporre l'unità religiosa e lasciò trattare il fratello Ferdinando. La pace di Augusta (25 settembre 1555) stabilì: il principio cuius regio, eius religio, cioè ogni principe sceglie tra cattolicesimo e luteranesimo e i sudditi si adeguano o emigrano (calvinisti esclusi); il riconoscimento delle secolarizzazioni di beni ecclesiastici fatte fino al 1552; il reservatum ecclesiasticum, per cui un vescovo o abate che diventasse protestante doveva lasciare carica e beni (clausola che i protestanti non accettarono). Fu la sconfitta del progetto universale di Carlo V: la libertà religiosa era dei principi, non degli individui, e la Germania restava divisa. Le questioni irrisolte (calvinisti, secolarizzazioni successive) porteranno alla guerra dei Trent'anni."},{"id":"k115","ch":"cap-13","t":"Abdicazione e divisione dell'impero","x":"Stanco e malato, Carlo V abdicò: il 25 ottobre 1555 a Bruxelles (dove era stato dichiarato maggiorenne quarant'anni prima) lasciò i Paesi Bassi al figlio Filippo; il 16 gennaio 1556 le corone di Spagna con i domini italiani e americani; la corona imperiale passò al fratello Ferdinando. L'eredità si divise così in due rami degli Asburgo: quello spagnolo (Spagna, Italia, America, Paesi Bassi) e quello austriaco (Austria, Boemia, Ungheria e Impero). Con la Francia era stata firmata la tregua di Vaucelles (1556). Carlo si ritirò nel monastero di Yuste in Estremadura, dove morì il 21 settembre 1558."},{"id":"k116","ch":"cap-13","t":"Plus Ultra: la figura di Carlo V","x":"Carlo V si definiva difensore della cristianità: il suo motto Plus Ultra («più oltre»), con le colonne d'Ercole, indicava il superamento dei limiti del mondo antico e l'impero americano. Educato nella cultura cavalleresca borgognona e nella Devotio moderna, ricevette da Erasmo l'Institutio principis christiani (1516). Nel discorso di Roma del 1536 negò di voler essere «monarca del mondo». Fu anche un sovrano moderno: rafforzò il governo per Consigli e nel 1538 ridusse le Cortes castigliane ai soli rappresentanti delle città, più facili da trattare. Lasciò al figlio la Castiglia come cuore finanziario e militare dell'impero e, nelle istruzioni del 1548, indicò Italia e Fiandre come chiavi per tenerlo unito."},{"id":"k117","ch":"cap-13","t":"Cateau-Cambrésis e il predominio spagnolo","x":"La pace di Cateau-Cambrésis (1559) chiuse definitivamente le guerre d'Italia tra Francia e Asburgo: la Francia rinunciò all'Italia, e la Spagna di Filippo II ebbe direttamente Milano, Napoli, Sicilia, Sardegna e lo Stato dei Presidi, con un'influenza su quasi tutti gli altri Stati. Iniziò il lungo periodo di predominio spagnolo sulla penisola, fino all'inizio del Settecento."},{"id":"k118","ch":"cap-14","t":"Riforma cattolica e Controriforma","x":"Gli storici distinguono due aspetti della reazione cattolica. La Riforma cattolica è il desiderio di rinnovamento interno, nato prima di Lutero: un clero più preparato e morale, una fede più vicina al Vangelo, nuovi ordini religiosi. La Controriforma è la risposta al protestantesimo: definizione rigida della dottrina, rafforzamento del papa, Inquisizione e Indice. I due aspetti si intrecciano nel Concilio di Trento, che insieme condanna i protestanti e riforma la disciplina della Chiesa."},{"id":"k119","ch":"cap-14","t":"Prima di Lutero: Lateranense V e Libellus","x":"Le richieste di riforma esistevano già prima del 1517. Al Concilio Lateranense V (convocato da Giulio II nel 1511, aperto nel 1512 e chiuso nel 1517; il riassunto lo data 1511-1516) l'agostiniano Egidio da Viterbo affermò che bisognava riformare gli uomini, non le istituzioni: vescovi e preti dovevano tornare a essere pastori. Nel 1513 due patrizi veneziani diventati monaci, Querini e Giustiniani, proposero a Leone X nel Libellus un programma radicale, compresa la Bibbia tradotta in volgare per tutti: fu ignorato. Sono il segno che la Chiesa conosceva i suoi mali ma non riusciva a curarli."},{"id":"k120","ch":"cap-14","t":"I nuovi ordini religiosi","x":"Il rinnovamento cattolico passò soprattutto per nuovi ordini, dediti più all'azione nel mondo che alla clausura: gli oratori del divino amore (confraternite caritative); i cappuccini (1528), francescani che tornavano alla povertà originaria e alla predicazione popolare; i teatini di Gaetano da Thiene e Gian Pietro Carafa (futuro Paolo IV), chierici regolari esemplari; i barnabiti; i somaschi (orfani e poveri); le orsoline di Angela Merici (1535), per l'educazione delle ragazze. Mostrano un cattolicesimo che rispondeva alla crisi con carità, istruzione e assistenza."},{"id":"k121","ch":"cap-14","t":"La Compagnia di Gesù","x":"Ignazio di Loyola, nobile basco ferito in battaglia (Pamplona, 1521), si convertì durante la convalescenza e nel 1534 fondò a Parigi con alcuni compagni la Compagnia di Gesù, approvata da Paolo III nel 1540. Ai voti tradizionali i gesuiti aggiunsero l'obbedienza speciale al papa; la formazione, lunga e rigorosa, si basava sugli Esercizi spirituali. Furono decisivi in tre campi: l'educazione (oltre 500 collegi a fine Cinquecento, per formare le élite cattoliche, con il metodo della Ratio studiorum del 1599), la politica (confessori di re e principi) e le missioni (Francesco Saverio in Asia, Matteo Ricci in Cina). Sono il simbolo della Controriforma."},{"id":"k122","ch":"cap-14","t":"Consilium de emendanda ecclesia","x":"Paolo III Farnese, eletto nel 1534, pur nepotista, avviò la riforma. Nominò cardinali uomini colti e riformatori come Gaspare Contarini, Reginald Pole e Pietro Bembo, e affidò a una commissione un'analisi dei mali della Chiesa. Il Consilium de emendanda ecclesia (1536) fu una denuncia impietosa: vescovi ignoranti e non residenti, benefici venduti, profitti della Curia. Il testo, destinato a restare segreto, fu pubblicato e usato dai protestanti come prova degli abusi."},{"id":"k123","ch":"cap-14","t":"La Riforma in Italia: Valdés e gli spirituali","x":"Negli anni Trenta e Quaranta del Cinquecento le idee riformate circolarono anche in Italia, a Venezia, Lucca, Modena, Ferrara e Napoli, tra ecclesiastici, intellettuali, mercanti e artigiani. I valdesi delle valli piemontesi aderirono alla Riforma (1532). A Napoli lo spagnolo Juan de Valdés guidava un circolo frequentato da Giulia Gonzaga, Bernardino Ochino e dai cardinali Morone e Pole: predicava una fede interiore, illuminata da Dio, poco interessata ai riti. Questi «spirituali» speravano in una riforma senza rottura, sostenuti dal Beneficio di Cristo (1543), libretto di successo con idee vicine a Calvino. Quando arrivò la repressione, alcuni (come Ochino, generale dei cappuccini, che nel 1542 fuggì a Ginevra) scelsero l'esilio, altri il nicodemismo."},{"id":"k124","ch":"cap-14","t":"Ratisbona e la nascita del Sant'Uffizio (1541-1542)","x":"Il colloquio di Ratisbona (1541) fu l'ultimo tentativo di accordo: il cardinale Contarini e Melantone trovarono un'intesa sulla giustificazione, ma fallirono su sacramenti e autorità del papa, e Roma e Lutero respinsero il compromesso. Il fallimento diede ragione agli intransigenti guidati dal cardinale Carafa: nel 1542 Paolo III istituì la Congregazione del Sant'Uffizio, l'Inquisizione romana, un tribunale centralizzato sotto il controllo diretto del papa per reprimere l'eresia in Italia. Finiva lo spazio per le posizioni intermedie."},{"id":"k125","ch":"cap-14","t":"Il Concilio di Trento","x":"Il concilio, chiesto da anni da Carlo V, si aprì a Trento nel dicembre 1545: città italiana ma dell'Impero, gradita ai tedeschi. L'imperatore voleva partire dalla riforma morale per riconciliare i protestanti, ma prevalse la linea papale di definire subito la dottrina: nel gennaio 1547 fu condannata la giustificazione per sola fede, chiudendo la porta ai luterani. Le fasi furono tre: 1545-1547 (poi trasferito a Bologna ufficialmente per un'epidemia, in realtà anche per contrasti con Carlo V), 1551-1552 con Giulio III (interrotto dalla guerra in Germania), 1562-1563 con Pio IV, che lo chiuse nel dicembre 1563. Nel mezzo Paolo IV Carafa, intransigente, non lo riconvocò e preferì la repressione."},{"id":"k126","ch":"cap-14","t":"Cosa stabilì Trento: la dottrina","x":"Le decisioni dottrinali di Trento rispondono punto per punto a Lutero. Contro la sola fide: la salvezza viene dalla grazia, ma l'uomo collabora con la fede e con le opere. Contro la sola scriptura: la verità rivelata sta nella Scrittura e nella Tradizione della Chiesa, e solo la Chiesa può interpretare la Bibbia, il cui testo ufficiale è la Vulgata latina di san Girolamo. Sono confermati i sette sacramenti, la transustanziazione nell'eucaristia, la distinzione tra clero e laici (contro il sacerdozio universale), il purgatorio, le indulgenze, il culto dei santi e della Madonna. Da qui in poi cattolici e protestanti sono due confessioni separate."},{"id":"k127","ch":"cap-14","t":"Cosa stabilì Trento: la disciplina","x":"Trento cercò di curare i mali denunciati da tutti. Furono istituiti i seminari per formare i preti (aperti anche ai poveri). I vescovi dovevano risiedere nella diocesi, visitarla almeno ogni due anni, predicare, non cumulare benefici. I parroci dovevano essere celibi, portare l'abito talare, tenere i registri di battesimi e matrimoni (dal 1614 anche sepolture e stato delle anime: per gli storici sono la prima fonte demografica). Il risultato fu un clero più preparato e presente, ma anche una Chiesa più centralizzata, con il papa interprete dei decreti."},{"id":"k128","ch":"cap-14","t":"Paolo IV e l'Indice dei libri proibiti","x":"Gian Pietro Carafa, fondatore dei teatini e capo degli intransigenti, divenne papa nel 1555 come Paolo IV. Ostile a ogni compromesso, non riconvocò il concilio e usò l'Inquisizione anche contro i cardinali sospetti: nel 1557 fece imprigionare Giovanni Morone, già legato a Valdés. Nel 1559 pubblicò il primo Indice dei libri proibiti, con l'intera opera di Erasmo: da allora l'Indice controllò stampa e lettura nei paesi cattolici fino al 1966. Quando morì i romani assaltarono le carceri del Sant'Uffizio e ne liberarono i detenuti."},{"id":"k129","ch":"cap-14","t":"Il papato dopo Trento: congregazioni e calendario","x":"Dopo Trento il papa è più forte che mai: il gesuita Roberto Bellarmino descrive la Chiesa come una monarchia con il papa sopra il concilio. Il governo passa dalle riunioni dei cardinali alle congregazioni specializzate, fissate da Sisto V (1585-1590) in quindici (sei per lo Stato pontificio, nove per la Chiesa); nel 1622 si aggiunge De Propaganda Fide per le missioni. Gregorio XIII riformò il calendario (1582) togliendo dieci giorni (dal 4 si passò al 15 ottobre) per riallinearlo all'anno solare: i paesi protestanti e ortodossi lo adottarono molto più tardi. Ma sul piano internazionale il papato contava sempre meno, come mostrò la sua esclusione dalle trattative di Vestfalia."},{"id":"k130","ch":"cap-14","t":"Carlo Borromeo e la nuova religiosità","x":"Il modello del vescovo tridentino è Carlo Borromeo, arcivescovo di Milano dal 1565, che lasciò Roma per vivere nella diocesi: visite pastorali, sinodi, seminari, disciplina severa per clero e fedeli, ma anche durezza contro eresia e stregoneria. Cambia anche la vita religiosa: la confessione diventa individuale e frequente, la comunione più frequente (soprattutto per impulso dei gesuiti). La confessione consola ma controlla: il confessore poteva chiedere a chi aveva letto libri proibiti di denunciarsi o denunciare all'Inquisizione, intrecciando il foro interno (la coscienza) e il foro esterno (il tribunale)."},{"id":"k131","ch":"cap-14","t":"Inquisizione, streghe, Bruno e Galileo","x":"L'Inquisizione romana mirava soprattutto all'abiura; mandava al rogo chi non abiurava e i relapsi (chi ricadeva nell'eresia). Sotto Pio V (1566-1572) la repressione fu durissima: furono distrutte le comunità anabattiste e sterminati i valdesi di Calabria; sopravvissero solo quelli delle valli piemontesi. Eliminato il protestantesimo (dopo il 1580), il Sant'Uffizio passò a controllare costumi, bestemmie, magia e stregoneria: è il «disciplinamento» della società. Colpì anche la cultura: Giordano Bruno fu bruciato a Roma nel 1600, Galileo costretto all'abiura nel 1633; nel 1596 furono vietate le Bibbie in volgare. Il risultato in Italia fu un forte conformismo e un isolamento culturale rispetto all'Europa del Nord."},{"id":"k132","ch":"cap-14","t":"Eretici di tutte le Chiese","x":"Lo storico Delio Cantimori chiamò «eretici di tutte le Chiese» quegli esuli italiani (come Ochino, i Sozzini, Castellione tra i loro amici) che, fuggiti dall'Inquisizione, entrarono in conflitto anche con Calvino e le Chiese riformate, perché rifiutavano ogni dogmatismo e la violenza in materia di fede. Hubert Jedin, grande storico del Concilio di Trento, paragonò invece le spinte della Riforma cattolica a tanti ruscelli che non formarono un unico fiume ma continuarono a scorrere sotto terra nella vita della Chiesa."},{"id":"k133","ch":"cap-15","t":"Gallicanesimo e limiti della Controriforma","x":"Anche gli Stati cattolici accolsero Trento con riserva, perché un papa più forte limitava il loro controllo sulle Chiese nazionali. La Francia difese l'autonomia della Chiesa gallicana (nomina dei vescovi da parte del re, diffidenza verso Roma) e non pubblicò ufficialmente i decreti tridentini; la Spagna li accolse precisando che non potevano ridurre i poteri del re."},{"id":"k134","ch":"cap-15","t":"Knox e la Scozia presbiteriana","x":"In Scozia la Riforma vinse contro la corona. John Knox, formatosi a Ginevra con Calvino, guidò dal 1559 la nobiltà protestante contro la reggente cattolica e i francesi: nacque una Chiesa presbiteriana, governata da pastori e anziani laici riuniti in assemblee, senza vescovi. La regina cattolica Mary Stuart, rientrata dalla Francia nel 1561, entrò in conflitto con i lord calvinisti, fu deposta e nel 1568 fuggì in Inghilterra, dove la cugina Elisabetta la tenne prigioniera per quasi vent'anni."},{"id":"k135","ch":"cap-15","t":"Enrico VIII: scisma senza eresia","x":"Enrico VIII (1509-1547) ruppe con Roma per ragioni dinastiche: voleva un figlio maschio e Caterina d'Aragona gli aveva dato solo una figlia, Maria. Clemente VII non concesse l'annullamento perché Caterina era zia di Carlo V, che nel 1527 aveva saccheggiato Roma. Con l'Atto di supremazia (1534) il re si fece capo della Chiesa d'Inghilterra; chi rifiutò il giuramento, come Thomas More, fu giustiziato (1535). Fu uno «scisma senza eresia»: dottrina e liturgia restarono cattoliche, ma i monasteri furono soppressi e le loro terre vendute, arricchendo la corona e la gentry che ne divenne fedele sostenitrice."},{"id":"k136","ch":"cap-15","t":"Da Edoardo VI a Elisabetta: l'altalena religiosa","x":"Dopo Enrico VIII la religione inglese cambiò a ogni regno. Con Edoardo VI (1547-1553), ancora bambino, i consiglieri portarono la Chiesa verso il protestantesimo (Book of Common Prayer, 1552). Maria Tudor (1553-1558), figlia di Caterina d'Aragona e moglie di Filippo II, restaurò il cattolicesimo con il cardinale Pole e mandò al rogo centinaia di protestanti, da cui il nome di «Bloody Mary». Elisabetta I (1558-1603), figlia di Anna Bolena, trovò un compromesso duraturo: Chiesa con vescovi e liturgia solenne ma dottrina protestante, definita nei Trentanove articoli (1563, resi definitivi nel 1571), con la regina «governatrice suprema»."},{"id":"k137","ch":"cap-15","t":"San Quintino e Cateau-Cambrésis (1557-1559)","x":"Dopo la tregua di Vaucelles la guerra riprese tra Enrico II e Filippo II. Il 10 agosto 1557 a San Quintino, in Piccardia, l'esercito spagnolo comandato da Emanuele Filiberto di Savoia schiacciò i francesi; ma la bancarotta spagnola del 1557 e la crisi francese spinsero alla pace. Il trattato di Cateau-Cambrésis (3 aprile 1559) stabilì: la Francia rinunciava per sempre a Milano e Napoli, restituiva la Corsica a Genova e la Savoia-Piemonte a Emanuele Filiberto (tenendo per un po' alcune piazzeforti e Saluzzo); conservava Calais, tolta agli inglesi nel 1558, e i tre vescovati di Metz, Toul e Verdun. Conseguenze: fine delle guerre d'Italia e inizio di un secolo e mezzo di predominio spagnolo sulla penisola, con Milano, Napoli, Sicilia, Sardegna e lo Stato dei Presidi in Toscana sotto la Spagna e quasi tutti gli altri Stati legati ad essa, tranne Venezia. La pace fu sigillata da matrimoni, e proprio durante i festeggiamenti Enrico II morì per un colpo di lancia in un torneo, aprendo la crisi francese."},{"id":"k138","ch":"cap-15","t":"Filippo II: il re burocrate","x":"Filippo II (1556-1598), cresciuto in Spagna, era l'opposto del padre: viaggiò poco e governò per iscritto, leggendo e annotando migliaia di documenti dal suo ufficio. Nel 1559 fissò la corte a Madrid e costruì l'Escorial, insieme palazzo, monastero e mausoleo. L'impero era una confederazione di regni con leggi proprie, uniti solo dalla persona del re; lo si governava con un sistema di Consigli (di Stato per la politica estera, poi guerra, finanze e Consigli per Castiglia, Aragona, Italia, Indie, Fiandre, Portogallo), in cui lavoravano letrados, giuristi non nobili formati nelle università, e con juntas ristrette. Pur campione della Controriforma, non accettava ingerenze papali: nel 1568 bloccò la bolla In coena Domini."},{"id":"k139","ch":"cap-15","t":"L'unione con il Portogallo (1580)","x":"Nel 1578 il giovane re Sebastiano del Portogallo morì in una crociata in Marocco (battaglia di Alcácer Quibir) senza eredi; gli succedette l'anziano zio, il cardinale Enrico, morto nel 1580. Filippo II, figlio di una principessa portoghese, fece valere i suoi diritti con l'esercito e divenne re: il Portogallo conservò leggi e istituzioni ma entrò nell'unione con la Spagna fino al 1640. Filippo controllava ora anche l'impero portoghese (Brasile, Africa, Asia): un dominio «su cui non tramontava mai il sole», da cui il motto «Non sufficit orbis». Ma l'unione rese le colonie portoghesi bersaglio degli olandesi nemici della Spagna."},{"id":"k140","ch":"cap-15","t":"Finanze spagnole e bancarotte","x":"Nonostante l'argento americano, la Spagna era sempre in crisi finanziaria: l'argento copriva solo circa un quarto delle entrate, il resto veniva da tasse (come l'alcabala sulle vendite) pagate soprattutto dalla Castiglia, perché la nobiltà era esente e gli altri regni difendevano i loro privilegi. Per pagare subito le truppe il re prendeva prestiti a breve termine e ad alto interesse (asientos, 15-20%) da banchieri tedeschi, fiamminghi e soprattutto genovesi. Quando non poteva pagare dichiarava bancarotta (1557, 1575, 1596 e più volte nel Seicento): i prestiti venivano convertiti d'autorità in juros, titoli a lungo termine al 5-7%. Le guerre continue divoravano tutto."},{"id":"k141","ch":"cap-15","t":"Moriscos, marrani e limpieza de sangre","x":"Per Filippo II l'unità cattolica era il collante di un impero eterogeneo, e l'Inquisizione spagnola la sorvegliava: comunità protestanti scoperte a Valladolid e Siviglia finirono negli auto da fé, cerimonie pubbliche di condanna. I moriscos, musulmani di Granada convertiti a forza, furono privati di lingua e costumi e nel 1568 si ribellarono nelle montagne delle Alpujarras; la rivolta fu repressa e decine di migliaia deportati, e nel 1609 Filippo III li espulse tutti (circa 300.000). I conversos o marrani (ebrei convertiti) erano sospettati di giudaizzare in segreto; si diffuse la limpieza de sangre, la «purezza di sangue» richiesta per cariche e ordini: una discriminazione non più religiosa ma basata sulla discendenza."},{"id":"k142","ch":"cap-15","t":"La battaglia di Lepanto (1571)","x":"Nel 1570 il sultano Selim II attaccò Cipro, ultimo grande possesso veneziano nel Mediterraneo orientale. Pio V riuscì a riunire la Lega Santa: Spagna, Venezia, papa, Cavalieri di Malta, Savoia, Genova. Il 7 ottobre 1571, all'ingresso del golfo di Patrasso presso Lepanto, la flotta cristiana di don Giovanni d'Austria (fratellastro di Filippo II) annientò quella ottomana: oltre 200 galee coinvolte per parte, circa 30.000 prigionieri turchi, migliaia di schiavi cristiani liberati. Tra i combattenti c'era il giovane Cervantes. La vittoria distrusse il mito dell'invincibilità ottomana sul mare, ma non cambiò i rapporti di forza: Venezia, che voleva riprendere i commerci, firmò una pace separata nel 1573 cedendo Cipro, e la Spagna una tregua nel 1578."},{"id":"k143","ch":"cap-15","t":"Paesi Bassi: le cause della rivolta","x":"Le diciassette province dei Paesi Bassi (attuali Olanda, Belgio, Lussemburgo e parte della Francia del Nord) erano ricchissime, con città mercantili e manifatturiere come Anversa, e gelose delle loro autonomie: ogni provincia aveva un governatore (statolder) e mandava delegati agli Stati generali. Filippo II, che non era nato lì e non ne parlava la lingua, volle governarle dalla Spagna, combattere il calvinismo con l'Inquisizione e riorganizzare le diocesi, tramite la reggente Margherita e il cardinale Granvelle. Nel 1566 i nobili, anche cattolici, chiesero di fermare l'Inquisizione e furono chiamati con disprezzo gueux (pezzenti), nome che adottarono con orgoglio; nell'estate i calvinisti distrussero immagini nelle chiese. Filippo mandò il duca d'Alba con un esercito: un tribunale speciale (il «Consiglio dei torbidi») giustiziò migliaia di persone, tra cui il conte di Egmont."},{"id":"k144","ch":"cap-15","t":"Paesi Bassi: la guerra e la divisione","x":"Guglielmo d'Orange, il «Taciturno», guidò la rivolta: i «pezzenti del mare», corsari, presero porti chiave e dal 1572 Olanda e Zelanda resistettero, riconoscendolo come statolder. La guerra rovinò le finanze spagnole: dopo la bancarotta del 1575 i soldati senza paga saccheggiarono Anversa (la «furia spagnola», 1576), e tutte le province si unirono con la Pacificazione di Gand chiedendo il ritiro delle truppe. Il nuovo governatore Alessandro Farnese sfruttò le divisioni religiose: con l'Unione di Arras (gennaio 1579) le province meridionali, cattoliche, tornarono alla Spagna in cambio dei privilegi; le settentrionali, calviniste, risposero con l'Unione di Utrecht e nel 1581 all'Aia dichiararono decaduto Filippo II: nasceva la Repubblica delle Province Unite. Guglielmo fu assassinato nel 1584, ma la guerra (detta degli Ottant'anni) si chiuse solo con il riconoscimento dell'indipendenza a Vestfalia nel 1648. La divisione corrisponde quasi all'attuale confine Olanda-Belgio."},{"id":"k145","ch":"cap-15","t":"Ugonotti e inizio delle guerre di religione","x":"In Francia il calvinismo si diffuse tra borghesi, artigiani e soprattutto nobili (circa un terzo dell'aristocrazia), che vi vedevano anche un modo di resistere al potere regio; nel 1559 gli ugonotti tennero il primo sinodo nazionale. La morte improvvisa di Enrico II lasciò il trono a figli giovani e deboli (Francesco II, Carlo IX, poi Enrico III), con la regina madre Caterina de' Medici a fare da reggente tra due fazioni nobiliari: i Borbone e Coligny per i protestanti, i Guisa per i cattolici. Caterina, consigliata dal cancelliere Michel de l'Hôpital, tentò la tolleranza: l'editto di Saint-Germain (gennaio 1562) permetteva il culto protestante fuori dalle città. I Guisa risposero con il massacro di Vassy (1° marzo 1562), inizio di trentasei anni di guerre."},{"id":"k146","ch":"cap-15","t":"La notte di San Bartolomeo (1572)","x":"La pace di Saint-Germain (1570) diede agli ugonotti libertà di culto limitata e quattro piazzeforti, tra cui La Rochelle, e Coligny divenne influente presso Carlo IX, spingendolo a una guerra contro la Spagna nei Paesi Bassi. Per sigillare la pace Margherita di Valois, sorella del re, sposò il protestante Enrico di Borbone, re di Navarra, e i capi ugonotti arrivarono a Parigi per le nozze. Dopo un attentato fallito contro Coligny, nella notte del 24 agosto 1572 (festa di San Bartolomeo), con l'approvazione della corte, i cattolici massacrarono gli ugonotti: a Parigi oltre 2.000 morti, tra cui Coligny, e migliaia nelle province. Enrico di Navarra si salvò convertendosi. Da allora gli scrittori protestanti detti monarcomachi teorizzarono il diritto di resistere e persino uccidere il re tiranno."},{"id":"k147","ch":"cap-15","t":"Politiques e guerra dei tre Enrichi","x":"Davanti alla guerra infinita nacquero i politiques, cattolici moderati per cui l'unità dello Stato e la pace contavano più dell'uniformità religiosa: la loro teoria è la sovranità forte di Jean Bodin (1576). Nel 1584 la morte del fratello del re fece di Enrico di Borbone, capo ugonotto, l'erede al trono: la Lega cattolica dei Guisa, sostenuta dalla Spagna, non lo accettava. Nella «guerra dei tre Enrichi» (Enrico III, Enrico di Guisa, Enrico di Borbone) il re, ostaggio della Lega, fece uccidere il Guisa a Blois (1588) e si alleò con Enrico di Borbone, ma fu pugnalato da un frate, Jacques Clément, nel 1589. Morendo riconobbe come erede il Borbone, secondo la legge salica."},{"id":"k148","ch":"cap-15","t":"Enrico IV, Vervins e l'Editto di Nantes","x":"Enrico IV, re protestante di un paese in maggioranza cattolico, dovette conquistare il regno contro la Lega e gli spagnoli. Capì che serviva la conversione («Parigi val bene una messa», secondo la tradizione): abiurò nel 1593, fu consacrato a Chartres (Reims era in mano alla Lega) nel 1594 ed entrò a Parigi il 22 marzo 1594; il papa lo riconobbe nel 1595. Nel 1598 firmò con la Spagna la pace di Vervins, che confermò Cateau-Cambrésis, ed emanò l'Editto di Nantes. Cosa stabiliva: il cattolicesimo restava religione di Stato, ma i protestanti avevano libertà di coscienza, libertà di culto in gran parte del regno, accesso a tutte le cariche, tribunali misti e circa cento piazzeforti garantite. Era la prima volta che uno Stato importante riconosceva la convivenza di due confessioni. Fu revocato da Luigi XIV nel 1685."},{"id":"k149","ch":"cap-15","t":"Elisabetta, Mary Stuart e Drake","x":"Elisabetta I era considerata illegittima dai cattolici (Roma non riconosceva il matrimonio di Enrico VIII con Anna Bolena), e Mary Stuart, sua prigioniera dal 1568, era la pretendente cattolica. Dopo la rivolta dei conti del Nord (1569) e la scomunica di Pio V (1570), che scioglieva i sudditi dall'obbedienza, Elisabetta represse i cattolici e aiutò ugonotti e ribelli olandesi. In mare i corsari come Francis Drake (seconda circumnavigazione del globo, 1577-1580) depredavano i convogli d'argento spagnoli, con l'appoggio della regina. Nel 1587, dopo un complotto per ucciderla, Elisabetta fece giustiziare Mary Stuart e Drake attaccò la flotta spagnola a Cadice: Filippo II decise di invadere l'Inghilterra."},{"id":"k150","ch":"cap-15","t":"L'Invincibile Armata (1588)","x":"Il piano di Filippo II prevedeva che una grande flotta partita da Lisbona (circa 130 navi e 17.000 uomini, al comando del duca di Medina Sidonia) prendesse il controllo della Manica e scortasse in Inghilterra l'esercito di Alessandro Farnese dai Paesi Bassi. Le navi inglesi, più leggere e con cannoni a lunga gittata, la attaccarono lungo la Manica; a Calais i brulotti la dispersero; il collegamento con Farnese non avvenne. Per tornare l'Armata dovette circumnavigare Scozia e Irlanda tra le tempeste: rientrarono 67 navi e un terzo degli uomini morì. Il fallimento colpì il prestigio spagnolo e fu il primo passo dell'ascesa marittima inglese."},{"id":"k151","ch":"cap-15","t":"Il declino economico della Spagna","x":"Alla morte di Filippo II (1598) la Spagna era la prima potenza ma con un'economia fragile. L'argento americano finiva ai banchieri stranieri, nelle guerre e nei beni di lusso importati; l'agricoltura soffriva perché la Mesta, potente corporazione degli allevatori di pecore protetta dalla grande nobiltà, aveva diritto di pascolo su vaste terre, e la Spagna doveva importare grano; le manifatture tessili di Toledo e Segovia declinavano, schiacciate dalle tasse e dalla preferenza per le rendite. Anche il potere interno era contestato: nel 1591 Filippo dovette reprimere con le armi la rivolta dell'Aragona in difesa dei suoi fueros (privilegi tradizionali)."},{"id":"k152","ch":"cap-16","t":"Enrico IV e Sully: la ricostruzione francese","x":"Dopo trent'anni di guerra civile Enrico IV (1589-1610) ricostruì la Francia con il ministro calvinista Sully: riordino delle finanze, riduzione delle imposte, strade e canali, agricoltura e manifatture, limitazione dei governatori nobili. Nel 1604 regolò la venalità delle cariche con la paulette, una tassa annua (dal nome del finanziere Paulet) che rendeva ereditari gli uffici: lo Stato incassava, e gli ufficiali formarono una nobiltà di toga legata al re. In politica estera preparava la guerra contro gli Asburgo quando nel 1610 fu ucciso da un fanatico cattolico, François Ravaillac."},{"id":"k153","ch":"cap-16","t":"Gli Stati generali del 1614","x":"Morto Enrico IV, la reggente Maria de' Medici avvicinò la Francia alla Spagna e dovette affrontare le pretese dei grandi nobili, che imposero la convocazione degli Stati generali (1614-1615). Il Terzo Stato propose di dichiarare legge fondamentale che il re riceve il potere direttamente da Dio, per sottrarlo a ogni pretesa papale e nobiliare: non passò, ma è il segno di una borghesia che vede nel re forte una garanzia. Furono gli ultimi Stati generali prima del 1789. Il favorito della regina, Concini, fu ucciso nel 1617 per ordine del giovane Luigi XIII, che relegò la madre a Blois."},{"id":"k154","ch":"cap-16","t":"Richelieu e il rafforzamento della monarchia","x":"Il cardinale Richelieu, nel Consiglio del re dal 1624 fino alla morte (1642), ebbe un solo obiettivo: la grandezza del re e della Francia. All'interno piegò la nobiltà ribelle (vietò i duelli, fece giustiziare congiurati illustri) e controllò le province con gli intendenti, commissari inviati da Parigi e revocabili, che scavalcavano governatori e ufficiali. Tolse agli ugonotti la loro forza militare: dopo l'assedio di La Rochelle (1628) la pace di Alès (1629) mantenne la libertà di culto dell'Editto di Nantes ma eliminò piazzeforti e privilegi politici. Fondò l'Académie française (1635) per la lingua. All'estero, pur cardinale, finanziò i protestanti e nel 1635 entrò in guerra contro gli Asburgo cattolici: è la ragion di Stato in azione."},{"id":"k155","ch":"cap-16","t":"Il prezzo della guerra: taglia e rivolte","x":"La guerra contro gli Asburgo fu pagata soprattutto dai contadini: la taglia, imposta diretta da cui clero, nobili e molte città erano esenti, passò da 17 a 57 milioni di lire tra 1614 e 1648. Insieme a carestie e peste provocò rivolte continue: nelle città (Parigi e Lione 1633, Lione 1642) e nelle campagne, come i croquants del Sud-Ovest (1636-1637) e i nu-pieds («piedi nudi») della Normandia contro la gabella del sale (1639), represse dall'esercito. È la faccia sociale dell'assolutismo, che esploderà nella Fronda (1648-1653)."},{"id":"k156","ch":"cap-16","t":"La Spagna di Lerma e Olivares","x":"Filippo III (1598-1621) lasciò il governo al favorito duca di Lerma, che pensò soprattutto ad arricchirsi; la Spagna cercò la pace (con l'Inghilterra nel 1604, tregua di dodici anni con l'Olanda nel 1609) ma espulse i moriscos (1609), perdendo circa 300.000 lavoratori. Con Filippo IV (1621-1665) governò il conte-duca di Olivares, che volle restaurare la potenza spagnola ascoltando gli arbitristas, autori di progetti di riforma. Il suo piano chiave fu la Unión de las Armas (1626): un esercito comune di 140.000 uomini a cui tutti i regni (Castiglia, Aragona, Catalogna, Valencia, Portogallo, Italia, Fiandre) contribuissero in proporzione. Gli altri regni lo videro come un attacco ai loro privilegi: il risultato furono le rivolte del 1640."},{"id":"k157","ch":"cap-16","t":"Le Province Unite: una repubblica di mercanti","x":"Le sette Province Unite (Olanda, Zelanda, Utrecht, Gheldria, Frisia, Overijssel, Groninga) erano una confederazione: ogni provincia era sovrana e mandava delegati vincolati agli Stati generali dell'Aia, che decidevano all'unanimità. Contava soprattutto l'Olanda, che pagava più di metà delle spese, dominata dai reggenti, patrizi mercantili delle città come Amsterdam. Due poteri si bilanciavano: lo statolder, di solito un principe d'Orange, comandante di esercito e flotta, amato da nobili, popolo e calvinisti rigidi, più forte in guerra; e il Gran pensionario d'Olanda, voce dei mercanti, repubblicano e tollerante, più forte in pace. Al Sud, rimasto spagnolo sotto gli arciduchi Alberto e Isabella, Anversa declinava perché gli olandesi le chiudevano lo sbocco al mare sulla Schelda (1585), a vantaggio di Amsterdam."},{"id":"k158","ch":"cap-16","t":"Arminiani e gomaristi","x":"All'inizio del Seicento il teologo Arminio contestò la predestinazione rigida: l'uomo può accettare o rifiutare la grazia. Gomaer difendeva il calvinismo intransigente. La disputa divenne politica: con i gomaristi lo statolder Maurizio di Nassau, il popolo e la Chiesa; con gli arminiani il Gran pensionario Oldenbarnevelt e i patriziati olandesi, favorevoli a tolleranza e autonomia delle province. Maurizio vinse con un colpo di forza: Oldenbarnevelt fu decapitato (1619) e il giurista Ugo Grozio condannato al carcere a vita (fuggì nel 1621 nascosto in una cassa di libri). Il sinodo di Dordrecht (1618-1619) condannò l'arminianesimo."},{"id":"k159","ch":"cap-16","t":"La Polonia, repubblica nobiliare","x":"Con l'Unione di Lublino (1569) Polonia e Lituania divennero un unico grande Stato multietnico e multireligioso (cattolici, ortodossi, protestanti, ebrei), dal Baltico quasi al Mar Nero. Estinti gli Jagelloni (1572), il re fu eletto da tutta la nobiltà, che gli imponeva i pacta conventa (rispetto dei privilegi, Dieta ogni due anni, tolleranza) e preferiva re stranieri per tenerli deboli: Enrico di Valois (che fuggì dopo cinque mesi per diventare re di Francia), Stefano Bathory, poi i Vasa svedesi. Il risultato fu una «repubblica nobiliare» con un re debole, che alla lunga renderà la Polonia preda dei vicini. Con i gesuiti avanzò la Controriforma: nel 1596 nacque la Chiesa uniata (ortodossi che riconoscono il papa) e nel 1658 furono espulsi i sociniani."},{"id":"k160","ch":"cap-16","t":"La Svezia di Gustavo II Adolfo","x":"La Svezia, monarchia ereditaria dal 1544 con una Dieta di quattro ceti (anche i contadini liberi) e un Consiglio nobiliare, aveva poco più di un milione di abitanti ma rame e ferro in abbondanza. Dopo la deposizione del re cattolico Sigismondo (1599), con Carlo IX e poi con Gustavo II Adolfo (1611-1632) divenne una grande potenza. Gustavo Adolfo si accordò con la nobiltà e creò un esercito nazionale permanente, con coscrizione e ferma lunga, motivato dalla fede luterana, e innovazioni tattiche (moschetti più leggeri, file ridotte da dieci a sei, cannoni leggeri e mobili, cavalleria che carica con la sciabola). Tolse alla Russia Ingria e Carelia (1617) e alla Polonia la Livonia con Riga (1621): l'obiettivo era fare del Baltico un lago svedese."},{"id":"k161","ch":"cap-16","t":"Verso la guerra: Rodolfo II, Unione e Lega","x":"La pace di Augusta non bastava più: escludeva i calvinisti, che avevano conquistato principi elettori (Palatinato, poi Brandeburgo), e i protestanti continuavano a secolarizzare beni ecclesiastici contro il reservatum. L'imperatore Rodolfo II (1576-1612), residente a Praga e appassionato di arte e alchimia, favoriva la Controriforma (centro la Baviera dei gesuiti). Nel 1608 i protestanti formarono l'Unione evangelica (guida l'elettore palatino Federico V), nel 1609 i cattolici la Lega cattolica (Massimiliano di Baviera), con dietro Francia e Spagna. Nel 1609 la nobiltà boema strappò a Rodolfo la Lettera di maestà, che garantiva libertà di culto anche agli eredi degli hussiti. Ma con il fratello Mattia (imperatore dal 1612) emerse l'erede Ferdinando di Stiria, educato dai gesuiti e deciso a ricattolicizzare: nel 1617 divenne re di Boemia."},{"id":"k162","ch":"cap-16","t":"La defenestrazione di Praga e la Montagna Bianca","x":"Quando Ferdinando, re di Boemia, cominciò a violare la Lettera di maestà, i nobili protestanti reagirono: il 23 maggio 1618 gettarono dalla finestra del castello di Praga due luogotenenti imperiali e il loro segretario (sopravvissero cadendo su un mucchio di letame). Era la ribellione: nel 1619 gli Stati boemi deposero Ferdinando, proprio mentre diventava imperatore (Ferdinando II), ed elessero re il calvinista Federico V del Palatinato. In gioco c'era anche l'Impero: con il voto boemo gli elettori protestanti sarebbero stati in maggioranza sui tre arcivescovi cattolici (Magonza, Colonia, Treviri). L'8 novembre 1620 alla Montagna Bianca, vicino a Praga, l'esercito imperiale e quello della Lega cattolica (Tilly) schiacciarono i boemi. Federico, «re d'inverno» perché regnò un solo inverno, perse anche il Palatinato e il titolo elettorale, dato a Massimiliano di Baviera. La Boemia fu ricattolicizzata a forza, la nobiltà protestante esiliata e nel 1627 la corona divenne ereditaria negli Asburgo."},{"id":"k163","ch":"cap-16","t":"Valtellina e Monferrato: la guerra in Italia","x":"La guerra coinvolse l'Italia perché la Spagna aveva bisogno di passaggi tra Milano e i suoi eserciti in Germania e nelle Fiandre (la «via di Spagna»). La Valtellina, cattolica ma soggetta ai Grigioni protestanti, si ribellò nel 1620 con il massacro dei protestanti («sacro macello») e fu occupata dagli spagnoli; Francia, Venezia e Savoia reagirono e il trattato di Monçon (1626) la smilitarizzò. Nel Monferrato, possedimento dei Gonzaga di Mantova, alla morte di Vincenzo II (1627) l'erede era il francese Carlo Gonzaga-Nevers: Spagna, Impero e Savoia si opposero, Mantova fu saccheggiata dai lanzichenecchi (1630, con la peste raccontata da Manzoni), ma i francesi tennero Casale. Il trattato di Cherasco (1631) lasciò a Nevers Mantova e Monferrato sotto l'alta sovranità imperiale, diede ai Savoia Alba e parte del Monferrato e alla Francia la fortezza di Pinerolo, porta d'ingresso in Italia."},{"id":"k164","ch":"cap-16","t":"La fase danese e Wallenstein","x":"Nel 1625 intervenne Cristiano IV di Danimarca, luterano, che come duca di Holstein era principe dell'Impero e temeva l'avanzata cattolica verso il Baltico. Fu sconfitto da Tilly e da Albrecht von Wallenstein, nobile boemo convertito, arricchito con le terre confiscate ai protestanti e duca di Friedland. Wallenstein era un «imprenditore della guerra»: arruolava a sue spese un esercito (fino a oltre 100.000 uomini) e lo manteneva imponendo «contribuzioni» ai territori occupati, amici o nemici. Con la pace di Lubecca (1629) Cristiano IV uscì dalla guerra. Ferdinando II, all'apice, emanò l'editto di restituzione (1629): tutti i beni ecclesiastici secolarizzati dopo il 1552 dovevano tornare alla Chiesa. Il provvedimento spaventò anche i principi cattolici e spinse la Svezia a intervenire."},{"id":"k165","ch":"cap-16","t":"La fase svedese: Breitenfeld e Lützen","x":"Nel 1630 Gustavo II Adolfo sbarcò in Pomerania, per difendere i protestanti ma soprattutto per il dominio del Baltico, finanziato dalla Francia di Richelieu. Ferdinando aveva appena licenziato Wallenstein su pressione dei principi. A Breitenfeld (17 settembre 1631) gli svedesi annientarono Tilly e attraversarono la Germania fino a Monaco: Gustavo, il «leone del Nord», sembrava inarrestabile. L'imperatore richiamò Wallenstein, che affrontò gli svedesi a Lützen (16 novembre 1632, data che il riassunto riporta come 17): vinsero gli svedesi, ma il re morì in battaglia. Il cancelliere Oxenstierna continuò la guerra per la piccola Cristina. Wallenstein, sospettato di trattare col nemico, fu ucciso da suoi ufficiali per ordine dell'imperatore (1634). A Nördlingen (1634) imperiali e spagnoli batterono gli svedesi, e con la pace di Praga (1635) Sassonia e Brandeburgo si riconciliarono con l'imperatore, che sospese l'editto di restituzione."},{"id":"k166","ch":"cap-16","t":"La fase francese (1635-1648)","x":"Quando la guerra sembrava chiudersi con la pace di Praga, nel maggio 1635 la Francia di Richelieu entrò direttamente in guerra contro la Spagna e l'imperatore, alleata con Svezia e Province Unite. Una potenza cattolica guidata da un cardinale combatteva contro gli Asburgo cattolici: la guerra di religione era diventata una guerra per l'egemonia europea, decisa dalla ragion di Stato. La Spagna, logorata, crollò su più fronti: rivolte di Catalogna e Portogallo (1640), sconfitte alle Dune (1639) e a Rocroi (1643)."},{"id":"k167","ch":"cap-16","t":"Le rivolte di Catalogna e Portogallo (1640)","x":"Nel 1640 Olivares cercò di costringere la Catalogna, ricca di privilegi e con lingua e istituzioni proprie, a mantenere le truppe in guerra contro la Francia: i catalani insorsero e nel 1641 si misero sotto la protezione del re di Francia. Lo stesso anno la nobiltà portoghese, chiamata a combattere in Catalogna, proclamò l'indipendenza e incoronò il duca di Braganza come Giovanni IV. Olivares cadde (1643), la Spagna fece bancarotta (1647) e affrontò anche le rivolte di Napoli e Palermo. Barcellona fu ripresa nel 1652, perché la nobiltà catalana temeva la rivolta sociale; il Portogallo invece resistette e la Spagna ne riconobbe l'indipendenza nel 1668."},{"id":"k168","ch":"cap-16","t":"La pace di Vestfalia (1648): cosa stabilì","x":"I trattati di Münster (tra impero, Francia e cattolici) e Osnabrück (con la Svezia e i protestanti), firmati nel 1648 dopo anni di trattative, chiusero la guerra dei Trent'anni. Clausole territoriali: le Province Unite ottennero il riconoscimento dell'indipendenza dalla Spagna (e la Svizzera dall'Impero); la Francia ebbe i vescovati di Metz, Toul e Verdun, gran parte dell'Alsazia e Pinerolo; la Svezia la Pomerania occidentale con le foci dei grandi fiumi tedeschi; il Brandeburgo la Pomerania orientale e i vescovati di Magdeburgo e Minden, nucleo della futura Prussia. Clausole religiose: il calvinismo fu riconosciuto accanto a cattolicesimo e luteranesimo; per i beni ecclesiastici si fissò come anno normale il 1624; la Baviera tenne il titolo elettorale e l'Alto Palatinato, mentre il figlio di Federico V riebbe il Basso Palatinato e un nuovo titolo (elettori da sette a otto). Clausole politiche: i principi tedeschi ottennero di fatto la sovranità, con diritto di fare alleanze, e l'imperatore non poteva fare guerra, pace o tasse senza la Dieta. Il papa Innocenzo X protestò senza effetto. Conseguenze: fine dell'idea di unità religiosa europea, Germania frammentata e devastata (forse un terzo della popolazione perduta), declino degli Asburgo e ascesa di Francia, Svezia e Olanda; la guerra franco-spagnola continuò fino alla pace dei Pirenei (1659)."},{"id":"k169","ch":"cap-16","t":"Le Dune e Rocroi: il crollo militare spagnolo","x":"Tra 1637 e 1643 la potenza militare spagnola crollò. Gli olandesi ripresero Breda (1637) e tagliarono la via di Spagna; alla battaglia delle Dune (21 ottobre 1639, al largo dell'Inghilterra) l'ammiraglio Tromp distrusse una grande flotta spagnola diretta nelle Fiandre. Il 19 maggio 1643 a Rocroi, nelle Ardenne, il giovane duca d'Enghien (futuro Gran Condé) sconfisse i famosi tercios: è la fine simbolica della supremazia militare spagnola durata dal 1500."},{"id":"k170","ch":"cap-17","t":"Gli Stuart e l'unione delle corone","x":"Elisabetta I morì nel 1603 senza figli e la corona passò al re di Scozia Giacomo VI Stuart, figlio di Mary Stuart, che divenne Giacomo I d'Inghilterra. Era un'unione personale: stesso re, ma due regni con Parlamenti, leggi e Chiese diverse (anglicana in Inghilterra, presbiteriana in Scozia). Questa differenza religiosa sarà una delle micce della guerra civile. L'unione politica nel Regno di Gran Bretagna arriverà solo con l'Atto di unione del 1707."},{"id":"k171","ch":"cap-17","t":"Enclosures ed economia inglese","x":"Nel Cinque-Seicento l'Inghilterra cresce (circa 4,5 milioni di abitanti). Le enclosures, cioè la recinzione delle terre comuni e dei campi aperti (open fields) coltivati collettivamente, permettono ai proprietari di trasformarle in pascoli per pecore e in aziende più produttive, ma tolgono ai contadini poveri i diritti d'uso. La lana alimenta la manifattura tessile (circa il 75% delle esportazioni), spesso organizzata a domicilio nelle campagne; Elisabetta sostiene flotta e compagnie commerciali privilegiate. Ne escono rafforzati proprietari terrieri e mercanti, i gruppi che si scontreranno con gli Stuart."},{"id":"k172","ch":"cap-17","t":"Il Parlamento inglese","x":"Il Parlamento inglese aveva due camere: i Lord (pari ereditari e vescovi) e i Comuni, eletti nelle contee (votavano i proprietari liberi con almeno 40 scellini di rendita annua) e nei borghi con regole varie. Il re lo convocava e scioglieva, ma senza il suo consenso non poteva imporre tasse. Nel Cinquecento i Comuni, dominati dalla gentry, avevano cominciato a discutere anche di politica e religione. Il conflitto del Seicento nasce qui: gli Stuart vogliono governare da soli, i Comuni vogliono che senza Parlamento non si governi."},{"id":"k173","ch":"cap-17","t":"La società: gentry, yeomen, giudici di pace","x":"La società inglese era più mobile di quella continentale. La nobiltà titolata era ristretta e senza grandi privilegi fiscali; i figli cadetti, esclusi dall'eredità, entravano spesso negli affari. Il gruppo emergente era la gentry, nobiltà di campagna senza titolo, cresciuta comprando le terre dei monasteri soppressi: come giudici di pace (nominati dal re ma non pagati) governava le contee, e forniva gran parte dei deputati ai Comuni. Nelle campagne c'erano poi yeomen e freeholders (piccoli e medi proprietari), copyholders (affittuari con contratti ereditari), braccianti e cottagers (i più poveri, che vivevano sulle terre comuni e furono i più colpiti dalle recinzioni)."},{"id":"k174","ch":"cap-17","t":"Puritani e papisti","x":"La Chiesa anglicana di Elisabetta era un compromesso: dottrina protestante (Trentanove articoli), ma vescovi e liturgia di sapore cattolico, con il sovrano a capo. I puritani, calvinisti rigorosi, volevano «purificarla» dai residui papisti: abolire i vescovi, semplificare il culto, imporre una severa morale. I cattolici, detti «papisti», erano sospettati di tradimento perché obbedivano a un sovrano straniero, il papa. Per i re la questione era politica: chi controllava la Chiesa controllava la società."},{"id":"k175","ch":"cap-17","t":"Giacomo I: finanze, polveri, Mayflower","x":"Giacomo I (1603-1625), scozzese e teorico del diritto divino dei re, si scontrò presto con i Comuni. Le entrate ordinarie (soprattutto i dazi doganali, tonnage and poundage) non bastavano e il Parlamento concedeva solo sussidi straordinari; il re vendeva titoli (baronetto, 1611), cariche e monopoli. Lo scandalo della corte si vide con la condanna di Francis Bacon per corruzione (1621) e lo strapotere del favorito Buckingham. La congiura delle polveri (1605), un tentativo cattolico di far saltare Westminster con il re, inasprì le leggi anticattoliche. Ma Giacomo rifiutò anche le richieste puritane («No bishops, no king»: senza vescovi non c'è re), e molti dissidenti emigrarono: nel 1620 i Padri pellegrini della Mayflower fondarono Plymouth, nel futuro Massachusetts. Alla fine dispiacquero la mancata difesa del genero protestante Federico V e il matrimonio dell'erede con la cattolica Enrichetta Maria di Francia."},{"id":"k176","ch":"cap-17","t":"La Petition of Right (1628)","x":"Carlo I (1625-1649) ereditò debiti, impopolarità e il favorito Buckingham, e si lanciò in guerre costose contro Spagna e Francia (spedizione fallita in aiuto degli ugonotti di La Rochelle). Per ottenere fondi dovette accettare nel 1628 la Petition of Right, un documento in cui il Parlamento ribadiva diritti antichi: nessuna tassa né prestito forzoso senza consenso del Parlamento, nessun arresto senza motivo legale, nessun alloggio forzato di soldati nelle case private, nessuna legge marziale in tempo di pace. È uno dei testi fondativi delle libertà inglesi, accanto alla Magna Charta e al futuro Bill of Rights."},{"id":"k177","ch":"cap-17","t":"Il governo personale: Laud, Strafford, ship money","x":"Nel 1629 Carlo I sciolse il Parlamento e governò da solo per undici anni. I suoi uomini furono Thomas Wentworth (Strafford), energico amministratore in Irlanda, e William Laud, arcivescovo di Canterbury dal 1633, che impose uniformità e solennità liturgica e favorì l'arminianesimo, dottrina che i puritani scambiavano per cattolicesimo travestito. Per finanziarsi Carlo estese a tutto il paese la ship money, una tassa per la flotta prima chiesta solo alle contee costiere: John Hampden si rifiutò di pagarla e il processo ne fece un simbolo, perché era una tassa senza Parlamento. Molti puritani emigrarono nel New England."},{"id":"k178","ch":"cap-17","t":"Short e Long Parliament (1640)","x":"Il governo personale crollò in Scozia: quando Carlo e Laud vollero imporre il libro di preghiere anglicano alla Chiesa presbiteriana (1637-1638), gli scozzesi firmarono il National Covenant e presero le armi. Senza soldi per l'esercito, il re convocò il Parlamento (aprile 1640): i Comuni vollero prima discutere le loro richieste e Carlo lo sciolse dopo tre settimane (Short Parliament). Sconfitto dagli scozzesi, dovette riconvocarlo a novembre: il Long Parliament, guidato da Pym e Hampden, durò fino al 1653 e smontò l'assolutismo. Strafford fu condannato e giustiziato (1641), Laud arrestato (giustiziato nel 1645); il Triennial Act impose la convocazione almeno ogni tre anni; il Parlamento non poteva essere sciolto senza il suo consenso; furono aboliti la Camera stellata e gli altri tribunali di prerogativa regia; ship money e tasse senza consenso dichiarate illegali; i vescovi esclusi dai Lord."},{"id":"k179","ch":"cap-17","t":"Grand Remonstrance e scoppio della guerra civile","x":"Nel 1641 l'Irlanda cattolica insorse contro i coloni protestanti, con stragi che terrorizzarono l'Inghilterra. Chi doveva comandare l'esercito per reprimerla? I Comuni non si fidavano del re e con la Grand Remonstrance (22 novembre 1641) elencarono i suoi abusi e chiesero che nominasse ministri graditi al Parlamento: l'idea, nuova, di un esecutivo responsabile verso il legislativo. Nel gennaio 1642 Carlo entrò armato nei Comuni per arrestare cinque deputati, che erano già fuggiti nella City; Londra si sollevò e il re lasciò la capitale. Era la guerra civile. L'assolutismo fallì perché in Inghilterra mancavano esercito permanente e burocrazia regia, il governo locale era in mano alla gentry (self-government) e la common law, diritto basato sulle sentenze dei giudici, limitava il re."},{"id":"k180","ch":"cap-17","t":"La prima guerra civile (1642-1646)","x":"All'inizio molti restarono neutrali. Il re, con la cavalleria dei gentiluomini fedeli («cavalieri», dai capelli lunghi), si stabilì a Oxford e nel 1643 controllava gran parte del paese. Il Parlamento («teste rotonde», dai capelli corti dei puritani) aveva però Londra, la City, la flotta e i porti, e nel 1643 si alleò con gli scozzesi (Solemn League and Covenant). A Marston Moor (2 luglio 1644) emerse Oliver Cromwell, gentiluomo puritano, con la sua cavalleria degli Ironsides («fianchi di ferro»). Nel 1645 fu creato il New Model Army, esercito professionale con promozioni per merito e soldati animati da fervore religioso, che a Naseby (14 giugno 1645) distrusse l'esercito regio. Carlo si consegnò agli scozzesi (1646), che lo cedettero al Parlamento dietro pagamento (1647)."},{"id":"k181","ch":"cap-17","t":"Presbiteriani, indipendenti e livellatori","x":"Vinta la guerra, i vincitori si divisero. In Parlamento dominavano i presbiteriani, che volevano una Chiesa di Stato calvinista sul modello scozzese e un accordo con il re; nell'esercito prevalevano gli indipendenti, per l'autonomia delle congregazioni e la tolleranza (tranne che per i cattolici), e si diffondevano i Levellers (livellatori) di John Lilburne: sovranità del popolo, voto a tutti i maschi adulti indipendenti, libertà di coscienza, abolizione dei Lord. Quando il Parlamento cercò di sciogliere l'esercito senza pagarlo, i soldati elessero propri rappresentanti, gli agitatori. Nei dibattiti di Putney (ottobre-novembre 1647) il colonnello Rainborough affermò che «il più povero d'Inghilterra ha una vita da vivere come il più grande» e deve dare il consenso al governo; Henry Ireton, genero di Cromwell, rispose che il voto spetta solo a chi ha una proprietà nel paese. È la prima discussione moderna sul suffragio."},{"id":"k182","ch":"cap-17","t":"Purga di Pride ed esecuzione del re (1648-1649)","x":"Carlo fuggì nell'isola di Wight e si accordò con gli scozzesi, scatenando la seconda guerra civile, che Cromwell vinse a Preston (agosto 1648). L'esercito decise di farla finita: il 6 dicembre 1648 il colonnello Pride impedì l'accesso ai deputati presbiteriani (purga di Pride) e i rimasti, il Rump Parliament («Parlamento troncone»), istituirono un'Alta corte che processò il re per tradimento contro il popolo. Il 30 gennaio 1649 Carlo I fu decapitato davanti a Whitehall: per la prima volta un re veniva giudicato e giustiziato dai suoi sudditi in nome della legge. Furono aboliti la monarchia e la Camera dei Lord e il 19 maggio 1649 nacque il Commonwealth, repubblica d'Inghilterra, Scozia e Irlanda."},{"id":"k183","ch":"cap-17","t":"Diggers, quaccheri e radicali","x":"La rivoluzione liberò un'esplosione di sette e idee, favorita dal crollo della censura. I Diggers (zappatori) di Gerard Winstanley occuparono terre comuni per coltivarle insieme, sostenendo che la terra è un «tesoro comune» e la proprietà privata contraria al Vangelo: furono dispersi dai proprietari. Lilburne attaccò il nuovo regime («Le nuove catene dell'Inghilterra») e Cromwell schiacciò l'ammutinamento dei soldati livellatori a Burford (maggio 1649). Gli uomini della Quinta Monarchia aspettavano il regno di Cristo profetizzato da Daniele. Durarono invece i quaccheri di George Fox: luce interiore di Dio in ogni uomo, pacifismo, rifiuto di giuramenti e gerarchie; William Penn fondò per loro la Pennsylvania (1681) e Filadelfia, e furono tra i primi abolizionisti della schiavitù."},{"id":"k184","ch":"cap-17","t":"Cromwell Lord Protettore","x":"Cromwell consolidò la repubblica con la forza: riconquistò l'Irlanda con massacri (Drogheda, 1649) e confische di terre a favore dei protestanti, sconfisse gli scozzesi che avevano incoronato Carlo II. Rilanciò la potenza commerciale: l'Atto di navigazione (1651) riservava il commercio con l'Inghilterra a navi inglesi o del paese d'origine delle merci, colpendo gli olandesi, trasportatori d'Europa, e provocò le guerre anglo-olandesi; contro la Spagna prese la Giamaica (1655). Non riuscì però a dare legittimità al regime: sciolto il Rump e poi il Parlamento dei nominati (1653), l'esercito gli diede con l'Instrument of Government il titolo di Lord Protettore, poi ereditario; rifiutò la corona offertagli dal Parlamento. Il regime divenne una dittatura militare e puritana."},{"id":"k185","ch":"cap-17","t":"La Restaurazione (1660)","x":"Morto Cromwell (3 settembre 1658), il figlio Richard non resse e l'esercito si divise. Il generale George Monck, comandante in Scozia, marciò su Londra e fece eleggere un nuovo Parlamento. Carlo II, in esilio, con la Dichiarazione di Breda promise perdono generale (salvo i regicidi), libertà di coscienza e rispetto del Parlamento; il 29 maggio 1660 sbarcò a Dover. La monarchia tornò, ma non come prima: il principio che il re non può governare senza Parlamento era ormai affermato e verrà sancito dalla Gloriosa rivoluzione del 1688-1689 e dal Bill of Rights."},{"id":"k186","ch":"cap-18","t":"La crisi generale del Seicento","x":"Dopo la crescita del Cinquecento, il Seicento è un secolo di difficoltà: peggioramento del clima (piccola glaciazione), carestie, epidemie, guerre devastanti. La popolazione europea cresce poco (da circa 107 a 125 milioni in un secolo) e ristagna in Italia, Spagna e Germania. Gli storici hanno parlato di «crisi generale»: per il marxista Eric Hobsbawm segna la transizione dal feudalesimo al capitalismo; per altri è lo scontro tra monarchie che accentrano e tassano per finanziare le guerre e società che difendono privilegi e autonomie. A metà secolo esplodono quasi insieme le rivolte di Catalogna, Portogallo, Napoli e Sicilia, la rivoluzione inglese e la Fronda francese. Ne escono vincenti le economie atlantiche (Olanda, Inghilterra) e perdenti quelle mediterranee."},{"id":"k187","ch":"cap-18","t":"Copernico, Keplero, Galileo","x":"La rivoluzione scientifica parte dall'astronomia. Copernico (1543) mette il Sole al centro, ma le sue orbite sono ancora circolari. Keplero (Astronomia nova, 1609) scopre, sui dati di Tycho Brahe, che i pianeti percorrono ellissi. Galileo, col cannocchiale (1609-1610), vede montagne sulla Luna, satelliti di Giove, macchie solari: il cielo non è perfetto e immutabile e le stesse leggi valgono in cielo e in terra. Sostiene che scienza e Bibbia hanno ambiti diversi e che la natura è scritta in lingua matematica. Ammonito nel 1616 a non sostenere Copernico, pubblica nel 1632 il Dialogo sopra i due massimi sistemi, dove il difensore di Tolomeo, Simplicio, appare ingenuo: processato dal Sant'Uffizio, nel 1633 abiura. Il caso Galileo diventerà il simbolo del conflitto tra scienza e autorità religiosa."},{"id":"k188","ch":"cap-18","t":"Giordano Bruno","x":"Il domenicano nolano Giordano Bruno (1548-1600) portò la rivoluzione copernicana alle estreme conseguenze: un universo infinito, senza centro, con infiniti mondi abitati, animato da un Dio immanente alla natura.
