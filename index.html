<style>
/* Layout: indice dei capitoli a sinistra come un registro d'esame; a destra le domande, una scheda per volta, con la risposta sotto ogni domanda. */
:root{
  --paper:#f4f5f1; --sheet:#ffffff; --ink:#1c2230; --muted:#5d6577; --rule:#dfe1e6;
  --lapis:#27458f; --lapis-soft:#e6ebf7;
  --ok:#24704a; --ok-soft:#e3f1e8; --ko:#a8352f; --ko-soft:#f8e6e4; --plus:#8a5a12;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --ui:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151c; --sheet:#181d26; --ink:#e7e9ee; --muted:#9aa2b2; --rule:#2a313d;
  --lapis:#93acef; --lapis-soft:#1f2a44;
  --ok:#6cc596; --ok-soft:#173326; --ko:#ef8c84; --ko-soft:#3a1d1b; --plus:#e0b066; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151c; --sheet:#181d26; --ink:#e7e9ee; --muted:#9aa2b2; --rule:#2a313d;
  --lapis:#93acef; --lapis-soft:#1f2a44;
  --ok:#6cc596; --ok-soft:#173326; --ko:#ef8c84; --ko-soft:#3a1d1b; --plus:#e0b066; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
.opt{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
header.top .wrap{padding-block:12px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{margin:0;font-size:1.35rem;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.brand span{font-family:var(--ui);font-size:.8rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--sheet)}
.seg button{font-family:var(--ui);font-size:.85rem;border:0;background:transparent;color:var(--muted);padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--lapis);color:var(--sheet)}
.tally{font-family:var(--ui);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tally b{color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:32px;margin-top:24px}
nav.index{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start;max-height:calc(100vh - 110px);overflow:auto;padding-right:4px}
nav.index h2{font-family:var(--ui);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:500}
nav.index ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
nav.index a{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:baseline;text-decoration:none;color:var(--ink);padding:7px 10px;border-radius:6px;font-size:.92rem;line-height:1.3}
nav.index a:hover{background:var(--lapis-soft)}
nav.index a[aria-current="page"]{background:var(--lapis-soft);color:var(--lapis);font-weight:600}
nav.index a small{font-family:var(--ui);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
nav.index a small.done{color:var(--ok)}
.mobile-pick{display:none}
.mobile-pick select{width:100%;font-family:var(--ui);font-size:1rem;padding:10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink)}
main{min-width:0}
.chap-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px}
.chap-head h2{margin:0;font-size:clamp(1.4rem,3vw,2rem);font-weight:600;line-height:1.15;text-wrap:balance;min-width:0}
.chap-head .meta{font-family:var(--ui);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.btn{font-family:var(--ui);font-size:.85rem;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--lapis);color:var(--lapis)}
.btn[aria-pressed="true"]{background:var(--lapis);border-color:var(--lapis);color:var(--sheet)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--lapis);outline-offset:2px}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--lapis);width:0;transition:width .3s}
ol.qs{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:18px;counter-reset:q}
li.q{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
li.q[hidden]{display:none}
.qtext{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:baseline;margin:0 0 12px;font-size:1.06rem;font-weight:600;line-height:1.4}
.qn{font-family:var(--ui);font-size:.8rem;font-weight:600;color:var(--lapis);font-variant-numeric:tabular-nums;min-width:2.4em}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;font:inherit;font-size:.98rem;line-height:1.4;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:7px;padding:8px 12px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--lapis);background:var(--lapis-soft)}
.opt .L{font-family:var(--ui);font-weight:600;font-size:.85rem;color:var(--muted);padding-top:2px}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{color:var(--ok)}
.opt.wrong{border-color:var(--ko);background:var(--ko-soft)}
.opt.wrong .L{color:var(--ko)}
.ans{margin-top:12px;padding:10px 14px;border-left:3px solid var(--ok);background:var(--paper);border-radius:0 6px 6px 0;font-size:.95rem}
.ans .verdict{font-family:var(--ui);font-weight:600;font-size:.82rem;letter-spacing:.04em;text-transform:uppercase}
.ans.is-ok .verdict{color:var(--ok)} .ans.is-ko{border-left-color:var(--ko)} .ans.is-ko .verdict{color:var(--ko)}
.ans.is-study .verdict{color:var(--lapis)} .ans.is-study{border-left-color:var(--lapis)}
.ans p{margin:4px 0 0}
.key{margin-top:32px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
.key h3{margin:0 0 4px;font-size:1.15rem}
.key p.hint{margin:0 0 12px;font-family:var(--ui);font-size:.85rem;color:var(--muted)}
.key ol{margin:0;padding-left:2.6em;columns:2 300px;column-gap:32px;font-size:.92rem}
.key li{break-inside:avoid;margin-bottom:5px}
.key li b{font-family:var(--ui)}
.key details summary{cursor:pointer;font-family:var(--ui);color:var(--lapis);font-size:.9rem}
.empty{padding:24px;text-align:center;color:var(--muted);font-family:var(--ui)}
.overview{margin-top:20px;font-family:var(--ui);font-size:.85rem;color:var(--muted)}
@media (max-width:860px){
  .grid{grid-template-columns:minmax(0,1fr);gap:16px}
  nav.index{display:none}
  header.top{position:static}
  .mobile-pick{margin-bottom:16px}
  .mobile-pick{display:block}
  li.q{padding:14px}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
details.card{margin-top:10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
details.card>summary{cursor:pointer;list-style:none;padding:9px 12px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-weight:600;font-size:.97rem}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"▸";color:var(--lapis);font-size:.8rem}
details.card[open]>summary::before{content:"▾"}
.tag{font-family:var(--ui);font-weight:500;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--lapis)}
.cbody{padding:0 14px 12px 14px;font-size:.95rem}
.cbody h4{font-family:var(--ui);font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px;font-weight:600}
.cbody h4.plus{color:var(--plus)}
.cbody ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.cbody ul.p li::marker{color:var(--plus)}
li.q.wrongcard details.card{border-color:var(--ko)}
.cards{margin-top:32px}
.cards h3,.rev h3{margin:0 0 4px;font-size:1.15rem}
.cards p.hint,.rev p.hint{margin:0 0 10px;font-family:var(--ui);font-size:.85rem;color:var(--muted)}
.rev-topic{margin-top:22px;padding-top:14px;border-top:1px solid var(--rule)}
.rev-topic .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.rev-topic .row .tally{min-width:0}
.rev-topic ol.qs{margin-top:12px}
nav.index a.rev-link{border:1px dashed var(--ko);margin-bottom:8px}
nav.index a.rev-link small{color:var(--ko)}
details.deep{margin-top:10px;border:1px solid var(--rule);border-left:3px solid var(--plus);border-radius:8px;background:var(--sheet)}
details.deep>summary{cursor:pointer;list-style:none;padding:9px 12px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-weight:600;font-size:.97rem}
details.deep>summary::-webkit-details-marker{display:none}
details.deep>summary::before{content:"▸";color:var(--plus);font-size:.8rem}
details.deep[open]>summary::before{content:"▾"}
details.deep .tag{color:var(--plus)}
.dbody{padding:0 14px 12px;font-size:.97rem;line-height:1.6}
.dbody p{margin:0;max-width:72ch}
.deeps{margin-top:32px}
.deeps h3{margin:0 0 4px;font-size:1.15rem}
.deeps p.hint{margin:0 0 10px;font-family:var(--ui);font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="brand">
      <span>Storia moderna · riassunto fino al cap. 19</span>
      <h1>Quiz di Storia Moderna</h1>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Modalità">
        <button id="m-quiz" type="button" aria-pressed="true">Quiz</button>
        <button id="m-study" type="button" aria-pressed="false">Ripasso con risposte</button>
      </div>
      <div class="tally" id="tally"></div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="grid">
    <nav class="index" aria-label="Capitoli">
      <h2>Capitoli</h2>

    </nav>
    <main>
      <div class="mobile-pick"><label class="tally" for="pick">Capitolo</label><select id="pick"></select></div>

        <button class="btn" type="button" id="t-wrong" aria-pressed="false">Solo le sbagliate</button>

        <button class="btn" type="button" id="t-next">Capitolo successivo →</button>

      <ol class="qs" id="qs"></ol>

      <section class="deeps" id="deeps"></section>
      <section class="cards" id="cards"></section>
      <section class="key" id="key"></section>
    </main>
  </div>
</div>

<script>
const RAW = {"chs":[{"id":"cap-4","t":"Cap. 4 – Economia, manifattura, trasporti e commercio","qs":[{"q":"Da quale secolo si diffusero nuovamente i mulini ad acqua, abbandonati nell'Alto Medioevo?","o":["Dal XII secolo","Dal IX secolo","Dal VI secolo","Dal XV secolo"],"a":1,"e":"Dal IX secolo tornano i mulini ad acqua; dal XII secolo si diffonde il mulino a vento (Europa settentrionale, ma anche Toscana).","k":"c4-energia","c":["k0"]},{"q":"Che cosa permetteva la camma?","o":["Di pompare l'acqua fuori dalle miniere","Di misurare la longitudine","Di fondere il ferro a 1536 °C","Di trasformare il moto rotatorio in moto alternato"],"a":3,"e":"Grazie alla camma l'energia dei mulini azionava macchinari come la gualchiera e la cartiera (XII-XIII secolo).","k":"c4-energia","c":["k0"]},{"q":"A cosa serviva la gualchiera?","o":["A segare il legname","A filare oro e argento","Alla follatura della lana, cioè battere i tessuti per renderli compatti","A produrre carta dagli stracci"],"a":2,"e":"La gualchiera follava la lana; la cartiera, con grandi magli, riduceva in pasta gli stracci macerati.","k":"c4-energia","c":["k0"]},{"q":"Quali due innovazioni assunsero particolare importanza all'inizio dell'età moderna?","o":["Il telaio meccanico e la macchina a vapore","La bussola e l'astrolabio","La camma e il mulino a vento","La stampa e la polvere da sparo"],"a":3,"e":"Stampa e polvere da sparo; nel tessile invece le tecniche cambiarono poco.","k":"c4-energia","c":["k1"]},{"q":"Grazie alla polvere da sparo, nel settore minerario dal Quattrocento si poterono scavare pozzi profondi fino a:","o":["300 metri","100 metri","50 metri","1000 metri"],"a":0,"e":"Pozzi fino a 300 metri; le ruote idrauliche toglievano l'acqua dalle gallerie. Aumentò la produzione di argento e rame.","k":"c4-energia","c":["k1"]},{"q":"Perché le società preindustriali sono definite «società fondate sul legno»?","o":["Perché il legno era la moneta di scambio","Perché il legno (e il carbone di legna) era la principale fonte di energia e materia prima","Perché i Comuni tassavano solo il legname","Perché le case erano solo di legno"],"a":1,"e":"Il legno serviva per cucinare, riscaldare, costruire edifici, mobili e navi e alimentare le manifatture.","k":"c4-energia","c":["k2"]},{"q":"Tra fine Cinquecento e inizio Seicento la scarsità di legname provocò una «crisi energetica anticipata». Il prezzo del legno (base 100 = media 1450-1650) passò da 98 (1510-1529) a:","o":["150 (1630-1649)","500 (1630-1649)","1000 (1630-1649)","250 (1630-1649)"],"a":1,"e":"Da 98 a 500; il carbone di legna aumentò di 2 volte e mezza tra 1630 e 1670.","k":"c4-energia","c":["k2"]},{"q":"Quale combustibile si usava soprattutto in Olanda nel Seicento?","o":["Torba","Carbon fossile","Petrolio","Carbone di legna"],"a":0,"e":"La torba (vegetali accumulati nelle paludi), di qualità inferiore al carbon fossile. In Inghilterra, dalla metà del XVI secolo, si aprirono miniere di carbone.","k":"c4-energia","c":["k2"]},{"q":"Perché il passaggio dal legno al carbone fu fondamentale?","o":["Perché permise di abolire le corporazioni","Perché segnò il passaggio da fonti rinnovabili a una non rinnovabile, preparando la Rivoluzione industriale","Perché il carbone era più pulito","Perché il carbone era più economico del petrolio"],"a":1,"e":"Fu una delle condizioni della futura Rivoluzione industriale inglese; nell'Ottocento si affermerà il petrolio.","k":"c4-energia","c":["k2"]},{"q":"Perché nell'età moderna è più corretto parlare di «manifattura» che di «industria»?","o":["Perché la parola industria era vietata","Perché tutto era prodotto in casa","Perché mancavano ancora concentrazione di capitale e lavoratori, macchine diffuse e divisione razionale del lavoro","Perché non esistevano lavoratori salariati"],"a":2,"e":"Fino al XVIII secolo «industria» indicava soprattutto operosità.","k":"c4-manifattura","c":["k3"]},{"q":"Quanti addetti riuniva l'Arsenale di Venezia nel Quattrocento?","o":["Più di 3.000","Circa 300","Circa 100","Circa 30.000"],"a":0,"e":"Oltre 3.000 addetti; nel 1570, quando i Turchi attaccarono Cipro, Venezia preparò 100 galere in due mesi.","k":"c4-manifattura","c":["k3"]},{"q":"Le miniere di allume dello Stato della Chiesa producevano una sostanza usata per:","o":["Fissare i colori sui tessuti e conciare le pelli","Fabbricare polvere da sparo","Produrre vetro","Coniare monete"],"a":0,"e":"Impiegavano centinaia di persone: esempio di manifattura con molti salariati.","k":"c4-manifattura","c":["k3"]},{"q":"Gobelins e Saint-Gobain erano grandi manifatture francesi, spesso finanziate dallo Stato, che producevano rispettivamente:","o":["Seta e lana","Porcellane e carta","Armi e navi","Arazzi e vetri"],"a":3,"e":"Gobelins = arazzi, Saint-Gobain = vetri: beni di lusso.","k":"c4-manifattura","c":["k3"]},{"q":"Quali figure componevano una corporazione (arte)?","o":["Signori, vassalli e servi","Mercanti, banchieri e notai","Maestri, apprendisti e garzoni","Consoli, podestà e capitani"],"a":2,"e":"Il maestro possedeva la bottega, gli apprendisti imparavano (spesso pagando), i garzoni erano salariati.","k":"c4-manifattura","c":["k4"]},{"q":"Quando furono abolite definitivamente le corporazioni?","o":["Nel 1856 al Congresso di Parigi","Con l'Editto di Nantes","Durante la Rivoluzione francese","Con la pace di Vestfalia"],"a":2,"e":"Criticate dagli illuministi nel Settecento, furono abolite durante la Rivoluzione francese.","k":"c4-manifattura","c":["k4"]},{"q":"Quale esempio dimostra l'opposizione delle corporazioni alle innovazioni a fine Seicento?","o":["A Milano contro una nuova tecnica per filare oro e argento (1 lavoratore = 20 filatrici)","A Firenze contro il fiorino","A Lione contro i telai della seta","A Venezia contro il fluyt"],"a":0,"e":"Le corporazioni milanesi ostacolarono la nuova tecnica.","k":"c4-manifattura","c":["k4"]},{"q":"Che cos'è il putting out system?","o":["Il sistema di riscossione delle imposte","La vendita degli uffici pubblici","Il lavoro nelle fabbriche accentrate","Il sistema delle manifatture disperse: il mercante-imprenditore distribuisce la materia prima ai contadini che lavorano a domicilio"],"a":3,"e":"Diffuso nei secoli XVII-XVIII soprattutto nella lana; i lavoratori erano pagati a cottimo e il ciclo durava 2-3 mesi.","k":"c4-putting","c":["k5"]},{"q":"Quale città si affermò come principale centro europeo della seta, mentre Milano, Genova e Venezia si ridimensionavano?","o":["Londra","Lione","Anversa","Amsterdam"],"a":1,"e":"Lione.","k":"c4-putting","c":["k5"]},{"q":"Le new draperies inglesi sono un esempio di:","o":["Tessuti più economici e di qualità inferiore prodotti con il lavoro rurale a domicilio","Tessuti di lusso con fili d'oro","Arazzi francesi","Navi mercantili"],"a":0,"e":"Il putting out system evitava i vincoli corporativi e costava meno.","k":"c4-putting","c":["k5"]},{"q":"Perché il putting out system è chiamato «protoindustria»?","o":["Perché nacque prima del Medioevo","Perché usava già la macchina a vapore","Perché era gestito dallo Stato","Perché in alcuni casi fu una fase di transizione verso la produzione accentrata"],"a":3,"e":"Non sempre portò alle fabbriche: rendita feudale e mancanza di iniziativa imprenditoriale lo impedirono in alcune aree.","k":"c4-putting","c":["k5"]},{"q":"Che cos'erano i portolani?","o":["Tasse portuali danesi","Funzionari dei porti","Manuali che indicavano approdi, fondali, correnti, maree e venti per la navigazione costiera","Navi olandesi"],"a":2,"e":"Dal XV secolo bussola, quadrante, astrolabio e carte nautiche permisero la navigazione in mare aperto.","k":"c4-navi","c":["k6"]},{"q":"Chi pubblicò nel 1569 un mappamondo in 18 fogli con una nuova proiezione per i navigatori?","o":["Gerhard Kremer detto Mercatore","Claudio Tolomeo","Martin Waldseemüller","Paolo dal Pozzo Toscanelli"],"a":0,"e":"Mercatore, cartografo fiammingo.","k":"c4-navi","c":["k6"]},{"q":"Quale nave era tipica del Mediterraneo fino al XVII secolo, con remi, vele latine e 25-30 banchi  e Inghilterra.","k":"c4-commercio","c":["k9"]}]},{"id":"moneta","t":"La moneta: da Carlo Magno al 1971","qs":[{"q":"Su cosa si basava la riforma monetaria di Carlo Magno (fine VIII secolo)?","o":["Bimetallismo oro-argento","Carta moneta","Monometallismo argenteo, con il denaro come moneta principale","Monometallismo aureo"],"a":2,"e":"Il denaro deriva dal denarius romano.","k":"m-sistema","c":["k10"]},{"q":"Quanto pesava il denaro di Carlo Magno e con quale lega?","o":["3,5 g, lega 24 carati","5 g, lega 900/1000","1 g, lega 500/1000","1,76 g, lega 950/1000"],"a":3,"e":"Conteneva circa 1,67 g di argento puro (il «fino»).","k":"m-sistema","c":["k10"]},{"q":"Nel sistema lira-soldo-denaro, quanti denari formavano una lira?","o":["100","240","20","120"],"a":1,"e":"12 denari = 1 soldo; 20 soldi = 1 lira; quindi 240 denari. Lira e soldo erano monete di conto.","k":"m-sistema","c":["k10"]},{"q":"In che anno Firenze coniò il fiorino d'oro e Genova il genovino?","o":["1348","1095","1252","1453"],"a":2,"e":"1252; poi Venezia il ducato e la Francia lo scudo tornese (da Tours).","k":"m-sistema","c":["k11"]},{"q":"Che cosa significa un rapporto commerciale oro/argento di 1:12?","o":["1 unità d'oro = 12 unità d'argento","12 carati d'oro","Il 12% di oro nella lega","12 unità d'oro = 1 d'argento"],"a":0,"e":"Per funzionare, il bimetallismo richiedeva un rapporto legale adeguato ai prezzi di mercato.","k":"m-sistema","c":["k11"]},{"q":"Che cos'era il signoraggio?","o":["Il prestito forzoso","Il tasso di interesse della lettera di cambio","L'imposta spettante allo Stato sulla coniazione","Il diritto feudale sulle terre"],"a":2,"e":"La zecca restituiva monete sottraendo costi di coniazione e signoraggio.","k":"m-sistema","c":["k11"]},{"q":"Dove era già in uso la carta moneta nel XIII secolo, come raccontò Marco Polo?","o":["India","Impero bizantino","Venezia","Cina"],"a":3,"e":"In Europa non era ancora diffusa.","k":"m-sistema","c":["k12"]},{"q":"La moneta bancaria nasce:","o":["Nell' o») contò nello Stato di Milano:","o":["100 monete straniere d'oro","10 monete d'oro tutte milanesi","22 monete d'oro (21 straniere) e 29 d'argento (27 straniere)","5 monete in tutto"],"a":2,"e":"Le monete di conto riportavano questa varietà a un'unica unità.","k":"m-svalutazioni","c":["k15"]},{"q":"Associa la moneta di conto al paese: la lira tornese era usata in…","o":["Germania","Francia","Inghilterra","Olanda"],"a":1,"e":"Lira tornese = Francia; lira imperiale = Germania e Italia centro-settentrionale; lira sterlina = Inghilterra; gulden = Olanda.","k":"m-svalutazioni","c":["k15"]},{"q":"Il fiorino d'oro valeva 240 denari nel 1252. Quanto valeva nel 1500?","o":["480","1680","240","3192"],"a":1,"e":"1680 nel 1500 e 3192 all'inizio del Settecento: il denaro si era svalutato.","k":"m-sistema","c":["k15"]},{"q":"Un banchiere deve restituire 4000 lire contabili. Se il fiorino sale da 20 a 40 lire, quanti fiorini restituisce?","o":["400","100","50","200"],"a":1,"e":"100: il fiorino si è rafforzato e la moneta di conto si è svalutata.","k":"m-svalutazioni","c":["k15"]},{"q":"Nel 1795 la Convenzione introdusse:","o":["Il franco d'oro","Lo scudo tornese","La lira italiana","Il franco d'argento di 5 g, lega 900/1000, diviso in centesimi"],"a":3,"e":"Sistema decimale; l'Inghilterra mantenne 1 pound = 20 shillings = 240 pence.","k":"m-contemp","c":["k16"]},{"q":"Quale sistema si affermò nel XIX secolo e durò fino alla Prima guerra mondiale?","o":["Monometallismo argenteo","Moneta fiduciaria","Monometallismo aureo, con banconote convertibili in oro","Bimetallismo"],"a":2,"e":"Nel 1803 la Francia aveva stabilito formalmente il bimetallismo.","k":"m-contemp","c":["k16"]},{"q":"Quando Nixon sospese la convertibilità del dollaro in oro (35 $ per oncia)?","o":["1° gennaio 1945","15 agosto 1944","15 agosto 1971","29 ottobre 1929"],"a":2,"e":"Da allora le monete sono fiduciarie.","k":"m-contemp","c":["k16"]}]},{"id":"cap-6","t":"Cap. 6 – La formazione dello Stato moderno","qs":[{"q ti","Direttamente da Dio","Attraverso il papa","Attraverso il popolo (per populum)"],"a":3,"e":"Il diritto divino dei re invece sosteneva che il re ricevesse direttamente da Dio l'autorità.","k":"c6-sacro","c":["k21"]},{"q":"Quali sovrani del Settecento presentarono il re come governante al servizio della collettività?","o":["Luigi XIV e Filippo II","Carlo V e Francesco I","Enrico VIII ed Elisabetta I","Federico II di Prussia e Giuseppe II d'Austria"],"a":3,"e":"Concezione più laica legata all'Illuminismo.","k":"c6-sacro","c":["k21"]},{"q":"Associa correttamente le assemblee rappresentative ai paesi:","o":["Inghilterra: Sejm; Polonia: Parlamento","Francia: Stati generali; Spagna: Cortes; Germania: Stände; Polonia: Sejm (Dieta)","Francia: Cortes; Spagna: Stati generali","Germania: Cortes; Francia: Stände"],"a":1,"e":"In Inghilterra il Parlamento.","k":"c6-assemblee","c":["k22"]},{"q":"Com'era composto il Parlamento inglese?","o":["Senato e Camera dei deputati","Una sola camera nobiliare","Camera dei Lord (nobili titolati e alto clero) e Camera dei Comuni (elettiva)","Tre camere per clero, nobiltà e terzo stato"],"a":2,"e":"Altrove le assemblee rappresentavano i tre ordini; in Polonia la Dieta era dominata dalla nobiltà, senza città e clero.","k":"c6-assemblee","c":["k22"]},{"q":"Che cosa significa «quod omnes tangit, ab omnibus adprobari debet»?","o":["A ogni re ne segue un altro","Ogni potere viene da Dio","Il re è sciolto dalle leggi","Ciò che riguarda tutti deve essere approvato da tutti (cioè dai ceti)"],"a":3,"e":"Principio dello Stato a base cetuale (Ständestaat), con dualismo istituzionale re-assemblee.","k":"c6-assemblee","c":["k22"]},{"q":"Qual era il compito principale delle assemblee cetuali?","o":["Nominare i vescovi","Comandare l'esercito","Approvare le imposte e sostenere il sovrano nei momenti difficili","Eleggere il re"],"a":2,"e":"Elemento decisivo: la periodicità delle riunioni.","k":"c6-assemblee","c":["k22"]},{"q":"Quali organi si separarono già t ura tra Medioevo e Rinascimento?","o":["Hamilton","Jakob Burckhardt, «La civiltà del Rinascimento in Italia»","Jacques Le Goff","Giorgio Vasari"],"a":1,"e":"Le Goff (Il tempo continuo della storia, 2014; trad. it. 2016) propose un «lungo Medioevo» fino a metà XVIII secolo.","k":"c9-filologia","c":["k40"]},{"q":"Qual è la vera novità dell'Umanesimo secondo il testo?","o":["L'invenzione della stampa","Aver scoperto Aristotele","Il metodo: la filologia, analisi critica e storica dei testi (restauratio)","La scoperta dell'America"],"a":2,"e":"Gli autori antichi vanno compresi nel loro contesto storico.","k":"c9-filologia","c":["k40"]},{"q":"Nel 1440 Lorenzo Valla dimostrò che la Donazione di Costantino era falsa. Quando sarebbe stata elaborata secondo Valla?","o":["Nel 1054","Nel 314","Nel XII secolo","Tra VIII e IX secolo, dalla curia romana"],"a":3,"e":"Il documento diceva che Costantino nel 314 avesse dato a papa Silvestro I poteri su Roma, Italia e Occidente.","k":"c9-filologia","c":["k40"]},{"q":"Il corsivo italico è detto «aldino» da:","o":["Aldo Manuzio, tipografo veneziano","Aldo Moro","Aldobrandini","Alberti"],"a":0,"e":"Gli umanisti prendevano a modello il latino di Cicerone; forma letteraria tipica: il dialogo platonico.","k":"c9-filologia","c":["k40"]},{"q":"Secondo Vasari (Vite, 1550) il percorso verso l'arte rinascimentale parte da:","o":["Raffaello","Leonardo","Giotto, poi Masaccio, Piero della Francesca, Brunelleschi","Michelangelo"],"a":2,"e":"Vasari, Vite de' più eccellenti pittori, scultori e architettori, 1550.","k":"c9-arte","c":["k41"]},{"q":"Chi elaborò la prospettiva e chi la spiegò nel De pictura (1436)?","o":["Giotto e Petrarca","Leonardo e Vasari","Brunelleschi la elaborò, Alberti la spiegò","Masaccio e Filarete"],"a":2,"e":"Piramide visiva e punto di fuga: il pittore deve conoscere la geometria.","k":"c9-arte","c":["k41"]},{"q":"Sforzinda, la città ideale a stella a 16 lati, fu progettata da:","o":["Brunelleschi","Filarete (Trattato di archit ","Augusta 1555","Vervins 1598"],"a":1,"e":"Dichiarata all'Aia nel 1581.","k":"x-imperi","c":["k221"]},{"q":"Quale trattato divideva il mondo tra Spagna e Portogallo spostando la raya più a ovest?","o":["Saragozza","Inter caetera","Tordesillas 1494","Lione 1504"],"a":2,"e":"La bolla Inter caetera era del 1493.","k":"x-imperi","c":["k221"]},{"q":"Quale delle seguenti rivolte NON fu contro il dominio o il fisco spagnolo?","o":["Alpujarras 1568","Fronda in Francia","Comuneros 1520-1521","Masaniello 1647"],"a":1,"e":"La Fronda fu francese (citata nel cap. 18 tra le rivolte di metà secolo).","k":"x-imperi","c":["k225"]},{"q":"Abbina gli editti/trattati religiosi: Saint-Germain 1562, Nantes 1598, Lettera di maestà 1609.","o":["Germania; Francia; Ungheria","Francia; Olanda; Austria","Inghilterra; Francia; Boemia","Francia; Francia; Boemia"],"a":3,"e":"Pace di Augusta 1555 (Impero); editto di restituzione 1629 (Impero).","k":"x-istituzioni","c":["k223"]},{"q":"Quale di questi papi è associato all'Indice dei libri proibiti (1559)?","o":["Paolo IV Carafa","Paolo III","Gregorio XIII","Pio IV"],"a":0,"e":"Paolo III: Sant'Uffizio 1542 e apertura di Trento 1545.","k":"x-istituzioni","c":["k226"]}]}],"tp":[{"id":"c4-energia","ch":"cap-4","t":"Tecnologia ed energia preindustriale","s":["Mulini ad acqua di nuovo diffusi dal IX secolo; mulino a vento dal XII (Nord Europa, ma anche Toscana).","La camma trasforma il moto rotatorio in alternato: aziona gualchiere (follatura della lana) e cartiere (XII-XIII sec.).","Inizio età moderna: stampa e polvere da sparo; la polvere permette pozzi minerari fino a 300 m (più argento e rame); altiforni in muratura per il ferro (fusione a circa 1536 °C).","Società «fondate sul legno»: tra fine '500 e inizio '600 crisi energetica anticipata (prezzo del legno da 98 a 500; carbone di legna ×2,5 tra 1630 e 1670).","Soluzione: carbon fossile in Inghilterra (miniere dalla metà del XVI sec.), torba in Olanda. Passaggio da fonte rinnovabile a non rinnovabile → premessa della Rivoluzione industriale; nell'Ottocento arriva il petrolio."],"p":["La Rivoluzione industriale inglese si colloca convenzionalmente nella seconda metà del Settecento, con la macchina a vapore perfezionata da James Watt (brevetto 1769)."]},{"id":"c4-manifattura","ch":"cap-4","t":"Manifattura e corporazioni","s":["Si parla di manifattura, non di industria: mancano concentrazione di capitale e lavoratori, macchine diffuse, divisione razionale del lavoro.","Produzione domestica nelle campagne; domanda di lusso da ceti agiati; lo Stato chiede armi e rifornimenti.","Grandi concentrazioni: miniere di allume dello Stato della Chiesa (fissare colori, conciare pelli), Arsenale di Venezia (oltre 3.000 addetti nel '400; nel 1570 cento galere in due mesi contro i Turchi a Cipro); in Francia Gobelins (arazzi) e Saint-Gobain (vetri).","Corporazioni (arti): maestri (bottega), apprendisti (pagano per imparare), garzoni (salariati). Monopolio, controllo di qualità, prezzi e salari; funzioni sociali (santo patrono, assistenza).","Criticate dagli illuministi (es. Milano fine '600 contro la filatura di oro e argento: 1 lavoratore = 20 filatrici); abolite durante la Rivoluzione francese."],"p":["In Francia l'abolizione delle corporazioni fu decisa nel 1791 con le leggi d'Allarde e Le Chapelier."]},{"id":"c4-putting","ch":"cap-4","t":"Putting out system e protoindustria","s":["Artigianato subordinato già nel basso Medioevo: il mercante anticipa la materia prima e vende il prodotto.","Secoli XVII-XVIII, soprattutto nella lana: il mercante-imprenditore distribuisce la materia prima ai contadini che filano e tessono a casa, pagati a cottimo (ciclo di 2-3 mesi). Agenti consegnano e ritirano.","Vantaggi: flessibilità, aggira le corporazioni, manodopera rurale economica → tessuti meno pregiati ma economici (new draperies inglesi).","Conseguenza: crisi delle manifatture urbane fiamminghe e italiane; Lione diventa il centro europeo della seta; Milano e Venezia ripiegano sul lusso.","È detto protoindustria perché a volte prepara la fabbrica accentrata (telai meccanici costosi, sistemi troppo grandi da coordinare)."],"p":[]},{"id":"c4-navi","ch":"cap-4","t":"Navigazione, navi e pirateria","s":["Dal portolano (navigazione costiera) alla navigazione in mare aperto dal XV sec.: bussola, quadrante, astrolabio, carte nautiche. Mercatore (Gerhard Kremer) pubblica nel 1569 un mappamondo in 18 fogli.","Galea (Mediterraneo fino al XVII sec.): remi, vele latine, fino a 50 m; ideale in guerra (a Lepanto circa 400 uomini per nave).","Caravella portoghese (20-30 m): veloce, equipaggio ridotto, ideale per esplorare. Galeone: due ponti, quattro alberi, artiglierie, guerra e commercio. Fluyt olandese (fine XVI sec.): grande stiva, pochi marinai, noli bassi.","Pirateria vs guerra di corsa (autorizzata dallo Stato con lettere di corsa). Filibustieri e bucanieri contro i galeoni spagnoli. Abolizione francese 1792 (ma poi Surcouf); abolizione internazionale al Congresso di Parigi del 1856."],"p":["Il Congresso di Parigi del 1856 chiuse la guerra di Crimea; la Dichiarazione di Parigi sul diritto marittimo, firmata nella stessa occasione, abolì la guerra di corsa."]},{"id":"c4-commercio","ch":"cap-4","t":"Commercio: dal Mediterraneo all'Atlantico","s":["Inizio età moderna: seta e spezie (pepe, zenzero, chiodi di garofano, cannella, noce moscata) arrivano via golfo Persico e mar Rosso a Tripoli, Beirut, Alessandria; poi su navi veneziane e genovesi.","Nord: Lega anseatica (Amburgo, Lubecca, Brema, Danzica, Riga), in declino dal XV sec.; nel 1535 Lubecca sconfitta dalla Svezia.","Seicento: dominio olandese nel Baltico (legname, segale, ferro svedese, pellicce russe); dazi danesi al Sund. Dalla seconda metà del '600 sale l'Inghilterra (un terzo delle navi al Sund nel 1771-1778). Rotta fino ad Arcangelo sul Mar Bianco.","1498: i portoghesi arrivano in India. Venezia regge per tutto il '500, declina a fine secolo (concorrenza olandese e inglese, anche via Livorno).","Bilancia con l'Asia passiva: si paga in argento. America: oro e argento a Siviglia, poi zucchero, tabacco, legni pregiati. Il baricentro economico si sposta dal Mediterraneo all'Atlantico."],"p":[]},{"id":"m-sistema","ch":"moneta","t":"Il sistema monetario medievale","s":["Riforma di Carlo Magno (fine VIII sec.): monometallismo argenteo. Il denaro pesa 1,76 g, lega 950/1000 (circa 1,67 g di fino).","Monete di conto: 12 denari = 1 soldo; 20 soldi = 1 lira (240 denari).","Dall'XI sec. il grosso d'argento; nel 1252 fiorino (Firenze) e genovino (Genova) d'oro; poi ducato veneziano e scudo tornese (da Tours) → bimetallismo.","Serve un rapporto legale oro/argento (es. 1:12); la zecca trattiene costi e signoraggio (imposta dello Stato).","In Cina la carta moneta esisteva già nel XIII sec. (Marco Polo)."],"p":["Il ducato d'oro veneziano fu coniato per la prima volta nel 1284; in seguito fu chiamato anche «zecchino»."]},{"id":"m-banca","ch":"moneta","t":"Moneta bancaria e lettera di cambio","s":["XII sec., Italia: i banchieri accettano depositi, rilasciano ricevute, prestano parte del denaro (credito); poi anche gli orefici inglesi.","Le ricevute girate diventano biglietti di banca (moneta bancaria).","Lettera di cambio (seconda metà XII sec.): atto notarile con cui si paga in un'altra città, spesso in altra moneta e con interesse → niente trasporto di contante, meno rischi."],"p":[]},{"id":"m-prezzi","ch":"moneta","t":"La rivoluzione dei prezzi","s":["Fine '400: nuove miniere d'argento in Europa centrale; XVI sec.: grande afflusso di argento americano → inflazione fino ai primi decenni del '600.","Hamilton (1934, American Treasure and the Price Revolution in Spain) collega argento e prezzi. Teoria quantitativa di Fisher (1909): prezzi = moneta × velocità / beni.","Obiezioni: aumento medio solo del 2% annuo, società in gran parte autosufficiente, molto argento finito in Asia, inflazione iniziata prima di Potosí (1540 nel cap. 4; 1545 nel cap. 10).","Spiegazione più completa: crescita demografica + massa monetaria. I cereali quadruplicano quasi di prezzo, più dei salari."],"p":["Storicamente Potosí si trova nell'attuale Bolivia (allora Alto Perù, parte del vicereame del Perù): così si spiega perché il riassunto la colloca una volta «in Perù» e una volta «in Bolivia». La data della scoperta comunemente indicata è il 1545."]},{"id":"m-svalutazioni","ch":"moneta","t":"Svalutazioni, Gresham e monete di conto","s":["Tosatura (limatura dei bordi) → dal Seicento bordo zigrinato. I sovrani svalutano aggiungendo metallo vile.","Legge di Gresham (XVI sec.): la moneta cattiva scaccia quella buona.","Dante accusa Filippo IV il Bello (re 1285-1314) di falsificare la moneta (Paradiso XIX, 119). Ma le svalutazioni potevano anche contrastare deflazione e scarsità di moneta.","Moneta grossa (commercio) e piccola (spese quotidiane): biglione, poi rame → moneta divisionaria fiduciaria.","Monete di conto: lira tornese (Francia), lira imperiale (Germania e Italia centro-nord), lira sterlina (Inghilterra), gulden (Olanda). Beccaria (1762): a Milano 22 monete d'oro (21 straniere) e 29 d'argento (27 straniere).","Il fiorino: 240 denari (1252) → 1680 (1500) → 3192 (inizio '700). Se la moneta reale sale, quella di conto si svaluta (esempio delle 4000 lire: fiorino a 40 lire = 100 fiorini)."],"p":[]},{"id":"m-contemp","ch":"moneta","t":"Dal franco al 1971","s":["1795: la Convenzione crea il franco d'argento (5 g, 900/1000), decimale; si diffonde con le conquiste francesi. L'Inghilterra resta a 1 pound = 20 shillings = 240 pence.","1803: bimetallismo francese formale; nell'Ottocento monometallismo aureo (banconote convertibili in oro) fino alla Prima guerra mondiale.","Dopo la Seconda guerra mondiale il dollaro è l'unica grande moneta convertibile (35 $ per oncia); il 15 agosto 1971 Nixon sospende la convertibilità: nasce la moneta fiduciaria."],"p":["Il sistema del dollaro convertibile fu stabilito dagli accordi di Bretton Woods del 1944.","Il Regno Unito è passato al sistema decimale (1 sterlina = 100 pence) nel 1971."]},{"id":"c6-concetto","ch":"cap-6","t":"Stato di antico regime e sovranità","s":["Medioevo: potere frammentato tra re, feudatari, Chiesa, città. Dall'XI sec. il diritto romano rilancia l'imperium.","Dalla metà del XV sec. i re rafforzano il centro: nascono gli Stati di antico regime (con privilegi dei ceti, diritti feudali, concezione patrimoniale).","1513 Machiavelli, Il Principe (repubbliche e principati; «Stato»); 1576 Bodin, Les six livres de la République (sovranità = fare leggi senza consenso); 1589 Botero, Della Ragion di Stato; Hobbes usa «Commonwealth».","Il re è legibus solutus («car tel est notre plaisir»), ma rispetta diritto naturale, legge divina e leggi fondamentali (es. legge salica: niente donne sul trono di Francia)."],"p":[]},{"id":"c6-sacro","ch":"cap-6","t":"Monarchia patrimoniale e sacra","s":["Il territorio è patrimonio della dinastia (es. Carlo V non cede i Paesi Bassi dopo la pace di Crépy, 1544). Confini sovrapposti; confine moderno solo dopo il 1789. Nazione non ancora in senso moderno.","Sacre a Reims (memoria del battesimo di Clodoveo, Natale 496): unzione in nove punti con l'olio della Santa Ampolla; comunione sotto le due specie; anello = matrimonio re-regno; corpo mistico.","Re taumaturghi: toccano gli scrofolosi («Il re ti tocca, Dio ti guarisce»): Luigi XV nel 1722 circa 2000 malati; ultimo rito nel 1824 con Carlo X.","«Il re è morto, viva il re» / «a rey muerto, rey puesto». Omnis potestas a Deo: per Tommaso d'Aquino il potere passa per populum; per il diritto divino viene direttamente da Dio. Nel '700 Federico II di Prussia e Giuseppe II: il re al servizio della collettività."],"p":[]},{"id":"c6-assemblee","ch":"cap-6","t":"Assemblee cetuali e corte","s":["Dualismo istituzionale: re + assemblee dei ceti (clero, nobiltà, terzo stato). Nomi: Stati generali (Francia), Cortes (Spagna), Stände (Germania), Parlamento (Inghilterra), Sejm o Dieta (Polonia).","Inghilterra: Lord (nobili e alto clero) e Comuni (elettiva). Polonia: Dieta nobiliare senza città e clero.","Funzione principale: approvare le imposte. Principio: quod omnes tangit ab omnibus adprobari debet. Stato a base cetuale (Ständestaat). Conta la periodicità delle riunioni.","Rinascimento: la corte fissa (cortigiani, etichetta, «cortese») è centro simbolico; già tra XI e XIV sec. si separano cancelleria e supremi tribunali."],"p":[]},{"id":"c6-moderno","ch":"cap-6","t":"Lo Stato moderno e la sua crisi","s":["Con la Rivoluzione francese (1789): uguaglianza giuridica, legge generale e astratta, nazione come base della legittimità.","Ottocento: sovranità su territorio definito, monopolio legittimo della forza, diritto uniforme, amministrazione distinta da chi governa; lo Stato è persona giuridica.","Hegel (1821): società civile = sfera degli interessi economici; Stato = realtà superiore. Marx: lo Stato esprime il potere della classe dominante.","Oggi: globalizzazione, finanza, terrorismo, nucleare, ambiente superano i confini → crisi della sovranità."],"p":["La definizione dello Stato come detentore del «monopolio dell'uso legittimo della forza» è del sociologo Max Weber (La politica come professione, 1919)."]},{"id":"s-diplomazia","ch":"stato-moderno","t":"Diplomazia permanente","s":["Dopo la pace di Lodi (1454) gli Stati italiani mantengono l'equilibrio con ambasciatori stabili; Venezia è il modello (relazioni al Senato).","Inizio '500: Francesco I estende la rete francese (anche presso il sultano, Svezia, Danimarca, Ungheria); il papa invia i nunzi. Regole di precedenza e cerimoniale."],"p":[]},{"id":"s-guerra","ch":"stato-moderno","t":"La rivoluzione militare","s":["Declino della cavalleria pesante (Azincourt 1415, arcieri inglesi); eserciti interarmi.","Fanteria svizzera: quadrati di picchieri (picche oltre 5 m, fino a 6000 uomini). Lanzichenecchi di Massimiliano d'Asburgo (fine '400). Tercios spagnoli dal 1496 (circa 3000 uomini: 2/3 armi da fuoco, 1/3 picche; molti hidalgos).","Artiglieria dalla seconda metà del '400 → fine dei castelli, fortezze bastionate (mura basse e spesse, forme poligonali), guerra d'assedio.","Marignano 1515: Francesco I con artiglieria e lanzichenecchi batte gli Svizzeri del duca di Milano.","Armi: schioppo → archibugio → moschetto (metà XVI sec.). Ariosto: «maladetto, abominioso ordigno». Fuoco a salve olandese (fine '500); baionetta (fine '600); picche sparite a inizio '700.","Eserciti permanenti: almeno 100.000 uomini nella prima metà del '600 → servono tasse regolari."],"p":["Marignano è ricordata come «battaglia dei giganti», definizione attribuita al condottiero Gian Giacomo Trivulzio, che vi combatté per la Francia."]},{"id":"s-chiesa","ch":"stato-moderno","t":"Re e Chiesa","s":["Il re di Francia è «cristianissimo», i sovrani spagnoli «re cattolici» (per Granada).","Leone X dà a Enrico VIII il titolo di Defensor fidei per uno scritto contro Lutero; revocato dopo lo scisma del 1534, nel 1544 il Parlamento gli riconosce «Defender of the Faith».","Nei paesi cattolici i re rivendicano jus circa sacra (intervenire), jus inspectionis (controllare), jus reformandi (correggere gli abusi), il placet sugli atti papali, le nomine e un contributo dai beni ecclesiastici."],"p":["Il titolo «Defender of the Faith» (F.D. o Fid. Def.) compare ancora oggi nella titolatura dei sovrani britannici e sulle monete."]},{"id":"s-governo","ch":"stato-moderno","t":"Organi di governo, venalità, fisco","s":["Consigli ristretti: Privy Council (Inghilterra), Conseil d'en haut (Francia), Consejo de Estado (Spagna), Consiglio segreto (Germania); segretari di Stato → ministro moderno. Commissari regi; governatorati sopravvissuti.","Venalità delle cariche (soprattutto Francia): nel 1604 regolata l'ereditarietà (la paulette, cap. 16) → nobiltà di toga, mobilità sociale del Terzo Stato.","Lepanto, 7 ottobre 1571: vittoria cristiana sugli Ottomani (ruolo dei tercios). Vestfalia 1648: due trattati, Stati eguali per dignità.","Fisco: imposte da straordinarie a regolari; dirette approssimative (testatico = persone, focatico = famiglie), indirette appaltate a finanzieri; gabella del sale diversa per provincia (Bretagna esente); catasti nel '700."],"p":["Il conte-duca di Olivares fu il favorito (valido) di Filippo IV, non di Filippo III, e governò dal 1621 al 1643: lo conferma anche il cap. 16 del riassunto. Il favorito di Filippo III fu il duca di Lerma."]},{"id":"c9-origini","ch":"cap-9","t":"Origini dell'Umanesimo","s":["Italia, Trecento-Quattrocento: studia humanitatis (grammatica, letteratura, retorica). Petrarca (1304-1374) precursore; conia media aetas.","Intellettuali laici nelle città ricche; Umanesimo civile a Firenze: Salutati (1331-1406), Bruni (1370-1444), Bracciolini (1380-1439).","Con le signorie nasce il mecenatismo: Gonzaga (Mantova), Este (Ferrara), Montefeltro (Urbino); fine '400 Roma papale.","Ideali: Leon Battista Alberti (1404-1472), uomo completo; Castiglione, Il Cortegiano (1528), uomo di corte capace di dissimulare."],"p":[]},{"id":"c9-classici","ch":"cap-9","t":"Riscoperta dei classici e stampa","s":["Bracciolini trova il De rerum natura di Lucrezio a San Gallo. 1397: prima cattedra di greco a Firenze (Crisolora, su iniziativa di Salutati); 1423 Aurispa porta 238 manoscritti.","Ficino traduce Platone; Accademia platonica nella villa di Careggi donata da Cosimo de' Medici.","Xilografia dalla Cina (XIV sec.); Gutenberg a Magonza: caratteri mobili; Bibbia a 42 linee (1454-1455). Incunaboli (prima del 1500): 10-20 milioni di copie."],"p":["Della Bibbia di Gutenberg si stima che siano state stampate circa 180 copie, su carta e su pergamena."]},{"id":"c9-filologia","ch":"cap-9","t":"Filologia e continuità col Medioevo","s":["Burckhardt (1860): netta rottura col Medioevo. Le Goff (Il tempo continuo della storia, 2014): «lungo Medioevo» fino a metà '700.","La novità è il metodo: filologia (restauratio del testo), autori letti nel loro contesto.","Valla (1440) dimostra falsa la Donazione di Costantino (che parlava del 314 e di papa Silvestro I): redatta dalla curia tra VIII e IX sec.","Modello: latino di Cicerone; corsivo «aldino» di Aldo Manuzio; forma tipica: il dialogo."],"p":[]},{"id":"c9-arte","ch":"cap-9","t":"Arte e città ideale","s":["Vasari (Vite, 1550): da Giotto a Masaccio, Piero della Francesca, Brunelleschi.","Prospettiva: inventata da Brunelleschi, spiegata da Alberti nel De pictura (1436): piramide visiva, punto di fuga, geometria. Nasce il ritratto autonomo.","Alberti, De re aedificatoria (1452). Filarete, Trattato (1461-1464): Sforzinda, città a stella a 16 lati per Francesco Sforza."],"p":[]},{"id":"c9-uomo","ch":"cap-9","t":"Uomo, natura, scienza","s":["Pico della Mirandola, De dignitate hominis (1486): l'uomo artefice di sé. Thomas More, Utopia (1516): niente proprietà né denaro, 6 ore di lavoro (Amauroto, Anidro, Itlodeo).","Ermetismo (Ermete Trismegisto/Thot): Ficino traduce il Corpus hermeticum (1463); astrologia, alchimia; separazione dalla scienza con i Principia di Newton (1687).","Cusano (1440): universo infinito senza centro. Geocentrismo aristotelico-tolemaico (II sec. d.C.); Copernico, De revolutionibus (1543).","Leonardo: «la sapienza è figliola della sperienza» (ma senza metodo sistematico). Machiavelli: «verità effettuale», virtù e fortuna."],"p":["Copernico morì nel 1543, lo stesso anno in cui fu stampato il De revolutionibus."]},{"id":"c9-erasmo","ch":"cap-9","t":"Erasmo da Rotterdam","s":["Massimo umanista europeo: Umanesimo cristiano. Sacerdote nel 1492; formato dai Fratelli della Vita comune (Devotio moderna, Tommaso da Kempis).","1505: pubblica le Annotationes di Valla al Nuovo Testamento; 1516: Novum instrumentum (testo greco + latino + note) → critica biblica moderna.","Elogio della follia (Stultitiae laus), 1511, concepito nel 1509, dedicato a Thomas More (gioco moria/More): satira di principi, teologi, papi.","Colloquia (1522): critica a reliquie, digiuni, pellegrinaggi. Cristianesimo etico ed elitario."],"p":[]},{"id":"c10-portogallo","ch":"cap-10","t":"Espansione portoghese in Africa","s":["Cause: spezie, Costantinopoli ottomana (1453), Geografia di Tolomeo in latino (1410), progressi nautici.","Portogallo (dinastia Aviz dal 1385): Ceuta 1415, Madera, Azzorre, capo Bojador 1434, Senegal, Sierra Leone, Guinea; Enrico il Navigatore a Sagres; Cadamosto e Usodimare sul Gambia fino a Cantor.","Obiettivo iniziale: oro, avorio e schiavi del commercio transahariano; Costa d'oro (Ghana) nel 1471. Bolle di Niccolò V e Callisto III (1451, 1455, 1456).","Giovanni II (1481-1495) punta alle Indie: Bartolomeu Dias doppia il capo di Buona Speranza nel 1487. Leggenda del prete Gianni (Etiopia)."],"p":[]},{"id":"c10-colombo","ch":"cap-10","t":"Colombo e la spartizione del mondo","s":["Colombo (1451-1506), genovese: verso ovest. Sostegno teorico di Toscanelli (1474). Errori: 60° tra Canarie e Cipango, 40 miglia per grado. Rifiutato da Giovanni II, accolto dai Re cattolici.","Capitolazioni 17 aprile 1492; partenza da Palos il 3 agosto (Niña, Pinta, Santa Maria, circa 120 uomini); 12 ottobre: San Salvador (Bahamas), poi Cuba e Hispaniola.","Altri viaggi: 1493-96 (17 navi, Caraibi), 1498-1500 (Orinoco, Venezuela), 1502-04 (America centrale). Arrestato nel 1500, morì nel 1506 convinto di essere in Asia.","Inter caetera (maggio 1493, Alessandro VI): raya 100 leghe a ovest di Capo Verde. Tordesillas (1494): linea spostata 270 leghe più a ovest → il Brasile al Portogallo."],"p":["Sommando le misure, la linea di Tordesillas passava 370 leghe a ovest delle isole di Capo Verde.","Durante il primo viaggio, dopo il naufragio della Santa Maria, Colombo lasciò a Hispaniola un piccolo forte, La Navidad."]},{"id":"c10-esplor","ch":"cap-10","t":"Caboto, Verrazzano, Vespucci, Balboa, Magellano","s":["Caboto (1497, per l'Inghilterra): Terranova. Verrazzano (1524, per Francesco I): coste nordamericane.","Vespucci: viaggi 1499-1500 (Spagna) e 1501-1502 (Portogallo); capisce che è un nuovo continente; Mundus novus (1503); Waldseemüller lo chiama America (1507).","Balboa attraversa l'istmo di Darién (1513): Mare del Sud (Pacifico).","Magellano, per Carlo V: Siviglia settembre 1519, 5 navi e 270 uomini; Patagonia marzo 1520; stretto ottobre 1520; Filippine marzo 1521 (muore); Molucche novembre 1521; la Victoria torna nel settembre 1522 con meno di 20 uomini. Pigafetta: un giorno perso. 1529: Carlo V rinuncia alle Molucche."],"p":["La Victoria rientrò in Spagna guidata da Juan Sebastián Elcano.","La rinuncia del 1529 alle Molucche fu sancita dal trattato di Saragozza tra Spagna e Portogallo."]},{"id":"c10-imperoport","ch":"cap-10","t":"L'impero commerciale portoghese","s":["Vasco da Gama: parte nel luglio 1497 (4 navi, 170 uomini), pilota arabo a Malindi, Calicut nel maggio 1498, ritorno nel 1499.","Cabral (1500, 13 navi): Brasile («Terra della vera croce»), poi India (alleanza con Cochin contro Calicut).","Manuele I (1495-1521): alleanze con Congo, Malindi, Mozambico; Mombasa rasa al suolo. Diu (2 febbraio 1509): vittoria contro Gujarat, mamelucchi e Calicut.","Albuquerque: Goa 1510, Malacca 1511, Hormuz 1515; poi Ceylon, Molucche, Giappone (1543), Macao (1557).","Impero commerciale e marittimo (max circa 15.000 portoghesi in India): centro Goa, carreira da India, Casa da India di Lisbona, spezie ad Anversa, lasciapassare cartazes; mai presa Aden."],"p":[]},{"id":"c10-conquista","ch":"cap-10","t":"Conquistadores: Aztechi e Inca","s":["Dal 1495 iniziativa privata (10% alla corona). Caraibi (Hispaniola, Cuba), poi Maya nello Yucatán (1513).","Cortés (1485-1547): febbraio 1519, 11 navi, 500 soldati, 16 cavalli; Veracruz; interpreti (Malinche); Moctezuma II prigioniero; rivolta di Cuitláhuac; noche triste 30 giugno 1520; aiuto di Tlaxcala e vaiolo; caduta di Tenochtitlán il 13 agosto 1521 → Città del Messico.","Pizarro: da Panama nel gennaio 1531 (180 uomini); cattura Atahualpa a Cajamarca (15 novembre 1532), lo fa strangolare (agosto 1533); Cuzco presa nel novembre 1533; Lima fondata nel 1535. Rivolta di Manco Cápac (1536); Túpac Amaru decapitato nel 1572.","Cause della conquista: armi e cavalli, alleati indigeni, conflitti interni, epidemie, fattori religiosi (Quetzalcoatl, imperatore inca figlio del Sole)."],"p":["Diego de Almagro fu giustiziato nel 1538 (il riassunto indica «1530»); Pizarro fu ucciso a Lima nel 1541 dai seguaci di Almagro il Giovane, coerentemente con i «tre anni dopo» del testo.","Tenochtitlán sorgeva su un'isola del lago Texcoco, collegata alla terraferma da strade rialzate."]},{"id":"c10-impsp","ch":"cap-10","t":"Organizzazione dell'impero spagnolo","s":["Dalla California e Florida al Cile (esclusi gli Araucani): Regno delle Indie, dipendente dalla corona di Castiglia.","Casa de Contratación di Siviglia (1503): controllo di merci e persone; Consiglio delle Indie (1524); vicereami di Nuova Spagna (1529) e Perù (1542); giustizia alle audiencias.","Encomienda (dalla Reconquista): all'encomendero lavoro e tributi degli indios, in cambio di protezione, evangelizzazione e servizio militare; terre al re, mai vero feudo.","Circa 250.000 emigrati nel XVI sec.; matrimoni misti dal 1514. Creoli, meticci, mulatti, zambos; schiavi africani."],"p":[]},{"id":"c10-economia","ch":"cap-10","t":"Economia e catastrofe demografica","s":["Colombo porta semi e animali europei; allevamento più dell'agricoltura; vite e olivo sulle Ande; canna da zucchero ai Caraibi → schiavi africani.","Dall'America: mais, patate, zucchine, zucca, pomodoro, peperoni, girasole, ananas, cacao, tabacco (dal XVII sec. su larga scala); coca andina.","Potosí (1545, Bolivia, oltre 100.000 abitanti); mercurio dal 1555; lavoro forzato della mita; convogli scortati da galeoni.","Crollo demografico: Denevan (1992) 25 milioni in Messico-Caraibi e 18 nelle Ande; Livi Bacci: da 42 (1500) a 13 milioni (1600). Sifilide nell'esercito di Carlo VIII a Napoli (1495)."],"p":[]},{"id":"c10-evang","ch":"cap-10","t":"Evangelizzazione e difesa degli indios","s":["Conquista come crociata, conversioni forzate e battesimi di massa. Padroado real portoghese; Inquisizione in Portogallo nel 1531 (Asia dal 1560). Patronato universale spagnolo (22 diocesi, decima).","1536: Paolo III riconosce gli indios come uomini. 1542: Brevissima relazione di Las Casas e Nuove leggi di Carlo V (rivolta in Perù).","Disputa di Valladolid: Las Casas (persuasione) contro Sepúlveda (guerra ai «barbari»); Vitoria: guerra giusta solo per respingere un'offesa.","Montaigne, Essais (1580): relativismo culturale, «buon selvaggio». Wachtel: la conquista vista dai vinti."],"p":["La disputa di Valladolid si svolse nel 1550-1551."]},{"id":"r-premesse","ch":"riforma","t":"Le premesse della Riforma","s":["Scisma d'Occidente (1378-1417), chiuso dal Concilio di Costanza (1414-1417) con Martino V. Conciliarismo: concilio sopra il papa.","Centralizzazione della Curia, cumulo di benefici, annate (rendite del primo anno): malcontento in Germania. Gravamina Germanicae nationis (1511, Massimiliano).","Precursori: Wyclif (1330-1384, lollardi); Jan Hus, bruciato a Costanza nel 1415 (Scrittura, predicazione in ceco, comunione sub utraque specie). Erasmo critica il formalismo."],"p":[]},{"id":"r-lutero","ch":"riforma","t":"Lutero: dalla salvezza alla rottura","s":["Lutero nasce a Eisleben nel 1483; diritto a Erfurt; nel 1505 agostiniano; sacerdote nel 1507; docente a Wittenberg. Dalla Lettera ai Romani: giustificazione per sola fede.","Indulgenze: Alberto di Hohenzollern indebitato con i Fugger per l'arcivescovado di Magonza; ricavato anche per San Pietro. 31 ottobre 1517: 95 tesi.","1520: Alla nobiltà cristiana della nazione tedesca; La cattività babilonese della Chiesa (sacramenti); La libertà del cristiano. Sola scriptura, sacerdozio universale, solo battesimo ed eucaristia (presenza reale), no purgatorio né celibato.","Bolla Exsurge Domine (luglio 1520), bruciata. Dieta di Worms (17 aprile 1521): non ritratta; bandito, protetto da Federico il Saggio nella Wartburg, traduce la Bibbia."],"p":["Nel 1525 Lutero sposò l'ex monaca Katharina von Bora.","Lutero morì nel 1546 a Eisleben, la città dove era nato."]},{"id":"r-sociale","ch":"riforma","t":"Cavalieri, contadini ed Erasmo","s":["1522: Franz von Sickingen attacca Treviri e perde.","Guerra dei contadini (1524-1525), dalla Svevia ad Alsazia, Svizzera, Tirolo, Stiria; Dodici articoli (febbraio 1525); ala radicale di Müntzer, sconfitta a Frankenhausen (1525). Lutero sta con i principi → Chiesa territoriale.","Erasmo, De libero arbitrio (1524) contro Lutero, De servo arbitrio (1525)."],"p":[]},{"id":"r-zwingli","ch":"riforma","t":"Zwingli e Calvino","s":["Zwingli (1484-1531): Zurigo dal 1519; culto spoglio; eucaristia come commemorazione. Cantoni cattolici Uri, Svitto, Untervaldo. Marburgo (1529) senza accordo con Lutero; muore a Kappel (11 ottobre 1531); successore Bullinger; accordo Zurigo-Ginevra 1549.","Calvino (Noyon 1509 - Ginevra 1564): lascia la Francia nel 1534; Institutio a Basilea (1536; in francese 1541); Ginevra con Farel, espulso nel 1538 (Strasburgo), richiamato nel 1541; cittadino solo nel 1559.","Dottrina: doppia predestinazione, vocazione (Beruf), eucaristia come comunione spirituale. Weber (1920): etica protestante e capitalismo.","Ordonnances (1541): pastori, dottori, diaconi, anziani; Concistoro; «bibliocrazia»; Serveto al rogo nel 1553."],"p":[]},{"id":"r-diffusione","ch":"riforma","t":"Diffusione: Germania, Scandinavia, Inghilterra","s":["Alberto di Hohenzollern secolarizza l'Ordine teutonico: Ducato di Prussia. Dieta di Spira (1529): protesta di 6 principi e 14 città → «protestanti». Augusta (1530): Confessio Augustana di Melantone. 1531: Lega di Smalcalda (Sassonia, Assia).","Scandinavia: Unione di Kalmar (1397); massacro di Stoccolma (1520); Gustavo Vasa re di Svezia indipendente (1523), Chiesa nazionale dal 1527; Danimarca: Cristiano III impone il luteranesimo nel 1536 (anche Norvegia e Islanda).","Calvinismo: Palatinato, Württemberg, Francia (ugonotti), Paesi Bassi, Ungheria, Polonia, Boemia, Scozia.","Inghilterra: Atto di supremazia (1534), monasteri soppressi, Bibbia in volgare; puritani sotto Elisabetta."],"p":[]},{"id":"r-radicale","ch":"riforma","t":"La Riforma radicale","s":["Espressione resa celebre da G. H. Williams (1962).","Anabattisti: battesimo degli adulti, rifiuto di giuramenti, cariche e forza; repressi dopo Spira 1529. Millenarismo: Hoffmann (Strasburgo 1533); Münster 1534 con Giovanni di Leida; poi i mennoniti pacifisti di Menno Simons.","Nicodemismo (termine di Calvino). Aconcio, Stratagemata Satanae (1564): fundamentalia fidei e adiaphora.","Antitrinitari: Serveto, Lelio Sozzini (1525-1562, morto a Zurigo), Fausto Sozzini (1539-1604) a Cracovia; comunità sociniane, centro Raków; influenza su Locke."],"p":[]},{"id":"c12-stati","ch":"cap-12","t":"Gli Stati italiani nel Quattrocento","s":["Pace di Lodi (1454): Napoli, Stato della Chiesa, Milano, Firenze, Venezia; garante Lorenzo il Magnifico († 1492).","Napoli: feudo papale; Ferdinando I d'Aragona (1458-1494); congiura dei baroni (1485).","Stato della Chiesa: Roma e Italia centrale; enclavi di Benevento e Pontecorvo (1463), Avignone e Contado venassino; papi a Roma dal 1420; Orsini e Colonna; vicari; piccolo e grande nepotismo.","Milano: 9 province (Milano, Pavia, Lodi, Cremona, Como, Novara, Tortona, Alessandria, Vigevano); dai Visconti a Francesco Sforza; Ludovico il Moro tutore di Gian Galeazzo.","Firenze: Pisa (1406), Livorno (1421); Medici dal 1434 (Cosimo il Vecchio, poi Lorenzo).","Venezia: serrata del Maggior Consiglio (circa 2.500 membri), Senato, doge a vita, cittadini originari (circa 10.000). Stato da terra (Veneto, Friuli, Brescia, Bergamo, Crema) e da mar (Istria, Dalmazia, isole Ionie, Creta, Cipro).","Altri: Ferrara-Modena-Reggio (Este), Mantova (Gonzaga, ducato nel 1530), Savoia (duchi dal 1416, capitale Chambéry; Saluzzo, Monferrato e Asti indipendenti)."],"p":[]},{"id":"c12-carloviii","ch":"cap-12","t":"Carlo VIII e Savonarola (1494-1495)","s":["1492: muore Lorenzo, eletto Alessandro VI (Rodrigo Borgia). Valois: diritti su Napoli (angioini, domini passati alla corona nel 1481) e Milano (Visconti).","1494: Carlo VIII cede Cerdagne e Roussillon alla Spagna, Franca Contea e Artois a Massimiliano; Ludovico il Moro lo favorisce.","Firenze: Piero de' Medici cede piazzeforti e viene cacciato; prima Repubblica (1494-1512); Savonarola, priore di San Marco: Consiglio grande (circa 3.000), Consiglio degli Ottanta; piagnoni, arrabbiati, bigi o palleschi.","22 febbraio 1495: Carlo VIII a Napoli. Lega antifrancese (Venezia, Milano, papa, Ferdinando, Massimiliano); Fornovo sul Taro (6 luglio 1495). Gonzalo de Córdoba rimette Ferrandino sul trono."],"p":["Savonarola fu scomunicato nel 1497 e giustiziato a Firenze, in piazza della Signoria, il 23 maggio 1498.","Carlo VIII morì nel 1498 ad Amboise per aver battuto la testa contro l'architrave di una porta."]},{"id":"c12-luigixii","ch":"cap-12","t":"Luigi XII, Napoli spagnola, Cesare Borgia","s":["Luigi XII (Valois-Orléans, dal 1498) rivendica Milano tramite Valentina Visconti (1387); patto con Venezia (Cremona e Ghiara d'Adda). Cesare Borgia ottiene il Valentinois.","Ludovico il Moro sconfitto a Novara (10 aprile 1500), muore prigioniero; gli Svizzeri prendono Bellinzona.","Trattato di Granada (11 novembre 1500): Francia Campania e Abruzzo, Spagna Calabria e Puglia; poi guerra. Garigliano (1503), armistizio di Lione (marzo 1504): Napoli alla Spagna.","Cesare Borgia, gonfaloniere della Chiesa, conquista Romagna e Marche (modello di «principe nuovo» per Machiavelli); morto Alessandro VI (1503) e dopo Pio III, Giulio II lo abbatte; muore nel 1507 in Spagna."],"p":[]},{"id":"c12-giulioii","ch":"cap-12","t":"Giulio II, Cambrai e Lega Santa","s":["Giulio II (1503) riprende Perugia e Bologna. Venezia aveva preso Rimini e Faenza, porti pugliesi, Cremona, Gorizia, Trieste, Fiume.","Lega di Cambrai (1508): papa, Spagna, Francia, Impero. Agnadello (14 maggio 1509): Venezia sconfitta; poi recupera ma chiude l'espansione.","Contro il concilio di Pisa di Luigi XII: V Concilio Lateranense e Lega Santa («Fuori i barbari!»). Ravenna (11 aprile 1512): vittoria francese inutile; Milano a Massimiliano Sforza; Ferdinando prende la Navarra.","1512: sacco di Prato, tornano i Medici; 1513: Leone X. Machiavelli scrive Il Principe (1513, pubblicato nel 1532)."],"p":["Dopo il ritorno dei Medici, nel 1513 Machiavelli fu sospettato di aver partecipato a una congiura, imprigionato e torturato; poi si ritirò all'Albergaccio di Sant'Andrea in Percussina, dove scrisse Il Principe."]},{"id":"c12-carlov","ch":"cap-12","t":"Francesco I contro Carlo V (1515-1526)","s":["Francesco I (Valois-Angoulême, 1515): Marignano (14-15 settembre 1515), Milano francese; agli Svizzeri il Ticino. Pace di Noyon (1516): Milano alla Francia, Napoli alla Spagna.","Carlo, nato a Gand il 25 febbraio 1500 (Filippo il Bello e Giovanna): Paesi Bassi (1506), Spagna come Carlo I (1516), Austria e imperatore il 28 giugno 1519 (con i Fugger e i Welser).","Comuneros castigliani (1520) sconfitti a Villalar (23 aprile 1521). Austria a Ferdinando (1522).","Bicocca (1522): Milano a Francesco II Sforza; papa Adriano VI; Carlo di Borbone passa all'Impero. Pavia (24 febbraio 1525): Francesco I prigioniero; trattato di Madrid (14 gennaio 1526), non rispettato."],"p":["A Francesco I, dopo Pavia, è tradizionalmente attribuita la frase «Tutto è perduto fuorché l'onore»."]},{"id":"c12-sacco","ch":"cap-12","t":"Cognac, sacco di Roma, Doria, Bologna","s":["Lega di Cognac (1526): Francia, Inghilterra, Clemente VII (papa dal 1523), Firenze, Venezia, Francesco II Sforza.","12.000 lanzichenecchi con Carlo di Borbone; muore Giovanni dalle Bande Nere. Sacco di Roma (maggio 1527): Borbone ucciso, papa in Castel Sant'Angelo. Seconda Repubblica fiorentina (1527-1530).","1528: Andrea Doria lascia la Francia per Carlo V (blocco di Napoli tolto); 12 settembre torna a Genova: repubblica oligarchica, libro d'oro, doge biennale.","Pace di Cambrai o «delle due dame» (1529: Luisa di Savoia e Margherita d'Austria). Incoronazione a Bologna, San Petronio (24 febbraio 1530); Asti ai Savoia. Firenze si arrende nell'agosto 1530 (Michelangelo alle fortificazioni): Alessandro de' Medici, duca dal 1532."],"p":["Benvenuto Cellini, nella sua autobiografia, sostiene di essere stato lui a sparare il colpo che uccise Carlo di Borbone (versione non verificabile)."]},{"id":"c13-progetto","ch":"cap-13","t":"Il progetto imperiale di Carlo V","s":["Gattinara, gran cancelliere dal 1518, ispira la monarchia universale (cfr. De monarchia di Dante); muore nel 1530.","1531: Ferdinando re dei Romani; Maria (vedova di Luigi II) reggente dei Paesi Bassi; consiglieri Granvelle e Cobos.","Motto Plus Ultra (1516); Erasmo gli dedica l'Institutio principis christiani. Discorso di Roma (17 aprile 1536): non vuole essere monarca del mondo.","1538: Cortes castigliane ridotte ai rappresentanti delle città. 1548: istruzioni a Filippo (Italia e Fiandre)."],"p":[]},{"id":"c13-turchi","ch":"cap-13","t":"La minaccia ottomana","s":["Mohács (29 agosto 1526): Solimano batte gli Ungheresi, muore Luigi II Jagellone. Ferdinando ottiene la Boemia; in Ungheria lo contrasta Szapolyai.","Assedio di Vienna (1529); pace del 1533 (Ungheria imperiale a Ferdinando); 1541 provincia ottomana di Buda e Transilvania vassalla; trattato del 1562.","Mediterraneo: Barbarossa prende Algeri (1529). Carlo prende Tunisi e La Goletta (1535). Prevesa (27 settembre 1538): sconfitta cristiana. Algeri (1541): flotta distrutta da una tempesta."],"p":["Gli Ottomani tornarono ad assediare Vienna nel 1683 e furono respinti con l'intervento del re di Polonia Giovanni III Sobieski."]},{"id":"c13-francia","ch":"cap-13","t":"Guerre con la Francia e opposizioni italiane","s":["1535: muore Francesco II Sforza, Milano direttamente a Carlo V; 1536 Francesco I in Savoia e a Torino. Tregua di Nizza (1538, dieci anni). 1542 nuova guerra (Barbarossa con la Francia). Gheldria agli Asburgo. Pace di Crépy (1544).","Firenze: Lorenzino uccide Alessandro (1537); Cosimo I duca, granduca nel 1569.","Paolo III crea il Ducato di Parma e Piacenza (1545) per Pier Luigi Farnese, ucciso nel 1547 per ordine di Ferrante Gonzaga.","Siena: caccia gli spagnoli nel 1552, cade nel 1555 (ultimi a Montalcino), poi a Cosimo."],"p":[]},{"id":"c13-germania","ch":"cap-13","t":"Germania, Augusta e abdicazioni","s":["Lega di Smalcalda (1531); fallimento di Ratisbona (1541). Mühlberg (1547): vittoria di Carlo; Interim (1547-1548).","1551: i principi promettono a Enrico II Metz, Toul e Verdun; Carlo fugge da Innsbruck.","Pace di Augusta (25 settembre 1555): cuius regio, eius religio (solo cattolici e luterani), anno normale 1552, reservatum ecclesiasticum.","Tregua di Vaucelles (1556). Abdicazioni: Paesi Bassi (25 ottobre 1555) e Spagna (16 gennaio 1556) a Filippo; Impero a Ferdinando. Morte a Yuste il 21 settembre 1558."],"p":[]},{"id":"c14-ordini","ch":"cap-14","t":"Rinnovamento e nuovi ordini","s":["Riforma cattolica (rinnovamento) e Controriforma (risposta repressiva).","Lateranense V (1511-1516, Giulio II): Egidio da Viterbo. Libellus ad Leonem decimum (1513): Bibbia in volgare (respinta).","Ordini: oratori del divino amore; cappuccini (1528); teatini (Gaetano da Thiene e Carafa); barnabiti, somaschi; orsoline (1535, Angela Merici).","Compagnia di Gesù: Parigi 1534, approvata da Paolo III nel 1540; quarto voto di obbedienza al papa; Esercizi spirituali; oltre 500 collegi; Ratio studiorum (1599)."],"p":["Ignazio di Loyola fu ferito nel 1521 durante la difesa di Pamplona; la sua conversione avvenne durante la convalescenza."]},{"id":"c14-italia","ch":"cap-14","t":"Riforma in Italia e Sant'Uffizio","s":["Paolo III (1534-1549): Consilium de emendanda ecclesia (1536); cardinali Contarini, Pole, Bembo.","Idee riformate a Venezia, Lucca, Modena, Ferrara, Napoli; anabattisti veneti; valdesi aderiscono nel 1532. Circolo di Juan de Valdés a Napoli († 1541); spirituali; Beneficio di Cristo (1543).","Ratisbona (1541): fallisce Contarini. 1542: Congregazione del Sant'Uffizio (Carafa). Ochino fugge a Ginevra («Cristo in mascara»)."],"p":[]},{"id":"c14-trento","ch":"cap-14","t":"Il Concilio di Trento","s":["Aperto a Trento (principato vescovile dell'Impero) nel dicembre 1545. Gennaio 1547: condannata la sola fide; 1547 trasferito a Bologna (tifo petecchiale); riaperto nel 1551 da Giulio III, sospeso nel 1552.","Paolo IV Carafa (1555): niente concilio, Morone in carcere (1557), primo Indice (1559, tutto Erasmo). Pio IV (1559-1565): ultima fase 1562-1563.","Dottrina: opere + fede; Scrittura + Tradizione; Vulgata; sette sacramenti; transustanziazione; clero distinto dai laici; indulgenze, purgatorio, santi.","Disciplina: seminari; parroci con celibato, abito talare, registri; vescovi residenti, visite ogni due anni."],"p":["Le tre fasi del concilio sono quindi 1545-1547 (Trento, poi Bologna), 1551-1552 e 1562-1563; il concilio fu chiuso nel dicembre 1563."]},{"id":"c14-dopo","ch":"cap-14","t":"Dopo Trento: papato, vescovi, Inquisizione","s":["Papato rafforzato: Congregazione del concilio; Bellarmino (Chiesa come monarchia). Sisto V (1585-1590): 15 congregazioni (6 Stato, 9 Chiesa); 1622 De Propaganda Fide.","Calendario gregoriano (1582): dal 4 al 15 ottobre. Declino internazionale (assenza a Vestfalia).","Carlo Borromeo arcivescovo di Milano dal 1565. Confessione individuale, comunione frequente; foro interno e foro esterno.","Inquisizione: abiura, relapsi; Pio V (1566-1572); valdesi di Calabria sterminati; dopo il 1580 stregoneria e costumi. Bruno al rogo (17 febbraio 1600), abiura di Galileo (1633); Bibbie in volgare all'Indice (1596).","Cantimori: «eretici di tutte le Chiese»; Jedin: tanti corsi d'acqua senza un fiume."],"p":["Giordano Bruno fu bruciato a Roma in Campo de' Fiori, dove oggi c'è la sua statua (1889)."]},{"id":"c15-inghilterra","ch":"cap-15","t":"Inghilterra e Scozia nel Cinquecento","s":["Scozia calvinista e presbiteriana con John Knox; Mary Stuart (regina dal 1561) fugge in Inghilterra nel 1568.","Enrico VIII (1509-1547): per avere un erede e sposare Anna Bolena, chiede l'annullamento da Caterina d'Aragona; Clemente VII rifiuta; Atto di supremazia (1534): «scisma senza eresia»; More giustiziato (1535).","Edoardo VI (1547-1553): Book of Common Prayer (1552). Maria Tudor (1553-1558), cattolica, moglie di Filippo II: «Bloody Mary».","Elisabetta I (1558-1603): Trentanove articoli (1571 nel cap. 15; 1563 nel cap. 17). Scomunica di Pio V (1570). Drake: circumnavigazione 1577-1580, attacco a Cadice 1587; nel 1587 Mary Stuart giustiziata."],"p":["Gli articoli furono approvati in una prima versione dalla Convocazione del clero nel 1563 e resi definitivi e obbligatori nel 1571: per questo il riassunto riporta due date.","Mary Stuart fu decapitata l'8 febbraio 1587 nel castello di Fotheringhay."]},{"id":"c15-cateau","ch":"cap-15","t":"Cateau-Cambrésis e l'Italia spagnola","s":["San Quintino (10 agosto 1557): Emanuele Filiberto di Savoia batte i francesi. Bancarotta spagnola (1557); muore Maria Tudor (1558).","Cateau-Cambrésis (3 aprile 1559): la Francia rinuncia a Milano e Napoli, rende la Corsica a Genova e i territori sabaudi; tiene Calais, Metz, Toul, Verdun, piazzeforti in Piemonte e Saluzzo.","Spagna: Milano, Napoli, isole, Stato dei Presidi; indipendente in pratica solo Venezia.","Enrico II muore in un torneo (10 luglio 1559) → crisi francese."],"p":[]},{"id":"c15-filippo","ch":"cap-15","t":"Filippo II: governo, finanze, Inquisizione","s":["Filippo II (1556-1598): austero; corte a Madrid (1559) ed Escorial; governo dal suo ufficio. Si oppone alla bolla In coena Domini (1568).","Sistema dei Consigli (di Stato, guerra, finanze; per Castiglia, Aragona, Italia, Indie, Fiandre, Portogallo); letrados; juntas.","1580: Portogallo unito alla Spagna (morti Sebastiano I in Marocco nel 1578 e il cardinale Enrico nel 1580). Motto Non sufficit orbis.","Finanze: argento americano circa 25% delle entrate; alcabala; asientos (15-20%) trasformati in juros (5-7%); bancarotte 1557, 1575, 1596; banchieri genovesi.","Inquisizione e auto da fé; rivolta dei moriscos delle Alpujarras (1568), espulsione nel 1609; marrani e limpieza de sangre.","Debolezze: Mesta (allevatori transumanti), declino del tessile (Toledo, Segovia), rivolta aragonese per i fueros (1591)."],"p":["Filippo II si sposò quattro volte: con Maria Manuela di Portogallo, Maria Tudor, Elisabetta di Valois e Anna d'Austria."]},{"id":"c15-lepanto","ch":"cap-15","t":"Lepanto (1571)","s":["1570: Selim II attacca Cipro (veneziana). Lega Santa: Venezia, papa, Cavalieri di Malta, Savoia, Genova, Spagna.","7 ottobre 1571, Lepanto (ingresso del golfo di Corinto): vince la flotta di don Giovanni d'Austria; circa 30.000 ottomani prigionieri.","Risultati limitati: obiettivi diversi; Venezia firma la pace separata nel 1573 cedendo Cipro; tregua ispano-ottomana nel 1578."],"p":["Alla battaglia di Lepanto combatté, e fu ferito alla mano sinistra, Miguel de Cervantes, il futuro autore del Don Chisciotte.","La flotta veneziana a Lepanto era comandata da Sebastiano Venier, quella ottomana da Müezzinzade Alì Pascià, che morì nella battaglia."]},{"id":"c15-paesibassi","ch":"cap-15","t":"La rivolta dei Paesi Bassi","s":["17 province (unite nel 1548), ognuna con statolder; Stati generali. Calvinismo; Granvelle consiglia la reggente Margherita.","5 aprile 1566: petizione dei nobili, i gueux («pezzenti»); estate 1566: iconoclastia. Duca d'Alba: repressione (Egmont giustiziato).","Guglielmo d'Orange guida la rivolta; «pezzenti del mare»; Olanda e Zelanda; Guglielmo calvinista dal 1573.","Bancarotta 1575; saccheggio di Anversa (1576); Pacificazione di Gand (novembre 1576). Alessandro Farnese (1578): Unione di Arras (6 gennaio 1579) per il sud; Unione di Utrecht per il nord; indipendenza all'Aia (1581).","Guglielmo ucciso il 10 luglio 1584; indipendenza riconosciuta nel 1648: Guerra degli Ottant'anni."],"p":["Guglielmo d'Orange fu ucciso a Delft da Balthasar Gérard, un cattolico fedele a Filippo II, che aveva messo una taglia sulla sua testa."]},{"id":"c15-francia","ch":"cap-15","t":"Le guerre di religione in Francia","s":["Ugonotti: primo sinodo a Parigi (1559); un terzo dei nobili; capi Giovanna d'Albret e Coligny; cattolici guidati dai Guisa.","Francesco II (1559-1560), Carlo IX (1560-1574) con Caterina de' Medici e il cancelliere de l'Hôpital. Editto di Saint-Germain (gennaio 1562) → massacro di Vassy (1° marzo 1562): 36 anni di guerre.","Pace di Saint-Germain (1570): quattro piazzeforti (La Rochelle). Notte di San Bartolomeo (24 agosto 1572), durante le nozze di Margherita di Valois ed Enrico di Navarra: oltre 2.000 morti, tra cui Coligny. Monarcomachi; politiques (Bodin, 1576).","Guerra dei tre Enrichi (dal 1584): Guisa ucciso a Blois (1588); Enrico III ucciso da Jacques Clément (1° agosto 1589). Enrico IV convertito: Chartres (febbraio 1594), Parigi (22 marzo 1594), papa (1595).","1598: pace di Vervins con la Spagna; Editto di Nantes (libertà di coscienza, culto, diritti civili, circa cento piazzeforti)."],"p":["A Enrico IV è attribuita la frase «Parigi val bene una messa», a proposito della sua conversione.","L'Editto di Nantes fu revocato da Luigi XIV nel 1685 con l'editto di Fontainebleau."]},{"id":"c15-armata","ch":"cap-15","t":"L'Invincibile Armata (1588)","s":["Piano: controllare la Manica e far sbarcare l'esercito di Alessandro Farnese dai Paesi Bassi.","1588: da Lisbona circa 130 navi e 17.000 uomini; navi pesanti, tempeste, mancato coordinamento; circumnavigazione delle isole britanniche; tornano 67 navi, un terzo degli uomini perduti.","Colpo al prestigio spagnolo, ascesa della potenza navale inglese."],"p":["La flotta spagnola era comandata dal duca di Medina Sidonia."]},{"id":"c16-francia","ch":"cap-16","t":"Francia da Enrico IV a Richelieu","s":["Enrico IV (1589-1610) con il ministro calvinista Sully: finanze, amministrazione, agricoltura. Paulette (1604): uffici ereditari → nobiltà di toga.","Ucciso da Ravaillac (14 maggio 1610); reggenza di Maria de' Medici (filospagnola); Stati generali 1614-1615 (ultimi prima del 1789); Concini favorito, ucciso nel 1617.","Richelieu: cardinale (1622), Consiglio di Stato (1624). Intendenti, repressione dei nobili, Académie française (1635), La Rochelle presa (1628), ugonotti senza garanzie militari (1629).","Dal 1630 contro gli Asburgo; taglia da 17 a 57 milioni (1614-1648); rivolte urbane (Parigi e Lione 1633, Lione 1642), croquants (1636-1637), nu-pieds (Normandia)."],"p":["Richelieu morì nel dicembre 1642 e Luigi XIII nel maggio 1643; il potere passò al cardinale Mazzarino durante la minorità di Luigi XIV.","La Fronda (1648-1653) fu la grande rivolta francese contro Mazzarino e il fisco, citata nel cap. 18."]},{"id":"c16-spagna","ch":"cap-16","t":"Spagna di Filippo III e IV","s":["Filippo III (1598-1621) e il valido duca di Lerma. Pace con l'Inghilterra (1604), tregua di 12 anni con le Province Unite (1609); espulsione di circa 300.000 moriscos (1609).","Filippo IV (1621-1665) e Olivares: arbitristas, Unión de las Armas (1626, 140.000 uomini) respinta da Catalogna, Aragona, Valencia, Portogallo.","1640: rivolta della Catalogna (1641 protezione francese; Barcellona ripresa nel 1652) e del Portogallo (Giovanni IV di Braganza; riconosciuto nel 1668). Olivares licenziato il 17 gennaio 1643; bancarotta 1647; rivolte di Napoli e Palermo."],"p":[]},{"id":"c16-province","ch":"cap-16","t":"Province Unite, Polonia e Svezia","s":["Province Unite: Maurizio di Nassau; sud sotto Alberto e Isabella (Bruxelles); Schelda bloccata (1585). Sette province: Olanda, Zelanda, Utrecht, Gheldria, Frisia, Overijssel, Groninga. Stati generali all'Aia (unanimità); statolder (Orange) contro Gran pensionario (patriziati). Arminiani (Oldenbarnevelt, giustiziato) contro gomaristi (Maurizio); Grozio fugge (1621); sinodo di Dordrecht (1618-1619).","Polonia: Unione di Lublino (1569); re elettivo, repubblica nobiliare, pacta conventa; Enrico di Valois (1573-1574), Bathory (1574-1587), Sigismondo III Vasa (1587-1632), Ladislao IV, Giovanni II Casimiro; Chiesa uniata (1596); sociniani espulsi (1658).","Svezia: monarchia ereditaria dal 1544; Riksdag e Riksråd; Carlo IX (1599-1611); Gustavo II Adolfo (1611-1632): coscrizione, ferma ventennale, armi leggere; Ingria e Carelia (1617), Livonia con Riga (1621); rame e ferro oltre il 60% dell'export."],"p":[]},{"id":"c16-guerra1","ch":"cap-16","t":"Guerra dei Trent'anni: verso il conflitto e fase boemo-palatina","s":["Augusta 1555 ignora i calvinisti (Federico IV del Palatinato, Giovanni Sigismondo di Brandeburgo). Rodolfo II (1576-1612) a Praga; Baviera centro cattolico.","1608 Unione evangelica (Federico V), 1609 Lega cattolica (Massimiliano di Baviera). Lettera di maestà (1609). Mattia imperatore (1612-1619); Ferdinando di Stiria re di Boemia (1617).","Defenestrazione di Praga (23 maggio 1618). Boemi offrono la corona a Federico V (19 agosto 1619); Ferdinando II imperatore (28 agosto 1619). Elettori cattolici: Treviri, Colonia, Magonza.","Montagna Bianca (8 novembre 1620): Federico, «re d'inverno», perde Palatinato e titolo (1623, a Massimiliano). Repressione; corona boema ereditaria (1627)."],"p":["Alla Montagna Bianca l'esercito della Lega cattolica era comandato da Johann Tserclaes conte di Tilly."]},{"id":"c16-italia","ch":"cap-16","t":"Valtellina e Monferrato","s":["Valtellina (luglio 1620): sacro macello dei protestanti; occupazione spagnola del corridoio della via di Spagna; trattato di Monçon (1626); restituita ai Grigioni nel 1639.","Monferrato: prima guerra 1612-1617 (Savoia sconfitto dalla Spagna). Seconda: alla morte di Vincenzo II (1627) erede Carlo Gonzaga-Nevers; sacco di Mantova (1630); francesi a Casale.","Trattato di Cherasco (1631): Nevers tiene Mantova e Monferrato; Savoia ottiene Alba ma cede Pinerolo alla Francia."],"p":["Il sacco di Mantova del 1630 e la peste che lo accompagnò sono lo sfondo storico dei Promessi sposi di Manzoni, amb
